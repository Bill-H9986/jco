# electron-builder 配置（M0 骨架版）
# 完整打包（内置 DSH 运行时、首次启动引导）在 M3 完成。
appId: com.jco.desktop
productName: J.Co
# GitHub Releases 会把资产名里的空格替换成点；这里直接生成无空格文件名，保证
# beta.yml / latest.yml 里的 url 和 GitHub 实际资产名一致。
artifactName: J.Co-${version}.${ext}
# 用本地已安装的 Electron（node_modules/electron/dist）：打包不再走网络下载，稳定可复现
electronDist: node_modules/electron/dist
# 不重编译原生模块：DSH 内核依赖（koffi / node-pty 等）使用随包预编译二进制，
# 与开发模式（已验证可用）保持完全一致；重编译需要 VS 工具链且无必要。
npmRebuild: false
directories:
  output: release
files:
  - main.js
  - preload.cjs
  - media-jobs.cjs
  - settings.json
  - kernel/**
  - "!kernel/model-config.json"
  - "!kernel/dynamic-model.patch.yml"
  - "!kernel/publish-session.json"
  # 运行时数据（运行中由应用/页面写入）——不进安装包。
  # 2026-10-17 修复：曾把 E2E 写进开发目录的种子任务打进包，用户装完即带着
  # 3 条启用中的自动任务（到点会真的自动跑）——教训：一切"运行时产物"必须排除。
  - "!kernel/auto-tasks.json"
  - "!kernel/auto-runs.json"
  - "!kernel/task-sessions/**"
  - "!kernel/media-jobs/**"
  # 后期工具（M9 后期）：patch 与配置由应用启动时生成，不进包
  - "!kernel/edit-tools.json"
  - "!kernel/edit-tools.patch.yml"
  - publish/**
  - dist/**
  # DSH 的部分运行时 peer 依赖不会被 electron-builder 的默认依赖树收进来；
  # 这里显式纳入完整 @deepseek-ai 包集合，避免安装版内核启动缺包。
  - node_modules/@deepseek-ai/**
asarUnpack:
  - "kernel/**"
  - "dist/**"
  - "node_modules/@deepseek-ai/**"
  - "node_modules/@ffmpeg-installer/**"
  - "node_modules/koffi/**"
  - "node_modules/node-pty/**"
  - "publish/**"
  - "node_modules/playwright/**"
  - "node_modules/playwright-core/**"
extraResources:
  - from: ../设计原型
    to: 设计原型
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
