name: 功能需求
description: 提议新的用户能力、流程或质量改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的真实问题
      description: 先写用户现在卡在哪里，不要只写一个按钮名
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 用用户能观察到的结果描述
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的其他做法

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 单页
        - 多页共享组件
        - 工作流 / 状态机
        - 数据或安全边界
        - 发布 / 安装 / 更新
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
      description: 至少写一条“怎样证明它真的做到了”
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界
      options:
        - label: 需求涉及不可逆动作，必须保留人工确认
        - label: 需求可能涉及密钥、账号、登录态或用户隐私
        - label: 需求会改变全站共享组件或设计规格
