name: Bug 报告
description: 记录可复现的功能错误、界面问题或数据风险
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先确认当前版本和页面。不要粘贴 API Key、Cookie、登录 profile、发布会话 token 或其他凭据。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页显示的版本，或安装包文件名
      placeholder: 0.6.0-beta.40
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: 页面 / 功能
      placeholder: 创作 / 素材 / 发布 / 设置
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，按顺序写清每一步
      placeholder: |
        1. 打开……
        2. 点击……
        3. 选择……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错时保留原文；截图请先检查是否含账号、密钥或隐私
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都能复现
        - 经常出现
        - 偶发
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、安装版 / 开发版、显示缩放比例

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除 Cookie、Token、账号密码、登录 profile 和其他敏感数据
          required: true
