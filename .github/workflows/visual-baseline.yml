name: Visual Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron runtime
        run: npm exec -- install-electron

      - name: Generate canonical visual baselines
        run: npm run test:visual
        env:
          JCO_UPDATE_VISUAL: "1"
          JCO_VISUAL_STRICT: "1"

      - name: Upload visual baselines
        uses: actions/upload-artifact@v7
        with:
          name: jco-visual-baseline-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: app/tests/visual/baseline/ci/
