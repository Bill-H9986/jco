name: Quality Gate

on:
  push:
    branches:
      - beta/0.6.0
      - master
  pull_request:
    branches:
      - beta/0.6.0
      - master

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron runtime
        run: npm exec -- install-electron

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high --no-fund

      - name: Verify release provenance
        run: node scripts/verify-release-provenance.mjs

      - name: Full quality gate
        run: npm run gate
        env:
          JCO_TEST_MEDIA_FAKE: "1"
          JCO_TEST_KERNEL_FAKE: "1"
          JCO_VISUAL_STRICT: "1"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jco-quality-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/quality/generated/
            app/test-results/
            app/playwright-report/
