name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact source tag, for example v0.6.0-beta.40
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron runtime
        run: npm exec -- install-electron

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high --no-fund

      - name: Verify tag provenance
        run: node scripts/verify-release-provenance.mjs --tag "${{ inputs.tag }}" --require-origin --branch beta/0.6.0

      - name: Full quality gate
        run: npm run gate
        env:
          JCO_TEST_MEDIA_FAKE: "1"
          JCO_TEST_KERNEL_FAKE: "1"
          JCO_VISUAL_STRICT: "1"

      - name: Build and publish GitHub Release
        run: npm run release:github
        env:
          JCO_GITHUB_REPO: ${{ github.repository }}
          JCO_RELEASE_BRANCH: beta/0.6.0
          JCO_UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download
          GH_TOKEN: ${{ github.token }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jco-release-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/quality/generated/
            app/test-results/
            app/playwright-report/
