<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.Co · 创作（文案 / 脚本）</title>
  <link rel="stylesheet" href="./assets/jco-ui.css">
  <script src="./assets/jco-shell.js"></script>
  <style>
/* ============ 主区 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.scroll { flex: 1; overflow-y: auto; }

.wrap { max-width: none; margin: 0 auto; padding: 30px 32px 70px; }

.head h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }

.head .sub { margin-top: 7px; font-size: 14px; color: var(--text-2); }

/* 来历条 */
  .from {
    margin-top: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--tint); border-radius: 20px; padding: 13px 18px;
    font-size: 14px; color: var(--text-2);
  }

.from .ti { font-size: 16px; color: var(--text-2); }

.from b { color: var(--text-1); font-weight: 600; }

.from .src { color: var(--text-3); font-size: 13px; }

.from .src em { font-style: normal; color: var(--accent); }

.from .btns { display: flex; gap: 8px; margin-left: auto; }

/* 弹层（自己出题） */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20, 20, 24, 0.32);
    display: none; align-items: center; justify-content: center; padding: 30px;
  }

.overlay.show { display: flex; }

.sheet {
    width: 100%; max-width: 460px;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow-modal);
    padding: 24px 26px 20px;
  }

.sheet h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

.sheet .sub { margin-top: 6px; font-size: 13px; color: var(--text-2); line-height: 1.6; }

.sheet .field { margin-top: 14px; }

.sheet input {
    width: 100%; border: 0.5px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text-1);
    font-family: inherit; font-size: 14px; padding: 11px 13px; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

.sheet input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 128, 255, 0.12); }

.sheet input:focus-visible { outline: none; }

.sheet .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* 两栏 */
  .cols { display: flex; gap: 16px; margin-top: 16px; align-items: flex-start; }

/* 稿纸 */
  .paper {
    flex: 1; min-width: 0;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    padding: 24px 26px 18px;
  }

.paper-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }

.ptitle { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }

.checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.check {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--green); font-weight: 600;
    background: rgba(36, 138, 61, 0.1); border-radius: 999px; padding: 3px 10px;
  }

.check.warn { color: #b25000; background: rgba(255, 140, 40, 0.13); }

.script {
    margin-top: 18px; border-top: 0.5px solid var(--line); padding-top: 18px;
    border-radius: 12px; padding-left: 10px; padding-right: 10px; margin-left: -10px; margin-right: -10px;
    transition: box-shadow 0.2s ease;
  }

.script:focus { box-shadow: 0 0 0 3px rgba(0, 128, 255, 0.12); }

.script:focus-visible { outline: none; }

.script p {
    font-size: 16px; line-height: 2; color: var(--text-1);
    padding: 1px 0;
  }

.script p + p { margin-top: 2px; }

.script p.hl { color: var(--text-2); }

.edit-hint { font-size: 12px; color: var(--text-3); }

.paper-foot { display: flex; align-items: center; gap: 10px; margin-top: 18px; border-top: 0.5px solid var(--line); padding-top: 14px; }

.paper-foot .spacer { flex: 1; }

/* AI 改稿条 */
  .ai-bar {
    display: flex; gap: 10px; align-items: center;
    max-width: none; margin: 0 74px 0 0;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    padding: 12px 14px 12px 20px;
  }

.ai-bar .ti { font-size: 18px; color: var(--accent); flex: none; }

.ai-bar input {
    flex: 1; border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 14px; color: var(--text-1);
  }

.ai-bar input:focus-visible { outline: none; }

.ai-bar input::placeholder { color: var(--text-3); }

.ai-bar .ghost { flex: none; }

/* 设定卡 */
  .settings {
    width: 268px; flex: none;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    padding: 20px 20px 18px;
  }

.settings h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

.set-field { margin-top: 16px; }

.set-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }

.static-val { font-size: 14px; color: var(--text-1); }

.ai-state { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--green); font-weight: 600; }

.ai-state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

.regen {
    width: 100%; margin-top: 20px; height: 40px; border: none; border-radius: 999px;
    background: var(--accent); color: #ffffff; font-family: inherit;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

.regen:hover { background: var(--accent-strong); }

.regen:active { transform: scale(0.98); }

.regen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.note { margin-top: 12px; font-size: 12px; color: var(--text-3); line-height: 1.6; }

/* 底部动作 */
  .foot-actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }

.foot-actions .spacer { flex: 1; }

.anim { opacity: 0; transform: translateY(10px); }

.anim.in { opacity: 1; transform: none; transition: opacity 0.4s var(--ease), transform 0.4s var(--ease); }

/* Toast */
  /* 提词器（全屏） */
  .prompter { position: fixed; inset: 0; z-index: 80; background: rgba(18, 18, 22, 0.97); display: flex; flex-direction: column; }

.prompter[hidden] { display: none; }

.pr-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 16px; padding: 80px 40px; overflow-y: auto; }

.pr-line { font-size: 24px; line-height: 1.7; color: rgba(245, 245, 247, 0.32); transition: color 0.2s ease; max-width: 880px; text-align: center; flex: none; }

.pr-line.past { opacity: 0.4; }

.pr-line.now { color: #ffffff; font-size: 32px; font-weight: 600; }

.pr-bar { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 16px; border-top: 0.5px solid rgba(255, 255, 255, 0.12); }

.pr-bar .ghost { background: rgba(255, 255, 255, 0.1); color: #ffffff; }

.pr-bar .ghost:hover { background: rgba(255, 255, 255, 0.18); }

.pr-progress { color: rgba(245, 245, 247, 0.6); font-size: 13px; min-width: 64px; text-align: center; }

/* 底部常驻操作条 */
  .pinbar {
    flex: none; padding: 8px 32px 14px;
    background: transparent; border-top: none;
  }

.pinbar > * { margin-top: 0 !important; max-width: none; margin-left: 0; margin-right: 74px; }

/* DSH 规范：正圆与胶囊保持圆弧（其余圆角走超椭圆） */
  .me .ava, .mm-head .ava, .msg.ai .ava, .card .go, .send, .ghost, .ghost-btn, .btn-sm, .act,
  .cp-act, .cp-send, .agent-chip, .badge, .b-role, .s-badge, .stage, .r-dot,
  .dot, .prog .track, .prog .fill, .prow .pbar, .prow .pf2, .toast,
  .pf .pfck, .seg button, .go-btn, .copilot-btn, .acc .pfp, .use-btn,
  .tag, .star, .check, .ai-state .dot, .regen, .agent-tabs, .agent-tabs button,
  .tool, .model-pill, .send-big, .draft .dprog, .draft .dprog .dfill,
  .draft .open, .ib-count, .ib-nav, .step .dot, .track, .fill, .shot .swap,
  .export-btn, .play-btn, .playhead::after, .lava, .planrow .ps, .s-pbar,
  .s-pfill, .s-badge::before { corner-shape: round; }

@media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.24); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); border-radius: 999px; }
  }

@media (max-width: 1000px) {
    .cols { flex-direction: column; }
    .settings { width: 100%; }
  }

@media (max-width: 860px) { .sidebar { display: none; } .wrap { padding: 24px 18px 60px; } }
  </style>
<script>
  /* 提前恢复侧栏展开状态，避免页面加载时闪一下 */
  try { if (localStorage.getItem('jco-side-pinned') === '1') document.documentElement.classList.add('side-pinned'); } catch (e) {}
</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-inner">
      <div class="side-top">
        <div class="wordmark">J.Co</div>
        <button class="side-toggle" aria-label="固定展开侧栏" title="点一下固定展开，再点收起"><span class="ti ti-layout-sidebar-left-expand"></span></button>
      </div>
      <div class="search"><span class="ti ti-search"></span><input placeholder="搜索"></div>
      <div class="newchat" id="newChatSlot"></div>
      <nav class="nav">
        <button class="nav-item"><span class="ti ti-message-plus"></span>总管</button>
        <button class="group-label" type="button"><span class="ti ti-layout-grid"></span>工作台<span class="ti ti-chevron-down"></span></button>
        <button class="nav-item"><span class="ti ti-bulb"></span>选题</button>
        <button class="nav-item"><span class="ti ti-photo"></span>素材</button>
        <button class="nav-item active"><span class="ti ti-file-text"></span>文案</button>
        <button class="nav-item"><span class="ti ti-video"></span>创作</button>
        <button class="nav-item"><span class="ti ti-wand"></span>后期</button>
        <button class="nav-item"><span class="ti ti-upload"></span>发布</button>
        <button class="nav-item"><span class="ti ti-chart-bar"></span>运营</button>
        <button class="group-label" type="button"><span class="ti ti-tool"></span>工具<span class="ti ti-chevron-down"></span></button>
        <button class="nav-item"><span class="ti ti-clock-play"></span>自动任务</button>
        <button class="nav-item"><span class="ti ti-sparkles"></span>技能库</button>
        <button class="nav-item"><span class="ti ti-users-group"></span>管家团队</button>
        <button class="nav-item"><span class="ti ti-key"></span>账号中心</button>
      </nav>
      <button class="group-label" type="button"><span class="ti ti-messages"></span>对话<span class="ti ti-chevron-down"></span></button>
      <div class="convos">
        <button class="convo"><span class="name">示例项目 · 今日发布</span></button>
        <button class="convo"><span class="name">评论跟进（5 条）</span></button>
        <button class="convo"><span class="name">上周数据复盘</span></button>
        <button class="convo"><span class="name">引流名单 · 待跟进</span></button>
        <button class="convo"><span class="name">视频脚本草稿</span></button>
        <button class="convo"><span class="name">技能库询价</span></button>
      </div>
      <div class="side-foot">
        <div class="me" id="meBtn" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false"><div class="ava">J</div><span>Jay</span></div>
        <button class="icon-btn" aria-label="通知"><span class="ti ti-bell"></span></button>
      </div>
          </div>
      <div class="me-menu" id="meMenu" hidden role="menu" aria-label="账号菜单">
        <div class="mm-head"><div class="ava">J</div><div class="mm-who"><b>Jay</b><span>软件账号 · 仅本机</span></div></div>
        <div class="mm-sep"></div>
        <button class="mm-item" id="mmSettings" role="menuitem"><span class="ti ti-settings"></span>设置</button>
        <button class="mm-item" id="mmLogout" role="menuitem"><span class="ti ti-logout"></span>退出登录</button>
      </div>
    </aside>

    <main class="main">
      <div class="scroll">
        <div class="wrap">
          <div class="head">
            <h1>创作</h1>
            <div class="sub">把选好的题，写成能照着念的稿子。</div>
          </div>

          <div class="from">
            <span class="ti ti-bulb"></span>
            <span>正在写：<b id="topicName">《把一件事讲清楚，其实就 3 步》</b></span>
            <span class="src" id="topicSrc">这条主题是<b>你选的</b>（来自「选题」） · 结构学自 <em>@示例账号</em> 的爆款</span>
            <span class="btns">
              <button class="ghost mini" onclick="changeTopic()">换主题</button>
              <button class="ghost mini" onclick="openOwn()">自己出题</button>
            </span>
          </div>

          <div class="cols">
            <div class="paper anim">
              <div class="paper-top">
                <div>
                  <div class="ptitle" id="paperTitle">把一件事讲清楚，其实就 3 步</div>
                  <div class="checks" id="checks">
                    <span class="check">钩子有力</span>
                    <span class="check">节奏顺</span>
                    <span class="check">口语自然</span>
                    <span class="check">AI 味：低</span>
                  </div>
                </div>
              </div>
              <div class="script" id="script" contenteditable="true" spellcheck="false" aria-label="稿子（可直接编辑）"></div>
              <div class="paper-foot">
                <button class="ghost" onclick="copyAll()"><span class="ti ti-copy"></span>复制全文</button>
                <span class="edit-hint">稿子可以直接点着改</span>
                <span class="spacer"></span>
                <button class="ghost" id="toNotes" onclick="toXhs()">改成小红书版</button>
              </div>
            </div>

            <aside class="settings anim">
              <h3>写法设定</h3>
              <div class="set-field">
                <label>形态</label>
                <div class="static-val">口播稿 · 知识分享类</div>
              </div>
              <div class="set-field">
                <label>开头吸引力</label>
                <div class="seg" id="segHook">
                  <button data-v="标准">标准</button>
                  <button class="on" data-v="更抓人">更抓人</button>
                </div>
              </div>
              <div class="set-field">
                <label>口语程度</label>
                <div class="seg" id="segTone">
                  <button data-v="文一点">文一点</button>
                  <button class="on" data-v="适中">适中</button>
                  <button data-v="很口语">很口语</button>
                </div>
              </div>
              <div class="set-field">
                <label>AI 味处理</label>
                <div class="ai-state"><span class="dot"></span>已开启 · 检测通过（像真人写的）</div>
              </div>
              <button class="regen" id="regen">重新生成一版</button>
              <div class="note">不满意就多按几次。每一次都会换一种说法，数据越用越懂你。</div>
            </aside>
          </div>


          <div class="foot-actions anim">
            <button class="ghost" onclick="openPrompter()">送去提词器</button>
            <span class="spacer"></span>
            <button class="go-btn" onclick="toMakeVideo()">开始做视频<span class="ti ti-arrow-right"></span></button>
          </div>
        </div>
      </div>
      <div class="pinbar">
        <div class="ai-bar anim">
            <span class="ti ti-wand"></span>
            <input id="fixInp" placeholder="对哪儿不满意直接说：比如「开头温和点」「加一句机构名字」「压到 30 秒」">
            <button class="ghost" onclick="fixGo()">按我说的改</button>
          </div>
      </div>
    </main>
  </div>

  <!-- 右下角·总管助手 -->
  <button class="copilot-btn" id="copilotBtn" aria-label="打开总管助手"><span class="ti ti-message-dots"></span></button>
  <div class="copilot" id="copilot" hidden>
    <div class="cp-head">
      <span class="cp-ava">J</span>
      <span class="cp-title">总管</span>
      <span class="cp-sub">问点啥都行</span>
      <button class="cp-fold" id="cpFold" aria-label="收起助手"><span class="ti ti-chevron-down"></span></button>
    </div>
    <div class="cp-body" id="cpBody">
      <div class="cp-msg ai">在的。想问点什么？比如这条视频的实时数据。</div>
      <div class="cp-acts">
        <button class="cp-act" data-q="这条视频数据怎么样？">这条视频数据怎么样？</button>
        <button class="cp-act" data-q="今天还剩什么事？">今天还剩什么事？</button>
        <button class="cp-act" data-q="评论有什么动静？">评论有什么动静？</button>
      </div>
    </div>
    <div class="cp-inp">
      <textarea id="cpInp" rows="1" placeholder="问总管，比如：这条视频现在多少播放"></textarea>
      <button class="cp-send" id="cpSend" aria-label="发送"><span class="ti ti-arrow-up"></span></button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <!-- 提词器（全屏，照着念） -->
  <div class="prompter" id="prompter" hidden>
    <div class="pr-view" id="prView"></div>
    <div class="pr-bar">
      <button class="ghost" id="prPrev">上一句</button>
      <button class="ghost" id="prPlay">自动播</button>
      <button class="ghost" id="prNext">下一句</button>
      <span class="pr-progress" id="prProgress">1 / 1</span>
      <button class="ghost" id="prExit">退出（Esc）</button>
    </div>
  </div>

  <div class="overlay" id="ownOverlay" onclick="if(event.target===this)closeOwn()">
    <div class="sheet" role="dialog" aria-label="自己出题">
      <h3>自己出题</h3>
      <div class="sub">你想写什么，直接说。AI 只管写，题由你定。</div>
      <div class="field"><input id="ownInp" placeholder="例如：讲讲用户使用前后的真实变化"></div>
      <div class="foot">
        <button class="ghost" onclick="closeOwn()">取消</button>
        <button class="go-btn sm" onclick="ownGo()">开始写</button>
      </div>
    </div>
  </div>

  <script>
    /* ---------- 三版稿子（原型演示用） ---------- */
    const VERSIONS = [
      {
        kind: 'koubo-a',
        lines: [
          '别被网上那些流程吓到。',
          '把一件事讲清楚，其实就三步，两分钟讲完。',
          '第一步，定学校和专业。这个最花时间，今天就能定下来。',
          '第二步，备齐三样东西。身份证明、相关材料、两寸照片。',
          '第三步，网上填报。十分钟的事，别拖到最后一天。',
          '对了，这次的活动截止比往年早半个月。',
          '想报的抓紧，错过真的要再等一年。',
          '我是 J.Co，帮你把这件事整明白。',
        ],
      },
      {
        kind: 'koubo-b',
        lines: [
          '去年有个人，就晚了三天。',
          '窗口一关，整整多等了一年。',
          '把一件事讲清楚，其实就三步。',
          '第一步，定学校和专业。今天就能定，别在这卡住。',
          '第二步，备齐三样东西。身份证明、相关材料、两寸照片。',
          '第三步，网上填报。十分钟的事，当天就能搞定。',
          '今年截止时间比往年早半个月，现在就去看你省里的公告。',
          '我是 J.Co，帮你把这件事整明白。',
        ],
      },
      {
        kind: 'xhs',
        lines: [
          '把一件事讲清楚，其实就 3 步（避坑版）',
          '',
          '大家好，最近被问爆了：参与麻烦吗？',
          '不麻烦，就 3 步：',
          '',
          '第 1 步：定学校和专业，今天就能定',
          '第 2 步：备齐身份证明、相关材料、照片',
          '第 3 步：网上填报，10 分钟搞定',
          '',
          '提醒：今年截止比往年早半个月，别再拖',
          '不懂的评论区问我，看到都会回',
        ],
      },
    ];

    let vIndex = 0;
    let xhsMode = false;

    const scriptEl = document.getElementById('script');
    const toastEl = document.getElementById('toast');
    const paperTitle = document.getElementById('paperTitle');

    /* ---------- 真内核模式（桌面应用里启用；浏览器直开保持演示） ---------- */
    const JCO_KERNEL = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel) ? window.jco.kernel : null;
    const GEN_SYSTEM = [
      '你是「J.Co」自媒体工作台里的文案写手，服务通用自媒体创作者的短视频口播稿与小红书图文；具体行业、受众、平台由品牌档案决定。',
      '规则：',
      '- 简体中文，口语化，像真人对着镜头说话；自然、有信息量，避免书面腔和 AI 套话（如"在这个快节奏的时代"）。',
      '- 直接输出稿子正文；每句话单独一行；不要解释、不要标题、不要序号、不要 markdown 符号、不要引号包裹。',
      '- 口播稿 8~14 行；小红书版 8~12 行短句、段间空行、结尾引导评论。',
    ].join('\n');
    let genBusy = false;
    let brandProfile = null;
    let currentScript = null;
    let scriptReady = false;
    let editSaveTimer = null;

    function brandLine() {
      if (!brandProfile || typeof brandProfile !== 'object') return '';
      var parts = [];
      if (brandProfile.industry) parts.push('行业：' + brandProfile.industry);
      if (brandProfile.audience) parts.push('受众：' + brandProfile.audience);
      if (Array.isArray(brandProfile.platforms) && brandProfile.platforms.length) parts.push('平台：' + brandProfile.platforms.join('、'));
      if (brandProfile.tone) parts.push('语气：' + brandProfile.tone);
      if (Array.isArray(brandProfile.forbidden) && brandProfile.forbidden.length) parts.push('禁用表达：' + brandProfile.forbidden.join('、'));
      return parts.length ? parts.join('；') : '';
    }
    function writerSystemPrompt() {
      var brand = brandLine();
      return brand ? GEN_SYSTEM + '\n品牌档案：' + brand : GEN_SYSTEM;
    }
    async function hydrateBrandProfile() {
      if (!window.jco || !window.jco.brand || !window.jco.brand.get) return;
      try {
        var res = await window.jco.brand.get();
        if (res && res.ok) brandProfile = res.data || null;
      } catch (e) {}
    }

    /* ---------- J.Co 本地状态层：活动日志 ---------- */
    function jcoLogAdd(kind, title, detail) {
      try {
        var data = JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}');
        data.items.unshift({ t: Date.now(), kind: kind, title: String(title || '').slice(0, 80), detail: String(detail || '').slice(0, 160) });
        if (data.items.length > 200) data.items.length = 200;
        localStorage.setItem('jco-log-v1', JSON.stringify(data));
      } catch (e) {}
    }
    /** 完事提醒（真：系统通知；可在设置页关掉） */
    function jcoNotifyDone(title, body) {
      try {
        var settings = (window.jco && window.jco.settings && window.jco.settings.getSync) ? window.jco.settings.getSync() : null;
        if (settings && settings.notifyDone === false) return;
        if (!settings) { try { if (localStorage.getItem('jco-notify-done') === '0') return; } catch (e) {} }
        var sys = (typeof window.jco !== 'undefined' && window.jco && window.jco.sys) ? window.jco.sys : null;
        if (sys && sys.notify) sys.notify({ title: title, body: body });
      } catch (e) {}
    }

    function topicText() { return paperTitle.textContent.trim(); }
    function controls() {
      const hook = document.querySelector('#segHook button.on');
      const tone = document.querySelector('#segTone button.on');
      return { hook: hook ? hook.dataset.v : '标准', tone: tone ? tone.dataset.v : '适中' };
    }
    function cleanLines(text) {
      return String(text).split('\n').map((l) => l
        .replace(/^#{1,6}\s*/, '')
        .replace(/^[-•*]\s+/, '')
        .replace(/^\d{1,2}[.、)]\s+/, '')
        .trim());
    }

    /** 复制全文：真复制到系统剪贴板（桌面应用与浏览器都可用） */
    function copyAll() {
      const text = Array.from(scriptEl.querySelectorAll('p')).map((p) => p.textContent).join('\n').trim();
      if (!text) { showToast('稿子还空着，先写出来再复制。'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { showToast('稿子已复制，可以直接拿去拍。'); },
          function () { showToast('没复制成，手动全选复制一下。'); }
        );
        return;
      }
      showToast('没复制成，手动全选复制一下。');
    }

    /** 带着当前主题去「做视频」页（交接给下一页） */
    async function toMakeVideo() {
      const saved = await persistEditedScript();
      if (!saved) return;
      if (JCO_KERNEL) {
        try { sessionStorage.setItem('jco-make-topic', topicText()); } catch (e) {}
        location.href = 'J.Co工作台-做视频.html';
        return;
      }
      showToast('（原型示意）正式版会带着稿子和素材，直接进入「创作」。');
    }

    /* ---------- 提词器（真：全屏照着念） ---------- */
    let prLines = [];
    let prIndex = 0;
    let prTimer = null;
    function openPrompter() {
      prLines = Array.from(scriptEl.querySelectorAll('p'))
        .map((p) => p.textContent.trim())
        .filter((l) => l && l !== '\u00A0');
      if (prLines.length === 0) { showToast('稿子还空着，先写出来再提词。'); return; }
      prIndex = 0;
      renderPrompter();
      document.getElementById('prompter').hidden = false;
    }
    function renderPrompter() {
      const view = document.getElementById('prView');
      view.innerHTML = '';
      prLines.forEach((line, i) => {
        const el = document.createElement('div');
        el.className = 'pr-line' + (i === prIndex ? ' now' : (i < prIndex ? ' past' : ''));
        el.textContent = line;
        view.appendChild(el);
      });
      document.getElementById('prProgress').textContent = (prIndex + 1) + ' / ' + prLines.length;
      const now = view.querySelector('.pr-line.now');
      if (now && now.scrollIntoView) now.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    function prGo(delta) {
      const next = Math.max(0, Math.min(prLines.length - 1, prIndex + delta));
      if (next === prIndex) return;
      prIndex = next;
      renderPrompter();
    }
    function prTogglePlay() {
      const btn = document.getElementById('prPlay');
      if (prTimer) {
        clearInterval(prTimer);
        prTimer = null;
        btn.textContent = '自动播';
        return;
      }
      btn.textContent = '暂停';
      prTimer = setInterval(() => {
        if (prIndex >= prLines.length - 1) { prTogglePlay(); return; }
        prGo(1);
      }, 4000);
    }
    function closePrompter() {
      document.getElementById('prompter').hidden = true;
      if (prTimer) {
        clearInterval(prTimer);
        prTimer = null;
        const btn = document.getElementById('prPlay');
        if (btn) btn.textContent = '自动播';
      }
    }
    document.getElementById('prNext').addEventListener('click', () => prGo(1));
    document.getElementById('prPrev').addEventListener('click', () => prGo(-1));
    document.getElementById('prPlay').addEventListener('click', prTogglePlay);
    document.getElementById('prExit').addEventListener('click', closePrompter);
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('prompter').hidden) return;
      if (e.key === 'Escape') closePrompter();
      else if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); prGo(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prGo(-1); }
    });

    /* ---------- 体检徽章（生成后用内核真评估） ---------- */
    const CHECK_LABELS = {
      hook: { 强: '钩子有力', 中: '钩子不错', 弱: '开头可再抓' },
      pace: { 顺: '节奏顺', 一般: '节奏还行' },
      human: { 高: '口语自然', 中: '口语还行', 低: 'AI 味偏高' },
    };
    async function evaluateChecks(scriptText) {
      if (!JCO_KERNEL) return;
      try {
        const res = await JCO_KERNEL.task({
          system: '你是短视频文案体检员，只输出一行 JSON，不要解释。',
          input: '稿件：\n' + scriptText + '\n\n请评估并严格输出 JSON：{"hook":"强或中或弱","pace":"顺或一般","human":"高或中或低"}',
        });
        if (!res || !res.ok || !res.text) return;
        let t = res.text.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
        const s = t.indexOf('{');
        const e = t.lastIndexOf('}');
        if (s >= 0 && e > s) t = t.slice(s, e + 1);
        const r = JSON.parse(t);
        const checks = document.querySelectorAll('#checks .check');
        if (checks.length >= 4) {
          checks[0].textContent = CHECK_LABELS.hook[r.hook] || '钩子有力';
          checks[1].textContent = CHECK_LABELS.pace[r.pace] || '节奏顺';
          checks[2].textContent = CHECK_LABELS.human[r.human] || '口语自然';
          checks[3].textContent = 'AI 味：' + (r.human === '低' ? '偏高' : '低');
        }
      } catch (e) {}
    }
    function setGenBusy(busy, label) {
      genBusy = busy;
      const btn = document.getElementById('regen');
      if (busy) {
        btn.dataset.old = btn.textContent;
        btn.disabled = true;
        btn.textContent = label || '正在写……';
      } else {
        btn.disabled = false;
        btn.textContent = btn.dataset.old || '重新生成一版';
      }
    }

    async function generateScript(kind) {
      if (!JCO_KERNEL || genBusy) return;
      const isXhs = kind === 'xhs';
      setGenBusy(true, isXhs ? '正在写小红书版……' : '正在写……');
      const c = controls();
      const input = [
        '主题：《' + topicText() + '》',
        '开头吸引力：' + c.hook,
        '口语程度：' + c.tone,
        isXhs ? '形态：小红书图文版（短句、段间空行、结尾引导评论）' : '形态：口播稿（短视频，直接念）',
        '请写一版。',
      ].join('\n');
      const res = await Promise.race([
        JCO_KERNEL.task({ system: writerSystemPrompt(), input: input }),
        new Promise((resolve) => setTimeout(() => resolve({ ok: false, error: '这次写太久了（超过 100 秒），再点一次试试。' }), 100000)),
      ]);
      setGenBusy(false);
      if (res && res.ok && res.text) {
        const lines = cleanLines(res.text);
        paint({ lines: lines });
        const saved = await saveScript(topicText(), lines, isXhs, 'generate');
        if (saved) showToast(isXhs ? '小红书版写好了，点着还能改。' : '新一版写好了，点着还能改。');
        jcoLogAdd('create', topicText().slice(0, 40), isXhs ? '小红书版写好了' : '口播稿写好了');
        jcoNotifyDone('稿子写好了', topicText().slice(0, 30));
        void evaluateChecks(res.text); // 体检徽章：后台真评估，不阻塞
      } else {
        showToast('没写出来：' + ((res && res.error) || '未知错误'));
      }
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    function paint(v) {
      scriptEl.innerHTML = '';
      v.lines.forEach((line) => {
        const p = document.createElement('p');
        p.textContent = line || '\u00A0';
        scriptEl.appendChild(p);
      });
    }

    document.getElementById('regen').addEventListener('click', () => {
      if (JCO_KERNEL) {
        // 「每步问我」模式：第一次点击先问一句
        let runMode = 'auto';
        try {
          const settings = (window.jco && window.jco.settings && window.jco.settings.getSync) ? window.jco.settings.getSync() : null;
          if (settings && settings.mode) runMode = settings.mode;
          else runMode = localStorage.getItem('jco-mode-v1') || 'auto';
        } catch (e) {}
        const rb = document.getElementById('regen');
        if (runMode === 'ask' && rb.dataset.confirm !== '1') {
          rb.dataset.confirm = '1';
          showToast('「每步问我」：再点一次就开始写。');
          setTimeout(() => { if (rb.dataset.confirm === '1') rb.dataset.confirm = ''; }, 4000);
          return;
        }
        rb.dataset.confirm = '';
        generateScript(xhsMode ? 'xhs' : 'normal');
        return;
      }
      if (xhsMode) { showToast('小红书版也能重新生成。原型里先切回口播稿看看。'); xhsMode = false; }
      vIndex = (vIndex + 1) % 2;
      paint(VERSIONS[vIndex]);
      showToast(vIndex === 1 ? '换了一版：开头换成"用户故事"，更抓人。' : '换回上一版：平实的讲法。');
    });

    function toXhs() {
      if (JCO_KERNEL) {
        xhsMode = !xhsMode;
        generateScript(xhsMode ? 'xhs' : 'normal');
        return;
      }
      if (xhsMode) { showToast('已经是小红书版了。'); return; }
      xhsMode = true;
      paint(VERSIONS[2]);
      paperTitle.textContent = '把一件事讲清楚三步走（小红书图文版）';
      showToast('已改成小红书版：短句、换行、结尾引导评论。');
    }

    function fixGo() {
      const v = document.getElementById('fixInp').value.trim();
      if (!v) { showToast('说一句你想怎么改，比如：开头温和点'); return; }
      document.getElementById('fixInp').value = '';
      if (JCO_KERNEL && !genBusy) { regenerateWithRequest(v); return; }
      showToast('（原型示意）正式版会按「' + v + '」改，改完标出动了哪几句，你点头才算。');
    }
    async function regenerateWithRequest(request) {
      setGenBusy(true, '正在按你说的改……');
      const current = Array.from(scriptEl.querySelectorAll('p')).map((p) => p.textContent).join('\n');
      const input = [
        '这是现在的稿子（主题：《' + topicText() + '》）：',
        '---',
        current,
        '---',
        '用户要求：' + request,
        '请按用户要求改一版，保持原来的形态和风格，直接输出改后的完整稿子。',
      ].join('\n');
      const res = await JCO_KERNEL.task({ system: writerSystemPrompt(), input: input });
      setGenBusy(false);
      if (res && res.ok && res.text) {
        const lines = cleanLines(res.text);
        paint({ lines: lines });
        const saved = await saveScript(topicText(), lines, xhsMode, 'revise');
        if (saved) showToast('改好了，你看看。不满意就再说一句。');
      } else {
        showToast('没改成：' + ((res && res.error) || '未知错误'));
      }
    }

    /* ---------- 主题由用户定：换主题 / 自己出题 ---------- */
    const TOPICS = [
      { name: '《把一件事讲清楚，其实就 3 步》', src: '这条主题来自「选题」· 挑一个直接开写' },
      { name: '《32 岁宝妈 6 个月拿下大专文凭，她只做了 3 件事》', src: '这条主题来自「选题」· 挑一个直接开写' },
    ];
    let topicIndex = 0;

    function changeTopic() {
      if (JCO_KERNEL) {
        showToast('去「选题」挑一个，带回来直接开写。');
        location.href = 'J.Co工作台-选题.html';
        return;
      }
      topicIndex = (topicIndex + 1) % TOPICS.length;
      document.getElementById('topicName').textContent = TOPICS[topicIndex].name;
      document.getElementById('topicSrc').innerHTML = TOPICS[topicIndex].src;
      paperTitle.textContent = TOPICS[topicIndex].name.replace(/[《》]/g, '');
      showToast('换成你在「选题」里选的另一条。不满意就再换，或者干脆自己出题。');
    }

    function openOwn() {
      document.getElementById('ownOverlay').classList.add('show');
      setTimeout(() => document.getElementById('ownInp').focus(), 60);
    }
    function closeOwn() { document.getElementById('ownOverlay').classList.remove('show'); }
    function ownGo() {
      const v = document.getElementById('ownInp').value.trim();
      if (!v) { showToast('写一句你想拍什么，AI 就按这个写。'); return; }
      document.getElementById('ownInp').value = '';
      closeOwn();
      currentScript = null;
      document.getElementById('topicName').textContent = '《' + v + '》';
      document.getElementById('topicSrc').innerHTML = '这条主题是<b>你自己出的</b>（想怎么写，你说了算）';
      paperTitle.textContent = v;
      if (JCO_KERNEL) { generateScript('normal'); return; }
      showToast('按你出的题开始写。稿子马上来，写得不顺心直接说。');
    }

    document.querySelectorAll('.seg').forEach((seg) => {
      seg.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        seg.querySelectorAll('button').forEach((b) => b.classList.remove('on'));
        btn.classList.add('on');
        showToast('记下了。按「' + btn.dataset.v + '」重写会更贴合。');
      });
    });

    /* ---------- M8 收尾：接住「选题」带过来的主题；稿子真持久化；没有就空态 ---------- */
    function saveScript(topic, lines, xhs, source) {
      var payload = {
        id: currentScript && currentScript.id ? currentScript.id : '',
        topic: topic,
        lines: lines,
        xhs: !!xhs,
        source: source || 'manual',
        createdAt: currentScript && currentScript.createdAt ? currentScript.createdAt : Date.now(),
      };
      if (window.jco && window.jco.scripts && window.jco.scripts.save) {
        return window.jco.scripts.save(payload).then(function (res) {
          if (res && res.ok && res.data && res.data.current) {
            currentScript = res.data.current;
            return true;
          }
          showToast('稿子没存上：' + ((res && res.error) || '未知错误'));
          return false;
        }, function () {
          showToast('稿子没存上，再试一次。');
          return false;
        });
      }
      // 浏览器直开的降级路径；桌面应用不走这里。
      try { localStorage.setItem('jco-script-v1', JSON.stringify({ topic: topic, lines: lines, xhs: !!xhs, t: Date.now() })); } catch (e) {}
      return Promise.resolve(true);
    }
    function restoreScript() {
      try { return JSON.parse(localStorage.getItem('jco-script-v1') || 'null'); } catch (e) { return null; }
    }
    function currentLinesFromEditor() {
      return Array.from(scriptEl.querySelectorAll('p')).map(function (p) {
        return p.textContent === '\u00A0' ? '' : p.textContent;
      });
    }
    async function persistEditedScript() {
      if (!scriptReady || scriptEl.querySelector('.empty-script')) return true;
      var lines = currentLinesFromEditor();
      if (!lines.join('').trim()) return true;
      return await saveScript(topicText(), lines, xhsMode, 'manual');
    }
    scriptEl.addEventListener('input', function () {
      clearTimeout(editSaveTimer);
      editSaveTimer = setTimeout(function () { void persistEditedScript(); }, 700);
    });
    function setTopic(topic, srcHtml) {
      if (currentScript && currentScript.topic !== topic) currentScript = null;
      document.getElementById('topicName').textContent = '《' + topic + '》';
      document.getElementById('topicSrc').innerHTML = srcHtml;
      paperTitle.textContent = topic;
    }
    function emptyScript() {
      scriptEl.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'empty-script';
      p.textContent = '还没有稿子。选好主题后，点下面「重新生成一版」，我就开写。';
      scriptEl.appendChild(p);
    }
    function applyScriptRecord(record, srcText) {
      if (!record) return false;
      if (bootPickedTopic && record.topic !== bootPickedTopic) {
        currentScript = null;
        return false;
      }
      currentScript = record;
      xhsMode = !!record.xhs;
      setTopic(record.topic || '上次的稿子', srcText);
      paint({ lines: record.lines });
      return true;
    }
    function legacyIsNewer(legacy, current) {
      if (!legacy || !Array.isArray(legacy.lines) || legacy.lines.length === 0) return false;
      var legacyTime = Number(legacy.t) || 0;
      var storeTime = Number(current.updatedAt || current.createdAt) || 0;
      return legacyTime > storeTime;
    }
    async function hydrateScriptStore() {
      if (!window.jco || !window.jco.scripts || !window.jco.scripts.get) {
        scriptReady = true;
        return;
      }
      try {
        var res = await window.jco.scripts.get();
        if (!res || !res.ok) return;
        var data = res.data || {};
        var current = data.current;
        var legacy = restoreScript();
        if (current && Array.isArray(current.lines) && current.lines.length) {
          if (legacyIsNewer(legacy, current)) {
            var saved = await window.jco.scripts.save({
              topic: legacy.topic || current.topic || '上次的稿子',
              lines: legacy.lines,
              xhs: !!legacy.xhs,
              source: 'migrate',
            });
            if (saved && saved.ok && saved.data && saved.data.current) {
              applyScriptRecord(saved.data.current, '旧版本刚写的稿子（已迁入）');
            }
            return;
          }
          applyScriptRecord(current, '上次写的稿子（点着还能改）');
          return;
        }
        if (legacy && Array.isArray(legacy.lines) && legacy.lines.length) {
          var migrated = await window.jco.scripts.migrate(legacy);
          if (migrated && migrated.ok && migrated.data && migrated.data.current) {
            applyScriptRecord(migrated.data.current, '上次写的稿子（点着还能改）');
          }
        }
      } catch (e) {} finally {
        scriptReady = true;
      }
    }
    let bootPickedTopic = null;
    (function boot() {
      if (!JCO_KERNEL) { paint(VERSIONS[0]); scriptReady = true; return; } // 浏览器直开：保留演示预览
      let picked = null;
      try { picked = sessionStorage.getItem('jco-pick-topic'); if (picked) sessionStorage.removeItem('jco-pick-topic'); } catch (e) {}
      bootPickedTopic = picked;
      const last = restoreScript();
      if (picked) {
        setTopic(picked, '主题来自「选题」· 点【重新生成一版】我就开写');
        if (last && last.lines && last.topic === picked) { xhsMode = !!last.xhs; paint({ lines: last.lines }); }
        else { emptyScript(); showToast('主题带过来了，点【重新生成一版】我就开写。'); }
        return;
      }
      if (last && last.lines && last.lines.length) {
        xhsMode = !!last.xhs;
        setTopic(last.topic || '上次的稿子', '上次写的稿子（点着还能改）');
        paint({ lines: last.lines });
        return;
      }
      document.getElementById('topicName').textContent = '（还没选主题）';
      document.getElementById('topicSrc').innerHTML = '先去「<b>选题</b>」挑一个，或点「自己出题」说一句';
      paperTitle.textContent = '还没有主题';
      emptyScript();
    })();
    void hydrateScriptStore();
    void hydrateBrandProfile();
    document.querySelectorAll('.anim').forEach((el, i) => {
      setTimeout(() => el.classList.add('in'), 60 + i * 90);
    });
  </script>
  <script>
    /* ---------- 侧栏导航（原型可点通） ---------- */
    (function () {
      var here = decodeURIComponent(location.pathname.split('/').pop());
      var PAGES = {
        '总管': 'J.Co总管.html',
        '选题': 'J.Co工作台-选题.html',
        '素材': 'J.Co工作台-素材.html',
        '文案': 'J.Co工作台-创作.html',
        '创作': 'J.Co工作台-做视频.html',
        '后期': 'J.Co工作台-后期.html',
        '发布': 'J.Co工作台-发布.html',
        '运营': 'J.Co工作台-运营.html',
        '管家团队': 'J.Co管家团队.html',
        '账号中心': 'J.Co账号中心.html',
        '设置': 'J.Co设置.html',
        '自动任务': 'J.Co自动任务.html',
        '技能库': 'J.Co技能库.html'
      };
      document.querySelectorAll('.nav-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var label = btn.textContent.trim();
          var target = PAGES[label];
          if (target) {
            if (target !== here) location.href = target;
            return;
          }
          showToast('「' + label + '」还没开工，已经记进下一步清单（先把现有的七个环节用顺）。');
        });
      });
      var bell = document.querySelector('.side-foot .icon-btn');
      if (bell) bell.addEventListener('click', function (e) {
        e.stopPropagation();
        jcoToggleNotif(bell);
      });
      /* ---------- 右下角·总管助手 ---------- */
      (function () {
        var btn = document.getElementById('copilotBtn');
        var panel = document.getElementById('copilot');
        var fold = document.getElementById('cpFold');
        var body = document.getElementById('cpBody');
        var inp = document.getElementById('cpInp');
        var sendBtn = document.getElementById('cpSend');
        if (!btn || !panel) return;
        btn.addEventListener('click', function () { panel.hidden = !panel.hidden; });
        if (fold) fold.addEventListener('click', function () { panel.hidden = true; });
        var FIXED = {
          '这条视频数据怎么样？': '《把一件事讲清楚，其实就 3 步》实时数据：播放 <b>5.2 万</b>（还在涨）、点赞 3,180、评论 57、带来咨询 6 条。比你的平均表现高 <b>8 倍</b>。',
          '今天还剩什么事？': '还有 3 件在你手上：2 条视频等你过目、8 条评论等你放行、19:30 的发布等你确认。都排好了，你点头就行。',
          '评论有什么动静？': '新评论 6 条：2 条问价格（我拟好引导话术了），3 条夸的，1 条问「初中能不能报」。建议你亲自回，这种最容易成。'
        };
        function appendMe(t) {
          var el = document.createElement('div');
          el.className = 'cp-msg me';
          el.textContent = t;
          body.appendChild(el);
          body.scrollTop = body.scrollHeight;
        }
        function appendAI(html) {
          var el = document.createElement('div');
          el.className = 'cp-msg ai';
          el.innerHTML = html;
          body.appendChild(el);
          body.scrollTop = body.scrollHeight;
        }
        function ask(q) {
          if (!q) return;
          appendMe(q);
          var cpKernel = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel);
          if (cpKernel) {
            appendAI('…');
            var cpMsgs = body.querySelectorAll('.cp-msg.ai');
            var cpEl = cpMsgs[cpMsgs.length - 1];
            window.jco.kernel.ask(q).then(function (res) {
              var cpText = (res && res.ok && res.text) ? res.text : ('没答上来：' + ((res && res.error) || '未知错误'));
              cpEl.textContent = cpText;
              cpEl.style.whiteSpace = 'pre-wrap';
              body.scrollTop = body.scrollHeight;
            });
            return;
          }
          setTimeout(function () {
            appendAI(FIXED[q] || ('收到「' + q + '」。正式版里我马上去查，查完把明细端给你。'));
          }, 420);
        }
        document.querySelectorAll('.cp-act').forEach(function (b) {
          b.addEventListener('click', function () { ask(b.getAttribute('data-q')); });
        });
        function fire() {
          var v = inp.value.trim();
          if (!v) return;
          inp.value = '';
          inp.style.height = 'auto';
          ask(v);
        }
        sendBtn.addEventListener('click', fire);
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fire(); }
        });
        inp.addEventListener('input', function () {
          inp.style.height = 'auto';
          inp.style.height = Math.min(inp.scrollHeight, 90) + 'px';
        });
      })();
      /* ---------- 侧栏（图标栏 + 悬停展开 + 固定展开） ---------- */
      (function () {
        var sidebar = document.querySelector('.sidebar');
        var pinBtn = document.querySelector('.side-toggle');
        if (!sidebar) return;
        function setPinned(v) {
          document.documentElement.classList.toggle('side-pinned', v);
          if (pinBtn) pinBtn.querySelector('.ti').className = 'ti ' + (v ? 'ti-layout-sidebar-left-collapse' : 'ti-layout-sidebar-left-expand');
          try { localStorage.setItem('jco-side-pinned', v ? '1' : '0'); } catch (err) {}
        }
        if (pinBtn) pinBtn.addEventListener('click', function () {
          setPinned(!document.documentElement.classList.contains('side-pinned'));
        });
        try {
          if (localStorage.getItem('jco-side-pinned') === '1') setPinned(true);
        } catch (err) {}
      })();
      /* ---------- 侧栏分组折叠 ---------- */
      (function () {
        var KEY = 'jco-sidebar-folded-groups';
        function loadFolded() {
          try { return (localStorage.getItem(KEY) || '').split(',').filter(Boolean); } catch (e) { return []; }
        }
        function saveFolded(list) {
          try { localStorage.setItem(KEY, list.join(',')); } catch (e) {}
        }
        function applyFold(label, hide) {
          label.classList.toggle('folded', hide);
          var el = label.nextElementSibling;
          while (el && !el.classList.contains('group-label')) {
            if (el.classList.contains('nav-item') || el.classList.contains('convos')) {
              el.style.display = hide ? 'none' : '';
            }
            el = el.nextElementSibling;
          }
        }
        var folded = loadFolded();
        document.querySelectorAll('.group-label').forEach(function (label) {
          var name = label.textContent.trim();
          if (folded.indexOf(name) !== -1) applyFold(label, true);
          label.addEventListener('click', function () {
            var hide = !label.classList.contains('folded');
            applyFold(label, hide);
            var list = loadFolded();
            if (hide) { if (list.indexOf(name) === -1) list.push(name); }
            else { list = list.filter(function (x) { return x !== name; }); }
            saveFolded(list);
          });
        });
      })();
      var wm = document.querySelector('.wordmark');
      if (wm) wm.addEventListener('click', function () {
        if ('J.Co主界面-首页.html' !== here) location.href = 'J.Co主界面-首页.html';
      });
      document.querySelectorAll('.convo').forEach(function (btn) {
        btn.addEventListener('click', function () {
          location.href = 'J.Co总管.html';
        });
      });
    })();
  
    /* ---------- 账号菜单（点头像弹出：设置 / 退出登录） ---------- */
    (function () {
      var meBtn = document.getElementById('meBtn');
      var menu = document.getElementById('meMenu');
      if (!meBtn || !menu) return;
      function setOpen(open) {
        menu.hidden = !open;
        meBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      meBtn.addEventListener('click', function () { setOpen(menu.hidden); });
      meBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(menu.hidden); }
        if (e.key === 'Escape') setOpen(false);
      });
      document.addEventListener('click', function (e) {
        if (!menu.hidden && !menu.contains(e.target) && !meBtn.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !menu.hidden) setOpen(false);
      });
      document.getElementById('mmSettings').addEventListener('click', function () {
        setOpen(false);
        var here = decodeURIComponent(location.pathname.split('/').pop());
        if (here !== 'J.Co设置.html') location.href = 'J.Co设置.html';
      });
      document.getElementById('mmLogout').addEventListener('click', function () {
        setOpen(false);
        showToast('这台电脑上不用单独登录：关掉窗口就是退出，素材和草稿都留着。');
      });
    })();
  
    /* ---------- 通知面板：最近的活动记录（真数据） ---------- */
    function jcoToggleNotif(anchor) {
      var old = document.querySelector('.notif-pop');
      if (old) { old.remove(); return; }
      var items = [];
      try { items = (JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}').items) || []; } catch (e) {}
      var pop = document.createElement('div');
      pop.className = 'notif-pop';
      var r = anchor.getBoundingClientRect();
      pop.style.position = 'fixed';
      pop.style.left = Math.min(r.right + 10, window.innerWidth - 296) + 'px';
      pop.style.bottom = Math.max(12, window.innerHeight - r.bottom) + 'px';
      var head = document.createElement('div');
      head.className = 'np-head';
      head.textContent = '最近动态';
      pop.appendChild(head);
      if (items.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'np-empty';
        empty.textContent = '还没有记录。干一句活，这里就开始记。';
        pop.appendChild(empty);
      } else {
        items.slice(0, 8).forEach(function (x) {
          var row = document.createElement('div');
          row.className = 'np-row';
          var d = new Date(x.t);
          var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
          var time = document.createElement('span');
          time.className = 'np-time';
          time.textContent = hh;
          var txt = document.createElement('span');
          txt.className = 'np-txt';
          txt.textContent = x.title + (x.detail ? '（' + x.detail + '）' : '');
          row.appendChild(time);
          row.appendChild(txt);
          pop.appendChild(row);
        });
      }
      var foot = document.createElement('a');
      foot.className = 'np-foot';
      foot.href = 'J.Co总管.html';
      foot.textContent = '去总管看全部 →';
      pop.appendChild(foot);
      document.body.appendChild(pop);
      var closer = function (ev) {
        if (!pop.contains(ev.target)) {
          pop.remove();
          document.removeEventListener('click', closer, true);
        }
      };
      setTimeout(function () { document.addEventListener('click', closer, true); }, 0);
    }
  
  
    /* ---------- 对话列表（真会话）：点击续聊；每项可分享 / 重命名 / 删除；＋ 新会话 ---------- */
    (function jcoConvos() {
      var hasKernel = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel);
      if (!hasKernel) return; // 浏览器直开：保留演示列表
      var data = null;
      try { data = JSON.parse(localStorage.getItem('jco-chats-v1') || 'null'); } catch (e) {}
      var box = document.querySelector('.convos');
      if (!box) return
      // M7：数据缺失也渲染：「新会话」按钮常驻，不依赖"总管页先初始化"
      if (!data || !Array.isArray(data.chats)) { data = { activeId: null, chats: [] } };
      var here = decodeURIComponent(location.pathname.split('/').pop());
      function go(req) {
        try { sessionStorage.setItem('jco-open-chat', req); } catch (e) {}
        if (here !== 'J.Co总管.html') location.href = 'J.Co总管.html';
      }
      function saveChats() { try { localStorage.setItem('jco-chats-v1', JSON.stringify(data)); } catch (e) {} }

      /* 会话操作：分享 / 重命名 / 删除（含两步防误删） */
      var openMenu = null;
      function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
      document.addEventListener('click', closeMenu);
      function toastIt(msg) {
        var t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg; t.classList.add('show');
        clearTimeout(toastIt._t); toastIt._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
      }
      function shareChat(chat) {
        var lines = ['【和 J.Co 的对话 · ' + (chat.title || '新会话') + '】'];
        (chat.messages || []).forEach(function (m) {
          lines.push((m.role === 'user' ? '我：' : 'J.Co：') + String(m.text || ''));
        });
        var text = lines.join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { toastIt('对话已复制，去粘贴分享吧'); },
            function () { toastIt('没复制成，手动选中复制一下'); }
          );
        } else { toastIt('这台环境不支持直接复制'); }
      }
      function showMenu(anchor, chat) {
        closeMenu();
        var menu = document.createElement('div');
        menu.className = 'convo-menu';
        menu.addEventListener('click', function (e) { e.stopPropagation(); });
        function item(icon, label, cls, fn) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = cls || '';
          b.innerHTML = '<span class="ti ' + icon + '"></span>' + label;
          b.addEventListener('click', fn);
          menu.appendChild(b);
          return b;
        }
        item('ti-share-3', '分享对话', '', function () { closeMenu(); shareChat(chat); });
        item('ti-file-text', '重命名', '', function () {
          closeMenu();
          var row = anchor.closest('.convo');
          var nameEl = row ? row.querySelector('.name') : null;
          if (!nameEl) return;
          var input = document.createElement('input');
          input.className = 'convo-rename';
          input.value = chat.title || '新会话';
          nameEl.replaceWith(input);
          input.focus(); input.select();
          var done = false;
          function commit(saveIt) {
            if (done) return; done = true;
            var v = input.value.trim().slice(0, 20);
            if (saveIt && v) chat.title = v;
            nameEl.textContent = chat.title || '新会话';
            input.replaceWith(nameEl);
            if (saveIt && v) { saveChats(); toastIt('改好名字了'); }
          }
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            if (e.key === 'Escape') { commit(false); }
          });
          input.addEventListener('blur', function () { commit(true); });
          input.addEventListener('click', function (e) { e.stopPropagation(); });
        });
        var del = item('ti-trash', '删除对话', 'danger', function () {
          if (del.getAttribute('data-armed') !== '1') {
            del.setAttribute('data-armed', '1');
            del.innerHTML = '<span class="ti ti-trash"></span>再点一次，真删除';
            return;
          }
          closeMenu();
          var wasActive = data.activeId === chat.id;
          data.chats = data.chats.filter(function (x) { return x.id !== chat.id; });
          if (data.chats.length === 0) {
            data.chats.push({ id: 'c' + Date.now().toString(36), title: '新会话', updatedAt: Date.now(), messages: [] });
          }
          if (wasActive) data.activeId = data.chats[0].id;
          saveChats();
          toastIt('已删除「' + (chat.title || '新会话') + '」');
          render();
        });
        document.body.appendChild(menu);
        var r = anchor.getBoundingClientRect();
        var mw = menu.offsetWidth || 160, mh = menu.offsetHeight || 130;
        var left = Math.min(r.right + 8, window.innerWidth - mw - 10);
        var top = Math.min(r.bottom + 4, window.innerHeight - mh - 10);
        if (top < 8) top = 8;
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        openMenu = menu;
      }
      function render() {
        box.innerHTML = '';
        var add = document.createElement('button');
        add.className = 'convo new-btn';
        add.innerHTML = '<span class="ti ti-plus"></span>新会话';
        add.addEventListener('click', function (e) { e.stopPropagation(); go('new'); });
        // 「新会话」按钮位：顶部搜索框下方（M7 全站统一；找不到容器时回退列表内）
        var slot = document.getElementById('newChatSlot');
        if (slot) {
          slot.innerHTML = '';
          slot.appendChild(add);
        } else {
          box.appendChild(add);
        }
        data.chats.slice(0, 8).forEach(function (c) {
          var b = document.createElement('button');
          b.className = 'convo' + (c.id === data.activeId ? ' active' : '');
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = c.title || '新会话';
          b.appendChild(nm);
          var more = document.createElement('span');
          more.className = 'convo-more';
          more.setAttribute('role', 'button');
          more.setAttribute('tabindex', '0');
          more.setAttribute('aria-label', '更多操作');
          more.textContent = '⋯';
          more.addEventListener('click', function (e) { e.stopPropagation(); showMenu(more, c); });
          more.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); showMenu(more, c); } });
          b.appendChild(more);
          b.addEventListener('click', function (e) { e.stopPropagation(); go(c.id); });
          box.appendChild(b);
        });
      }
      render();
    })();
  
  </script>
  
</body>
</html>
