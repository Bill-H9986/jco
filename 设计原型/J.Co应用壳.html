<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.Co</title>
  <link rel="stylesheet" href="./assets/jco-ui.css">
  <script src="./assets/jco-shell.js"></script>
  <style>
    /* 应用壳（2026-10-17 · M10 前端一壳化）：侧栏常驻，内容区只换视图：切页不重绘外壳 */
    html, body { height: 100%; overflow: hidden; }
    .app { height: 100dvh; display: flex; }
    .frame-wrap { flex: 1; min-width: 0; position: relative; }
    #jcoFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    .frame-fade { position: absolute; inset: 0; background: var(--bg); pointer-events: none; opacity: 0; transition: opacity 0.16s ease; }
    .frame-fade.on { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="side-top">
          <div class="wordmark">J.Co</div>
          <button class="side-toggle" aria-label="固定展开侧栏" title="点一下固定展开，再点收起"><span class="ti ti-layout-sidebar-left-expand"></span></button>
        </div>
        <div class="search"><span class="ti ti-search"></span><input placeholder="搜索"></div>
        <div class="newchat" id="newChatSlot">
          <button class="convo new-btn" title="新会话"><span class="ti ti-plus"></span>新会话</button>
        </div>
        <nav class="nav">
          <button class="nav-item" data-page="J.Co主界面-首页.html"><span class="ti ti-layout-grid"></span>首页</button>
          <button class="nav-item" data-page="J.Co总管.html"><span class="ti ti-message-plus"></span>总管</button>
          <button class="group-label" type="button"><span class="ti ti-layout-grid"></span>工作台<span class="ti ti-chevron-down"></span></button>
          <button class="nav-item" data-page="J.Co工作台-选题.html"><span class="ti ti-bulb"></span>选题</button>
          <button class="nav-item" data-page="J.Co工作台-素材.html"><span class="ti ti-photo"></span>素材</button>
          <button class="nav-item" data-page="J.Co工作台-创作.html"><span class="ti ti-file-text"></span>文案</button>
          <button class="nav-item" data-page="J.Co工作台-做视频.html"><span class="ti ti-video"></span>创作</button>
          <button class="nav-item" data-page="J.Co工作台-后期.html"><span class="ti ti-wand"></span>后期</button>
          <button class="nav-item" data-page="J.Co工作台-发布.html"><span class="ti ti-upload"></span>发布</button>
          <button class="nav-item" data-page="J.Co工作台-运营.html"><span class="ti ti-chart-bar"></span>运营</button>
          <button class="group-label" type="button"><span class="ti ti-tool"></span>工具<span class="ti ti-chevron-down"></span></button>
          <button class="nav-item" data-page="J.Co自动任务.html"><span class="ti ti-clock-play"></span>自动任务</button>
          <button class="nav-item" data-page="J.Co技能库.html"><span class="ti ti-sparkles"></span>技能库</button>
          <button class="nav-item" data-page="J.Co管家团队.html"><span class="ti ti-users-group"></span>管家团队</button>
          <button class="nav-item" data-page="J.Co账号中心.html"><span class="ti ti-key"></span>账号中心</button>
        </nav>
        <div class="side-foot">
          <div class="me" id="meBtn" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false"><div class="ava">J</div><span>Jay</span></div>
          <button class="icon-btn" aria-label="通知" id="bellBtn"><span class="ti ti-bell"></span></button>
        </div>
      </div>
    </aside>
    <div class="frame-wrap">
      <iframe id="jcoFrame" src="J.Co主界面-首页.html" title="J.Co 内容区"></iframe>
      <div class="frame-fade" id="frameFade"></div>
    </div>
  </div>

  <script>
    /* 壳：切页只换内容视图；侧栏常驻（jco-shell.js 负责导航接管/任务/对话/折叠/通知） */
    (function shellHost() {
      var frame = document.getElementById('jcoFrame');
      var fade = document.getElementById('frameFade');

      function routeOfHash() {
        var raw = String(location.hash || '').replace(/^#\/?/, '');
        if (!raw || raw === 'home') return { kind: 'home' };
        if (raw.indexOf('chat/') === 0) return { kind: 'chat', id: decodeURIComponent(raw.slice(5)) };
        if (raw.indexOf('task/') === 0) return { kind: 'task', id: decodeURIComponent(raw.slice(5)) };
        if (raw.indexOf('page/') === 0) return { kind: 'page', file: decodeURIComponent(raw.slice(5)) };
        return { kind: 'home' };
      }
      function hashOfRoute(route) {
        if (route.kind === 'chat') return '#/chat/' + encodeURIComponent(route.id || 'last');
        if (route.kind === 'task') return '#/task/' + encodeURIComponent(route.id || '');
        if (route.kind === 'page') return '#/page/' + encodeURIComponent(route.file || '');
        return '#/home';
      }
      function targetOfRoute(route) {
        if (route.kind === 'home') return 'J.Co主界面-首页.html';
        if (route.kind === 'task') return 'J.Co总管.html?task=' + encodeURIComponent(route.id || '');
        if (route.kind === 'chat') {
          if (route.id === 'new') return 'J.Co总管.html?new=1';
          if (!route.id || route.id === 'last') return 'J.Co总管.html';
          return 'J.Co总管.html?chat=' + encodeURIComponent(route.id);
        }
        if (route.kind === 'page') return String(route.file || 'J.Co主界面-首页.html');
        return 'J.Co主界面-首页.html';
      }
      function navPageOfRoute(route) {
        if (route.kind === 'home') return 'J.Co主界面-首页.html';
        if (route.kind === 'chat' || route.kind === 'task') return 'J.Co总管.html';
        if (route.kind === 'page') return route.file;
        return 'J.Co主界面-首页.html';
      }
      function rememberHash(route) {
        try {
          history.replaceState(null, '', hashOfRoute(route));
        } catch (err) {}
      }
      function loadFrame(target) {
        if (!target || frame.getAttribute('src') === target) return;
        if (fade) { fade.classList.add('on'); }
        setTimeout(function () {
          frame.src = target;
        }, 90);
      }
      function applyRoute(route, remember) {
        if (!route) return;
        loadFrame(targetOfRoute(route));
        if (remember) rememberHash(route);
        if (typeof window.__jcoHighlightPage === 'function') {
          window.__jcoHighlightPage(navPageOfRoute(route));
        }
      }
      window.__jcoGo = function (target) {
        if (!target) return;
        var text = decodeURIComponent(String(target));
        if (text === 'J.Co主界面-首页.html') {
          applyRoute({ kind: 'home' }, true);
          return;
        }
        if (text.indexOf('J.Co总管.html') !== -1) {
          var query = text.split('?')[1] || '';
          var params = new URLSearchParams(query);
          if (params.get('task')) {
            applyRoute({ kind: 'task', id: params.get('task') }, true);
          } else if (params.get('chat')) {
            applyRoute({ kind: 'chat', id: params.get('chat') }, true);
          } else if (params.get('new') === '1') {
            applyRoute({ kind: 'chat', id: 'new' }, true);
          } else {
            applyRoute({ kind: 'chat', id: 'last' }, true);
          }
          return;
        }
        applyRoute({ kind: 'page', file: text.split('?')[0] }, true);
      };
      // 首页发送：进入 chat/new，seed 由总管页消费；不创建任务、不启动浏览器。
      window.__jcoStartChat = function (text) {
        var seed = String(text || '').trim();
        if (!seed) return;
        rememberHash({ kind: 'chat', id: 'new' });
        loadFrame('J.Co总管.html?new=1&seed=' + encodeURIComponent(seed));
        if (typeof window.__jcoHighlightPage === 'function') {
          window.__jcoHighlightPage('J.Co总管.html');
        }
      };
      // 系统通知点击 → 壳内切到对应任务视图，而不是把整个壳导航走
      window.__jcoOpenTaskById = function (id) {
        if (id) applyRoute({ kind: 'task', id: String(id) }, true);
      };
      var wordmark = document.querySelector('.wordmark');
      if (wordmark) wordmark.addEventListener('click', function () {
        applyRoute({ kind: 'home' }, true);
      });
      frame.addEventListener('load', function () {
        setTimeout(function () { if (fade) fade.classList.remove('on'); }, 60);
      });
      // 新会话：去总管页并触发新会话
      var newBtn = document.querySelector('#newChatSlot .new-btn');
      if (newBtn) newBtn.addEventListener('click', function () {
        applyRoute({ kind: 'chat', id: 'new' }, true);
      });
      // 头像 → 设置；铃铛 → 通知面板（jco-shell 提供 jcoToggleNotif）
      var me = document.getElementById('meBtn');
      if (me) me.addEventListener('click', function () { window.__jcoGo('J.Co设置.html'); });
      var bell = document.getElementById('bellBtn');
      if (bell) bell.addEventListener('click', function () {
        if (typeof window.jcoToggleNotif === 'function') window.jcoToggleNotif(bell);
      });
      // 总管页创建/切换会话后回传 id，地址栏稳定在 #/chat/:id
      window.addEventListener('message', function (event) {
        if (event.source !== frame.contentWindow) return;
        var id = event.data && event.data.__jcoConversation;
        if (id) rememberHash({ kind: 'chat', id: String(id) });
      });
      window.addEventListener('hashchange', function () {
        applyRoute(routeOfHash(), false);
      });
      var initial = location.hash ? routeOfHash() : { kind: 'home' };
      if (!location.hash) rememberHash(initial);
      applyRoute(initial, false);
    })();
  </script>
</body>
</html>
