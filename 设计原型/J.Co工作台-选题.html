<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.Co · 选题</title>
  <link rel="stylesheet" href="./assets/jco-ui.css">
  <script src="./assets/jco-shell.js"></script>
  <style>
/* ============ 主区 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.scroll { flex: 1; overflow-y: auto; }

.wrap { max-width: none; margin: 0 auto; padding: var(--jco-page-top) var(--jco-page-x) 70px; }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

.head h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }

.head .sub { margin-top: 7px; font-size: 14px; color: var(--text-2); }

.brief {
    margin-top: 20px; display: flex; align-items: center; gap: 12px;
    background: var(--tint); border-radius: 20px; padding: 14px 18px;
    font-size: 14px; color: var(--text-2);
  }

.brief .ti-flame { font-size: 16px; color: var(--red); flex: none; }

.brief b { color: var(--text-1); font-weight: 600; }

.brief .spacer { flex: 1; }

.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 32px 0 14px; }

.sec-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }

.sec-head .hint { font-size: 13px; color: var(--text-3); }

/* 爆款卡 */
  .hits { display: flex; flex-direction: column; gap: 12px; }

.hit {
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow-card);
    padding: 16px 18px;
    transition: box-shadow 0.18s ease;
  }

.hit:hover { box-shadow: var(--shadow); }

.hit .row1 { display: flex; align-items: center; gap: 14px; }

.thumb {
    flex: none; width: 96px; height: 56px; border-radius: 12px;
    background: var(--tint); color: var(--text-3);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    position: relative;
  }

.thumb .dur {
    position: absolute; right: 5px; bottom: 5px;
    font-size: 12px; color: #ffffff; background: rgba(30, 30, 34, 0.6);
    border-radius: 4px; padding: 1px 5px; font-family: inherit;
  }

.hit .meta { flex: 1; min-width: 0; }

.hit .src { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); margin-bottom: 5px; }

.hit .src .fire { color: var(--red); font-size: 14px; }

.hit .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }

.hit .stat { margin-top: 5px; font-size: 13px; color: var(--text-2); }

.hit .stat b { color: var(--text-1); font-weight: 600; }

.hit .ops { flex: none; }

.detail { display: none; margin-top: 14px; border-top: 0.5px solid var(--line); padding-top: 14px; }

.hit.open .detail { display: block; }

.why-fire {
    display: flex; gap: 9px; align-items: flex-start;
    background: rgba(255, 140, 40, 0.09); border-radius: 12px; padding: 11px 13px;
    font-size: 13px; line-height: 1.6; color: var(--text-2);
  }

.why-fire .ti { font-size: 14px; color: #b25000; margin-top: 2px; flex: none; }

.why-fire b { color: var(--text-1); font-weight: 600; }

.learn { margin-top: 13px; display: grid; grid-template-columns: 84px 1fr; row-gap: 8px; column-gap: 14px; font-size: 14px; line-height: 1.6; }

.learn .k { color: var(--text-3); }

.learn .v { color: var(--text-1); }

.learn .v.q { color: var(--text-2); }

.learn .head-cell { grid-column: 1 / -1; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: 0.02em; margin-top: 4px; }

.detail .go-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

/* 其他灵感（次要） */
  .minor .sec-head { margin-top: 40px; }

.tabs { display: flex; gap: 22px; margin: 8px 0 14px; }

.radar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

.r-card {
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card);
    padding: 14px 15px 11px; display: flex; flex-direction: column; gap: 9px;
    transition: transform 0.16s var(--ease), box-shadow 0.16s var(--ease);
  }

.r-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.r-card .t { font-size: 14px; font-weight: 600; line-height: 1.5; }

.r-card .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }

.tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--text-2); }

.tag.hot { color: #b25000; background: rgba(255, 140, 40, 0.14); }

.tag.ai { color: var(--green); background: rgba(36, 138, 61, 0.12); }

.r-card .heat { flex: 1; font-size: 12px; color: var(--text-3); }

.star {
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: transparent; color: var(--text-3); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }

.star:hover { background: var(--hover); color: var(--text-1); }

.star.on { color: var(--accent); }

.star:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.empty { grid-column: 1 / -1; text-align: center; color: var(--text-3); font-size: 14px; padding: 32px 0; }

.self {
    display: flex; gap: 10px; align-items: center;
    max-width: none; margin: 0 74px 0 0;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    padding: 12px 14px 12px 20px;
  }

.self .ti { font-size: 18px; color: var(--text-3); flex: none; }

.self input {
    flex: 1; border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 14px; color: var(--text-1);
  }

.self input:focus-visible { outline: none; }

.self input::placeholder { color: var(--text-3); }

.self .ghost { flex: none; }

.anim { opacity: 0; transform: translateY(10px); }

.anim.in { opacity: 1; transform: none; transition: opacity 0.42s var(--ease), transform 0.42s var(--ease); }

/* 弹层（贴一条爆款） */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20, 20, 24, 0.32);
    display: none; align-items: center; justify-content: center; padding: 30px;
  }

.overlay.show { display: flex; }

.sheet {
    width: 100%; max-width: 540px; max-height: 86vh; overflow-y: auto;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow-modal);
    padding: 26px 28px 22px;
  }

.sheet h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }

.sheet .sub { margin-top: 6px; font-size: 13px; color: var(--text-2); line-height: 1.6; }

.sheet .divider { height: 1px; background: var(--line); margin: 20px 0; }

.field { margin-top: 14px; }

.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 7px; }

.field input, .field textarea {
    width: 100%; border: 0.5px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text-1);
    font-family: inherit; font-size: 14px; padding: 10px 13px; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

.field textarea { min-height: 62px; resize: vertical; line-height: 1.6; }

.field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 128, 255, 0.12); }

.field input:focus-visible, .field textarea:focus-visible { outline: none; }

.sheet .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

/* 底部常驻操作条 */
  .pinbar {
    flex: none; padding: 8px 32px 14px;
    background: transparent; border-top: none;
  }

.pinbar > * { margin-top: 0 !important; max-width: none; margin-left: 0; margin-right: 74px; }

/* DSH 规范：正圆与胶囊保持圆弧（其余圆角走超椭圆） */
  .me .ava, .mm-head .ava, .msg.ai .ava, .card .go, .send, .ghost, .ghost-btn, .btn-sm, .act,
  .cp-act, .cp-send, .agent-chip, .badge, .b-role, .s-badge, .stage, .r-dot,
  .dot, .prog .track, .prog .fill, .prow .pbar, .prow .pf2, .toast,
  .pf .pfck, .seg button, .go-btn, .copilot-btn, .use-btn,
  .tag, .star, .check, .ai-state .dot, .regen, .agent-tabs, .agent-tabs button,
  .tool, .model-pill, .send-big, .draft .dprog, .draft .dprog .dfill,
  .draft .open, .ib-count, .ib-nav, .step .dot, .track, .fill, .shot .swap,
  .export-btn, .play-btn, .playhead::after, .lava, .planrow .ps, .s-pbar,
  .s-pfill, .s-badge::before { corner-shape: round; }

@media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.24); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); border-radius: 999px; }
  }

@media (max-width: 1100px) { .radar { grid-template-columns: repeat(2, 1fr); } }

@media (max-width: 860px) { .sidebar { display: none; } .wrap { padding: 24px 18px 60px; } .radar { grid-template-columns: 1fr; } }
  </style>
<script>

</head>

  <!-- 贴一条爆款 弹层（拆结构 → 套你的版本；不爬取、不搬运） -->

  <script>
    /* ============================================================
       M8 选题环（真化）：三条真能力 = AI 出题（热点/想题） + 评论里挖题 + 你贴爆款我拆结构。
       数据持久化在本机统一数据层；旧 jco-inspo-v1 / jco-radar-v1 / jco-favs-v1 只做一次性迁移；不爬取、不搬运。
       ============================================================ */
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    /* ---------- 真内核模式（桌面应用里启用；浏览器直开保留空态提示） ---------- */
    const JCO_KERNEL = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel) ? window.jco.kernel : null;

    /* ---------- J.Co 本地状态层 ---------- */
    function jcoLogAdd(kind, title, detail) {
      try {
        var data = JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}');
        data.items.unshift({ t: Date.now(), kind: kind, title: String(title || '').slice(0, 80), detail: String(detail || '').slice(0, 160) });
        if (data.items.length > 200) data.items.length = 200;
        localStorage.setItem('jco-log-v1', JSON.stringify(data));
      } catch (e) {}
    }
    function loadJSON(key, fallback) {
      try { var v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; }
    }
    function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
    function cleanLines(text) {
      return String(text).split('\n').map((l) => l
        .replace(/^#{1,6}\s*/, '')
        .replace(/^[-•*]\s+/, '')
        .replace(/^\d{1,2}[.、)]\s+/, '')
        .trim()).filter((l) => l !== '');
    }
    function todayWord() {
      var d = new Date();
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    /* ---------- 真数据（全部本机持久化） ---------- */
    let inspos = loadJSON('jco-inspo-v1', []);   // 你贴的爆款 + 拆解
    let radar = loadJSON('jco-radar-v1', []);    // 雷达题（hot/ai/cmt）
    let favs = loadJSON('jco-favs-v1', []);      // 收藏的题目
    let brandProfile = null;
    function persistTopics() {
      var payload = { inspos: inspos.slice(0, 10), radar: radar.slice(0, 60), favs: favs.slice(0, 100) };
      if (window.jco && window.jco.topics && window.jco.topics.save) {
        window.jco.topics.save(payload).catch(function () {});
        return;
      }
      // 浏览器直开的降级路径；桌面应用不走这里。
      saveJSON('jco-inspo-v1', payload.inspos);
      saveJSON('jco-radar-v1', payload.radar);
      saveJSON('jco-favs-v1', payload.favs);
    }
    function saveInspos() { inspos = inspos.slice(0, 10); persistTopics(); }
    function saveRadar() { radar = radar.slice(0, 60); persistTopics(); }
    function saveFavs() { favs = favs.slice(0, 100); persistTopics(); }

    function brandLine() {
      if (!brandProfile || typeof brandProfile !== 'object') return '';
      return window.jcoBrandText ? window.jcoBrandText(brandProfile) : '';
    }
    function topicSystemPrompt() {
      var base = '你是短视频选题策划，服务通用自媒体创作者。要求：实用、能直接拍、不夸大承诺、不碰违规说法。只输出要求的行，不要解释。';
      var brand = brandLine();
      return brand ? base + '\n' + brand : base;
    }
    async function hydrateTopicStore() {
      if (!window.jco || !window.jco.topics || !window.jco.topics.get) return;
      try {
        var res = await window.jco.topics.get();
        if (!res || !res.ok) return;
        brandProfile = res.brand || null;
        var data = res.data || {};
        var hasData = (data.inspos || []).length + (data.radar || []).length + (data.favs || []).length > 0;
        if (hasData) {
          inspos = Array.isArray(data.inspos) ? data.inspos : inspos;
          radar = Array.isArray(data.radar) ? data.radar : radar;
          favs = Array.isArray(data.favs) ? data.favs : favs;
        } else {
          var migrated = await window.jco.topics.migrate({ inspos: inspos, radar: radar, favs: favs });
          if (migrated && migrated.ok && migrated.data) {
            inspos = migrated.data.inspos || inspos;
            radar = migrated.data.radar || radar;
            favs = migrated.data.favs || favs;
          }
        }
        var active = document.querySelector('.tab.active');
        var filter = active && active.dataset && active.dataset.f ? active.dataset.f : 'hot';
        renderInspo();
        renderRadar(filter);
      } catch (e) {}
    }

    /* ---------- 拿去开写（交接给「创作」页） / 开始做视频（交接给「创作」页-做视频） ---------- */
    function goWrite(title) {
      try { sessionStorage.setItem('jco-pick-topic', String(title || '')); } catch (e) {}
      location.href = 'J.Co工作台-创作.html';
    }
    function goMake(title) {
      try { sessionStorage.setItem('jco-make-topic', String(title || '')); } catch (e) {}
      location.href = 'J.Co工作台-做视频.html';
    }

    /* ---------- 爆款拆解：贴入 → AI 拆全（为什么火/结构/我的版本） ---------- */
    let inspoBusy = false;
    function inspoOpen() {
      document.getElementById('inspoOverlay').classList.add('show');
      var t = document.getElementById('inspoText');
      if (t) t.focus();
    }
    function inspoClose() { document.getElementById('inspoOverlay').classList.remove('show'); }
    async function inspoGo() {
      var box = document.getElementById('inspoText');
      var v = (box && box.value || '').trim();
      if (!v) { showToast('先贴一条爆款内容（标题或文案都行）'); return; }
      if (inspoBusy) return;
      if (!JCO_KERNEL) { showToast('这个功能在桌面应用里可用（浏览器直开是演示模式）。'); return; }
      inspoBusy = true;
      var btn = document.getElementById('inspoGoBtn');
      if (btn) { btn.disabled = true; btn.textContent = '正在拆……'; }
      var input = [
        '这是我看到的一条爆款（我的账号定位）：',
        '---',
        v.slice(0, 1500),
        '---',
        '请拆解并套出我自己的版本，严格按下面 5 行输出（不要多余解释）：',
        '为什么火：……（一句，说透它的爆点）',
        '它的结构：……（一句，拆它的节奏/套路）',
        '我的标题：……（我可以直接用的新标题）',
        '我的开头：……（一句我视频开头的原话）',
        '讲给谁听：……（一句话）',
      ].join('\n');
      var res = await Promise.race([
        JCO_KERNEL.task({ system: '你是短视频爆款拆解教练。只输出要求的 5 行。', input: input }),
        new Promise(function (r) { setTimeout(function () { r({ ok: false, error: '这次拆太久了（超过 100 秒），再试一次。' }); }, 100000); }),
      ]);
      inspoBusy = false;
      if (btn) { btn.disabled = false; btn.textContent = '拆给我看'; }
      if (!res || !res.ok || !res.text) { showToast('没拆成：' + ((res && res.error) || '未知错误')); return; }
      var item = { t: Date.now(), text: v.slice(0, 200), why: '', structure: '', myTitle: '', hook: '', who: '' };
      cleanLines(res.text).forEach(function (l) {
        if (l.indexOf('为什么火：') === 0) item.why = l.slice(5).trim();
        else if (l.indexOf('它的结构：') === 0) item.structure = l.slice(5).trim();
        else if (l.indexOf('我的标题：') === 0) item.myTitle = l.slice(5).trim();
        else if (l.indexOf('我的开头：') === 0) item.hook = l.slice(5).trim();
        else if (l.indexOf('讲给谁听：') === 0) item.who = l.slice(5).trim();
      });
      if (!item.why && !item.myTitle) item.why = cleanLines(res.text)[0] || '';
      inspos.unshift(item);
      saveInspos();
      inspoClose();
      if (box) box.value = '';
      renderInspo();
      jcoLogAdd('topic', '拆解爆款', (item.myTitle || item.text).slice(0, 40));
      showToast('拆好了：你的版本在下面这张卡里。');
    }

    function renderInspo() {
      var hitsEl = document.getElementById('hits');
      hitsEl.innerHTML = '';
      if (inspos.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '还没贴过爆款。看到好的，点右上角「贴一条爆款」，我拆它的结构、套出你的版本。';
        hitsEl.appendChild(empty);
        return;
      }
      inspos.forEach(function (h, i) {
        var el = document.createElement('div');
        el.className = 'hit anim';
        el.innerHTML =
          '<div class="row1">' +
            '<div class="thumb"><span class="ti ti-flame"></span></div>' +
            '<div class="meta">' +
              '<div class="src"><span class="fire ti ti-flame"></span><span class="who"></span></div>' +
              '<div class="title"></div>' +
              '<div class="stat">你的版本：<b class="mt-line"></b></div>' +
            '</div>' +
            '<div class="ops"><button class="use-btn">看拆解</button></div>' +

          '<div class="detail">' +
            '<div class="why-fire"><span class="ti ti-flame"></span><div>为什么火：<b class="why"></b></div></div>' +
            '<div class="learn">' +
              '<div class="head-cell">学它什么</div>' +
              '<div class="k">它的结构</div><div class="v q st"></div>' +
              '<div class="head-cell">你的版本</div>' +
              '<div class="k">换个标题</div><div class="v mt"></div>' +
              '<div class="k">开头这样说</div><div class="v q hk"></div>' +
              '<div class="k">讲给谁听</div><div class="v wh"></div>' +
            '</div>' +
            '<div class="go-row">' +
              '<button class="ghost write-btn">拿去开写<span class="ti ti-arrow-right"></span></button>' +

          '</div>';
        el.querySelector('.who').textContent = '你贴的爆款 · ' + (h.text || '').slice(0, 24);

        el.querySelector('.mt-line').textContent = h.myTitle || '待拆解';
        el.querySelector('.why').textContent = h.why || '暂无';
        el.querySelector('.st').textContent = h.structure || '暂无';
        el.querySelector('.mt').textContent = h.myTitle || '暂无';
        el.querySelector('.hk').textContent = h.hook || '暂无';
        el.querySelector('.wh').textContent = h.who || '暂无';
        var useBtn = el.querySelector('.use-btn');
        useBtn.addEventListener('click', function () {
          var opening = !el.classList.contains('open');
          if (opening) { el.classList.add('open'); useBtn.textContent = '收起'; }
          else { el.classList.remove('open'); useBtn.textContent = '看拆解'; }
        });
        el.querySelector('.write-btn').addEventListener('click', function () { goWrite(h.myTitle || el.querySelector('.title').textContent); });
        el.querySelector('.go-btn').addEventListener('click', function () { goMake(h.myTitle || el.querySelector('.title').textContent); });

        setTimeout(function () { el.classList.add('in'); }, 40 + i * 70);

    /* ---------- 灵感雷达（AI 热点 / AI 推荐 / 评论挖题 / 我的收藏） ---------- */
    function isFav(title) { return favs.indexOf(title) !== -1; }
    function renderRadar(filter) {
      var radarEl = document.getElementById('radar');
      radarEl.innerHTML = '';
      if (filter === 'cmt') { commentTopics(); return; }
      var list = filter === 'fav' ? radar.filter(function (r) { return isFav(r.title); })
        : radar.filter(function (r) { return r.kind === filter; });
      if (list.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = filter === 'fav' ? '还没有收藏。看到喜欢的，点 ☆ 存起来，别弄丢了。'
          : filter === 'ai' ? '还没有。在下面写一句你想拍什么，点「让 AI 定方向」。'
          : '还没有。点上面的「换一批」，我按今天的风向出几条。';
        radarEl.appendChild(empty);
        return;
      }
      list.forEach(function (r, i) {
        var el = document.createElement('div');
        el.className = 'r-card anim';
        el.innerHTML =
          '<div class="t"></div>' +
          '<div class="foot">' +
            '<span class="tag ' + r.kind + '">' + r.kindName + '</span>' +
            '<span class="heat">' + r.heat + '</span>' +
            '<button class="star ti ti-star" aria-label="收藏"></button>' +
          '</div>';
        el.querySelector('.t').textContent = r.title;
        var star = el.querySelector('.star');
        if (isFav(r.title)) star.classList.add('on');
        star.addEventListener('click', function (e) {
          e.stopPropagation();
          var idx = favs.indexOf(r.title);
          if (idx !== -1) { favs.splice(idx, 1); star.classList.remove('on'); showToast('已取消收藏'); }
          else { favs.unshift(r.title); star.classList.add('on'); showToast('已收藏，切到「我的收藏」随时能找到'); }
          saveFavs();
        });
        el.addEventListener('click', function () { goWrite(r.title); });
        el.style.cursor = 'pointer';
        radarEl.appendChild(el);
        setTimeout(function () { el.classList.add('in'); }, 30 + i * 45);
      });
    }

    /* ---------- 评论里挖题：读运营数据（评论）→ AI 变选题 ---------- */
    let commentBusy = false;
    async function commentTopics() {
      var radarEl = document.getElementById('radar');
      var have = radar.filter(function (r) { return r.kind === 'cmt'; });
      if (have.length > 0) { radarHaveShow(radarEl, have); return; }
      if (commentBusy) return;
      if (!JCO_KERNEL) { radarEl.innerHTML = '<div class="empty">这个功能在桌面应用里可用（浏览器直开是演示模式）。</div>'; return; }
      commentBusy = true;
      radarEl.innerHTML = '<div class="empty">正在翻你的评论，把问得最多的问题变成题……</div>';
      try {
        var live = window.jco && window.jco.publish && window.jco.publish.data;
        var data = live ? await live.get() : null;
        var items = (data && data.comments && data.comments.items) || [];
        if (items.length === 0) {
          radarEl.innerHTML = '<div class="empty">还没有评论数据：去「运营」页点一次「取评论」，这里就有题了。</div>';
          return;
        }
        var texts = items.slice(0, 20).map(function (c) { return '「' + String(c.text || '').slice(0, 60) + '」'; }).join('\n');
        var res = await Promise.race([
          JCO_KERNEL.task({
            system: topicSystemPrompt(),
            input: '下面是观众在我视频下的评论和问题：\n' + texts + '\n\n把它们变成 3~5 条我该做的选题。每行一条，格式：题目|为什么（一句）',
          }),
          new Promise(function (r) { setTimeout(function () { r({ ok: false, error: '这次想太久了（超过 100 秒），再试一次。' }); }, 100000); }),
        ]);
        if (!res || !res.ok || !res.text) {
          radarEl.innerHTML = '<div class="empty">没挖出来：' + ((res && res.error) || '未知错误') + '。再点一次试试。</div>';
          return;
        }
        var got = 0;
        cleanLines(res.text).forEach(function (l) {
          var parts = l.split('|');
          var title = (parts[0] || '').trim();
          if (title.length < 4) return;
          radar.unshift({ kind: 'cmt', kindName: '来自评论', heat: '刚挖到', title: title, why: (parts[1] || '').trim() });
          got++;
        });
        if (got === 0) { radarEl.innerHTML = '<div class="empty">没挖到合适的题，再点一次试试。</div>'; return; }
        saveRadar();
        jcoLogAdd('topic', '评论挖题', got + ' 条来自评论');
        renderRadar('cmt');
      } finally {
        commentBusy = false;
      }
    }
    function radarHaveShow(radarEl, list) {
      radarEl.innerHTML = '';
      list.forEach(function (r, i) {
        var el = document.createElement('div');
        el.className = 'r-card anim';
        el.innerHTML =
          '<div class="t"></div>' +
          '<div class="foot">' +
            '<span class="tag cmt">' + r.kindName + '</span>' +
            '<span class="heat">' + r.heat + '</span>' +
            '<button class="star ti ti-star" aria-label="收藏"></button>' +
          '</div>';
        el.querySelector('.t').textContent = r.title;
        var star = el.querySelector('.star');
        if (isFav(r.title)) star.classList.add('on');
        star.addEventListener('click', function (e) {
          e.stopPropagation();
          var idx = favs.indexOf(r.title);
          if (idx !== -1) { favs.splice(idx, 1); star.classList.remove('on'); showToast('已取消收藏'); }
          else { favs.unshift(r.title); star.classList.add('on'); showToast('已收藏'); }
          saveFavs();
        });
        el.addEventListener('click', function () { goWrite(r.title); });
        el.style.cursor = 'pointer';
        radarEl.appendChild(el);
        setTimeout(function () { el.classList.add('in'); }, 30 + i * 45);
      });
    }

    /* ---------- 「换一批」：AI 热点（真生成，存进雷达） ---------- */
    document.getElementById('refresh').addEventListener('click', async function () {
      if (!JCO_KERNEL) { showToast('这个功能在桌面应用里可用（浏览器直开是演示模式）。'); return; }
      showToast('正在看今天的风向……');
      var res = await JCO_KERNEL.task({
        system: topicSystemPrompt(),
        input: '今天是 ' + todayWord() + '。给 3 条最近该蹭的热点/节点选题，每行一条标题（带一点钩子）。',
      });
      if (res && res.ok && res.text) {
        var titles = cleanLines(res.text).filter(function (l) { return l.length > 3; }).slice(0, 3);
        if (titles.length === 0) { showToast('没扫到，再点一次试试。'); return; }
        titles.reverse().forEach(function (t) { radar.unshift({ kind: 'hot', kindName: 'AI 热点', heat: '新', title: t }); });
        saveRadar();
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        var hotTab = Array.from(document.querySelectorAll('.tab')).find(function (x) { return x.dataset.f === 'hot'; });
        if (hotTab) hotTab.classList.add('active');
        renderRadar('hot');
        jcoLogAdd('topic', 'AI 热点', titles.length + ' 条新方向');
        showToast('出了 ' + titles.length + ' 条，在下面列表里：点卡片就开写，点 ☆ 收藏。');
      } else {
        showToast('没扫成：' + ((res && res.error) || '未知错误'));
      }
    });

    /* ---------- tabs ---------- */
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        renderRadar(tab.dataset.f);
      });
    });

    /* ---------- 底部条：我有想拍的 → AI 定方向（真生成，存进雷达） ---------- */
    async function selfGo() {
      var v = document.getElementById('selfInp').value.trim();
      if (!v) { showToast('先写下你想拍什么，比如：讲讲用户的实际变化'); return; }
      if (!JCO_KERNEL) { showToast('这个功能在桌面应用里可用（浏览器直开是演示模式）。'); return; }
      showToast('想选题中……');
      var res = await JCO_KERNEL.task({
        system: topicSystemPrompt(),
        input: '我想拍的方向：' + v + '\n给我 3 个具体的选题标题，直接给标题，每个一行，不要序号、不要解释。',
      });
      if (res && res.ok && res.text) {
        var titles = cleanLines(res.text).filter(function (l) { return l.length > 3; }).slice(0, 3);
        if (titles.length === 0) { showToast('没想出来，换个说法再试一次。'); return; }
        titles.forEach(function (t) { radar.unshift({ kind: 'ai', kindName: 'AI 现想的', heat: '刚出炉', title: t }); });
        saveRadar();
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        var aiTab = Array.from(document.querySelectorAll('.tab')).find(function (x) { return x.dataset.f === 'ai'; });
        if (aiTab) aiTab.classList.add('active');
        renderRadar('ai');
        document.getElementById('selfInp').value = '';
        showToast('想好了 ' + titles.length + ' 条，在下面「AI 推荐」里，点卡片就开写。');
        jcoLogAdd('topic', 'AI 想选题', titles.length + ' 条已入雷达');
      } else {
        showToast('没想出来：' + ((res && res.error) || '未知错误'));
      }
    }

    /* ---------- 初始化 ---------- */
    renderInspo();
    renderRadar('hot');
    void hydrateTopicStore();
  </script>
  <script>

      /* ---------- 右下角·总管助手 ---------- */

          '今天还剩什么事？': '还有 3 件在你手上：2 条视频等你过目、8 条评论等你放行、19:30 的发布等你确认。都排好了，你点头就行。',
          '评论有什么动静？': '新评论 6 条：2 条问价格（我拟好引导话术了），3 条夸的，1 条问「初中能不能报」。建议你亲自回，这种最容易成。'

        function appendMe(t) {

        function ask(q) {

            var cpEl = cpMsgs[cpMsgs.length - 1];
            window.jco.kernel.ask(q).then(function (res) {

              cpEl.textContent = cpText;

          setTimeout(function () {

        }
        sendBtn.addEventListener('click', fire);
        inp.addEventListener('keydown', function (e) {

        inp.addEventListener('input', function () {

      })();
      /* ---------- 侧栏（图标栏 + 悬停展开 + 固定展开） ---------- */
      (function () {

        } catch (err) {}
      })();
      /* ---------- 侧栏分组折叠 ---------- */
      (function () {
        var KEY = 'jco-sidebar-folded-groups';
        function loadFolded() {
          try { return (localStorage.getItem(KEY) || '').split(',').filter(Boolean); } catch (e) { return []; }
        }
        function saveFolded(list) {
          try { localStorage.setItem(KEY, list.join(',')); } catch (e) {}
        }
        function applyFold(label, hide) {
          label.classList.toggle('folded', hide);
          var el = label.nextElementSibling;
          while (el && !el.classList.contains('group-label')) {
            if (el.classList.contains('nav-item') || el.classList.contains('convos')) {
              el.style.display = hide ? 'none' : '';
            }
            el = el.nextElementSibling;
          }
        }
        var folded = loadFolded();
        document.querySelectorAll('.group-label').forEach(function (label) {
          var name = label.textContent.trim();
          if (folded.indexOf(name) !== -1) applyFold(label, true);
          label.addEventListener('click', function () {
            var hide = !label.classList.contains('folded');
            applyFold(label, hide);
            var list = loadFolded();
            if (hide) { if (list.indexOf(name) === -1) list.push(name); }
            else { list = list.filter(function (x) { return x !== name; }); }
            saveFolded(list);
          });
        });
      })();
      var wm = document.querySelector('.wordmark');
      if (wm) wm.addEventListener('click', function () {
        if ('J.Co主界面-首页.html' !== here) location.href = 'J.Co主界面-首页.html';
      });
      document.querySelectorAll('.convo').forEach(function (btn) {
        btn.addEventListener('click', function () {
          location.href = 'J.Co总管.html';
        });
      });
    })();
  
    /* ---------- 账号菜单（点头像弹出：设置 / 退出登录） ---------- */
    (function () {
      var meBtn = document.getElementById('meBtn');
      var menu = document.getElementById('meMenu');
      if (!meBtn || !menu) return;
      function setOpen(open) {
        menu.hidden = !open;
        meBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      meBtn.addEventListener('click', function () { setOpen(menu.hidden); });
      meBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(menu.hidden); }
        if (e.key === 'Escape') setOpen(false);
      });
      document.addEventListener('click', function (e) {
        if (!menu.hidden && !menu.contains(e.target) && !meBtn.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !menu.hidden) setOpen(false);
      });
      document.getElementById('mmSettings').addEventListener('click', function () {
        setOpen(false);
        var here = decodeURIComponent(location.pathname.split('/').pop());
        if (here !== 'J.Co设置.html') location.href = 'J.Co设置.html';
      });
      document.getElementById('mmLogout').addEventListener('click', function () {
        setOpen(false);
        showToast('这台电脑上不用单独登录：关掉窗口就是退出，素材和草稿都留着。');
      });
    })();
  
    /* ---------- 通知面板：最近的活动记录（真数据） ---------- */
    function jcoToggleNotif(anchor) {
      var old = document.querySelector('.notif-pop');
      if (old) { old.remove(); return; }
      var items = [];
      try { items = (JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}').items) || []; } catch (e) {}
      var pop = document.createElement('div');
      pop.className = 'notif-pop';
      var r = anchor.getBoundingClientRect();
      pop.style.position = 'fixed';
      pop.style.left = Math.min(r.right + 10, window.innerWidth - 296) + 'px';
      pop.style.bottom = Math.max(12, window.innerHeight - r.bottom) + 'px';
      var head = document.createElement('div');
      head.className = 'np-head';
      head.textContent = '最近动态';
      pop.appendChild(head);
      if (items.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'np-empty';
        empty.textContent = '还没有记录。干一句活，这里就开始记。';
        pop.appendChild(empty);
      } else {
        items.slice(0, 8).forEach(function (x) {
          var row = document.createElement('div');
          row.className = 'np-row';
          var d = new Date(x.t);
          var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
          var time = document.createElement('span');
          time.className = 'np-time';
          time.textContent = hh;
          var txt = document.createElement('span');
          txt.className = 'np-txt';
          txt.textContent = x.title + (x.detail ? '（' + x.detail + '）' : '');
          row.appendChild(time);
          row.appendChild(txt);
          pop.appendChild(row);
        });
      }
      var foot = document.createElement('a');
      foot.className = 'np-foot';
      foot.href = 'J.Co总管.html';
      foot.textContent = '去总管看全部 →';
      pop.appendChild(foot);
      document.body.appendChild(pop);
      var closer = function (ev) {
        if (!pop.contains(ev.target)) {
          pop.remove();
          document.removeEventListener('click', closer, true);
        }
      };
      setTimeout(function () { document.addEventListener('click', closer, true); }, 0);
    }
  
  
    /* ---------- 对话列表（真会话）：点击续聊；每项可分享 / 重命名 / 删除；＋ 新会话 ---------- */
    (function jcoConvos() {
      var hasKernel = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel);
      if (!hasKernel) return; // 浏览器直开：保留演示列表
      var data = null;
      try { data = JSON.parse(localStorage.getItem('jco-chats-v1') || 'null'); } catch (e) {}
      var box = document.querySelector('.convos');
      if (!box) return
      // M7：数据缺失也渲染：「新会话」按钮常驻，不依赖"总管页先初始化"
      if (!data || !Array.isArray(data.chats)) { data = { activeId: null, chats: [] } };
      var here = decodeURIComponent(location.pathname.split('/').pop());
      function go(req) {
        try { sessionStorage.setItem('jco-open-chat', req); } catch (e) {}
        if (here !== 'J.Co总管.html') location.href = 'J.Co总管.html';
      }
      function saveChats() { try { localStorage.setItem('jco-chats-v1', JSON.stringify(data)); } catch (e) {} }

      /* 会话操作：分享 / 重命名 / 删除（含两步防误删） */
      var openMenu = null;
      function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
      document.addEventListener('click', closeMenu);
      function toastIt(msg) {
        var t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg; t.classList.add('show');
        clearTimeout(toastIt._t); toastIt._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
      }
      function shareChat(chat) {
        var lines = ['【和 J.Co 的对话 · ' + (chat.title || '新会话') + '】'];
        (chat.messages || []).forEach(function (m) {
          lines.push((m.role === 'user' ? '我：' : 'J.Co：') + String(m.text || ''));
        });
        var text = lines.join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { toastIt('对话已复制，去粘贴分享吧'); },
            function () { toastIt('没复制成，手动选中复制一下'); }
          );
        } else { toastIt('这台环境不支持直接复制'); }
      }
      function showMenu(anchor, chat) {
        closeMenu();
        var menu = document.createElement('div');
        menu.className = 'convo-menu';
        menu.addEventListener('click', function (e) { e.stopPropagation(); });
        function item(icon, label, cls, fn) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = cls || '';
          b.innerHTML = '<span class="ti ' + icon + '"></span>' + label;
          b.addEventListener('click', fn);
          menu.appendChild(b);
          return b;
        }
        item('ti-share-3', '分享对话', '', function () { closeMenu(); shareChat(chat); });
        item('ti-file-text', '重命名', '', function () {
          closeMenu();
          var row = anchor.closest('.convo');
          var nameEl = row ? row.querySelector('.name') : null;
          if (!nameEl) return;
          var input = document.createElement('input');
          input.className = 'convo-rename';
          input.value = chat.title || '新会话';
          nameEl.replaceWith(input);
          input.focus(); input.select();
          var done = false;
          function commit(saveIt) {
            if (done) return; done = true;
            var v = input.value.trim().slice(0, 20);
            if (saveIt && v) chat.title = v;
            nameEl.textContent = chat.title || '新会话';
            input.replaceWith(nameEl);
            if (saveIt && v) { saveChats(); toastIt('改好名字了'); }
          }
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            if (e.key === 'Escape') { commit(false); }
          });
          input.addEventListener('blur', function () { commit(true); });
          input.addEventListener('click', function (e) { e.stopPropagation(); });
        });
        var del = item('ti-trash', '删除对话', 'danger', function () {
          if (del.getAttribute('data-armed') !== '1') {
            del.setAttribute('data-armed', '1');
            del.innerHTML = '<span class="ti ti-trash"></span>再点一次，真删除';
            return;
          }
          closeMenu();
          var wasActive = data.activeId === chat.id;
          data.chats = data.chats.filter(function (x) { return x.id !== chat.id; });
          if (data.chats.length === 0) {
            data.chats.push({ id: 'c' + Date.now().toString(36), title: '新会话', updatedAt: Date.now(), messages: [] });
          }
          if (wasActive) data.activeId = data.chats[0].id;
          saveChats();
          toastIt('已删除「' + (chat.title || '新会话') + '」');
          render();
        });
        document.body.appendChild(menu);
        var r = anchor.getBoundingClientRect();
        var mw = menu.offsetWidth || 160, mh = menu.offsetHeight || 130;
        var left = Math.min(r.right + 8, window.innerWidth - mw - 10);
        var top = Math.min(r.bottom + 4, window.innerHeight - mh - 10);
        if (top < 8) top = 8;
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        openMenu = menu;
      }
      function render() {
        box.innerHTML = '';
        var add = document.createElement('button');
        add.className = 'convo new-btn';
        add.innerHTML = '<span class="ti ti-plus"></span>新会话';
        add.addEventListener('click', function (e) { e.stopPropagation(); go('new'); });
        // 「新会话」按钮位：顶部搜索框下方（M7 全站统一；找不到容器时回退列表内）
        var slot = document.getElementById('newChatSlot');
        if (slot) {
          slot.innerHTML = '';
          slot.appendChild(add);
        } else {
          box.appendChild(add);
        }
        data.chats.slice(0, 8).forEach(function (c) {
          var b = document.createElement('button');
          b.className = 'convo' + (c.id === data.activeId ? ' active' : '');
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = c.title || '新会话';
          b.appendChild(nm);
          var more = document.createElement('span');
          more.className = 'convo-more';
          more.setAttribute('role', 'button');
          more.setAttribute('tabindex', '0');
          more.setAttribute('aria-label', '更多操作');
          more.textContent = '⋯';
          more.addEventListener('click', function (e) { e.stopPropagation(); showMenu(more, c); });
          more.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); showMenu(more, c); } });
          b.appendChild(more);
          b.addEventListener('click', function (e) { e.stopPropagation(); go(c.id); });
          box.appendChild(b);
        });
      }
      render();
    })();
  
  </script>
  
</body>
</html>
