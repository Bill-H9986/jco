<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.Co · 素材</title>
  <link rel="stylesheet" href="./assets/jco-ui.css">
  <script src="./assets/jco-shell.js"></script>
  <style>
/* ============ 主区 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.scroll { flex: 1; overflow-y: auto; }

.wrap { max-width: none; margin: 0 auto; padding: var(--jco-page-top) var(--jco-page-x) 70px; }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

.head h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }

.head .sub { margin-top: 7px; font-size: 14px; color: var(--text-2); }

.brief {
    margin-top: 20px; display: flex; align-items: center; gap: 12px;
    background: var(--tint); border-radius: 20px; padding: 14px 18px;
    font-size: 14px; color: var(--text-2);
  }

.brief .ti { font-size: 16px; color: var(--text-2); flex: none; }

.brief b { color: var(--text-1); font-weight: 600; }

.brief .ok { color: var(--green); font-weight: 600; }

.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 12px; }

.sec-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }

.sec-head .hint { font-size: 13px; color: var(--text-3); }

.tabs { display: flex; gap: 22px; margin: 4px 0 16px; }

/* 素材网格 */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

.mat {
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card);
    border: none; padding: 0; overflow: hidden; cursor: pointer; text-align: left;
    font-family: inherit; display: flex; flex-direction: column;
    transition: transform 0.16s var(--ease), box-shadow 0.16s var(--ease);
    user-select: none;
  }

.mat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.mat:active { transform: scale(0.985); }

.mat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mat .ph {
    aspect-ratio: 3 / 4; height: auto; background: var(--tint); color: var(--text-3);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    position: relative; overflow: hidden;
  }

.mat .ph .ph-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 20px 20px 0 0; }

.mat .ph.missing { color: var(--text-2); }

.mat .ph .missing-tag {
    position: absolute; left: 8px; bottom: 8px; z-index: 2;
    padding: 3px 7px; border-radius: 999px;
    background: rgba(120, 120, 128, 0.16); color: var(--text-2);
    font-size: 11px; font-weight: 600;
  }

/* 素材预览（导入的本机文件可看） */
  .mat-preview { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(20, 20, 24, 0.5); }

.mat-preview[hidden] { display: none; }

.mp-box { width: min(720px, 86vw); max-height: 84vh; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-modal); overflow: hidden; display: flex; flex-direction: column; }

.mp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 18px; border-bottom: 0.5px solid var(--line); }

.mp-name { font-size: 14px; font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mp-close { flex: none; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: none; border-radius: 8px; background: transparent; color: var(--text-2); font-size: 16px; cursor: pointer; transition: background 0.15s ease; }

.mp-close:hover { background: var(--hover); }

.mp-close:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.mp-body { padding: 14px; overflow: auto; display: flex; align-items: center; justify-content: center; }

.mp-body img, .mp-body video { max-width: 100%; max-height: 64vh; border-radius: 12px; }

.preview-missing {
    width: 100%; padding: 32px 20px; text-align: center;
    color: var(--text-2); font-size: 13px; line-height: 1.7;
  }

.mat .badge {
    position: absolute; right: 7px; bottom: 7px;
    font-size: 12px; color: #ffffff; background: rgba(30, 30, 34, 0.6);
    border-radius: 4px; padding: 1px 6px;
  }

.mat .badge.wm { background: rgba(36, 138, 61, 0.85); }

.mat .info { padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 4px; }

.mat .nm { font-size: 13px; font-weight: 600; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mat .src { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mat .src .idea { color: var(--accent); }

.mat .pick-check {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    width: 26px; height: 26px; border-radius: 999px;
    display: none; align-items: center; justify-content: center;
    color: #ffffff; background: rgba(30, 30, 34, 0.42);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
    font-size: 15px; pointer-events: none;
  }

.pick-mode .mat .pick-check { display: flex; }

.mat.picked .pick-check { background: var(--accent); }

.mat .mat-eye {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    width: 30px; height: 30px; border: none; border-radius: 999px;
    display: none; align-items: center; justify-content: center;
    color: #ffffff; background: rgba(30, 30, 34, 0.42);
    font-size: 15px; cursor: pointer;
  }

.pick-mode .mat .mat-eye { display: flex; }

.mat .mat-eye:hover { background: rgba(30, 30, 34, 0.62); }

.mat .mat-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mat.picked { outline: 2px solid var(--accent); outline-offset: 2px; }

.empty { grid-column: 1 / -1; text-align: center; color: var(--text-3); font-size: 14px; padding: 40px 0; }

/* AI 找画面横条 */
  .ai-bar {
    display: flex; gap: 10px; align-items: center;
    max-width: none; margin: 0 74px 0 0;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    padding: 12px 14px 12px 20px;
  }

.ai-bar .ti { font-size: 18px; color: var(--accent); flex: none; }

.ai-bar input {
    flex: 1; border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 14px; color: var(--text-1);
  }

.ai-bar input:focus-visible { outline: none; }

.ai-bar input::placeholder { color: var(--text-3); }

.ai-bar .ghost { flex: none; }

.anim { opacity: 0; transform: translateY(10px); }

.anim.in { opacity: 1; transform: none; transition: opacity 0.4s var(--ease), transform 0.4s var(--ease); }

/* 底部常驻操作条 */
  .pinbar {
    flex: none; padding: 8px 32px 14px;
    background: transparent; border-top: none;
  }

.pinbar > * { margin-top: 0 !important; max-width: none; margin-left: 0; margin-right: 74px; }

.pick-bar {
    display: none; align-items: center; gap: 10px;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    padding: 10px 12px 10px 18px;
  }

.pick-mode .pick-bar { display: flex; margin-top: 8px !important; }

.pick-count { font-size: 13px; color: var(--text-2); white-space: nowrap; }

.pick-bar .spacer { flex: 1; }

.pick-bar .go-btn:disabled { opacity: 0.45; cursor: not-allowed; }

@media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.24); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); border-radius: 999px; }
  }

@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }

@media (max-width: 860px) { .sidebar { display: none; } .wrap { padding: 24px 18px 60px; } .grid { grid-template-columns: repeat(2, 1fr); } .pick-bar { flex-wrap: wrap; } .pick-bar .spacer { flex-basis: 100%; } }
  </style>
<script>
  /* 提前恢复侧栏展开状态，避免页面加载时闪一下 */
  try { if (localStorage.getItem('jco-side-pinned') === '1') document.documentElement.classList.add('side-pinned'); } catch (e) {}
</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-inner">
      <div class="side-top">
        <div class="wordmark">J.Co</div>
        <button class="side-toggle" aria-label="固定展开侧栏" title="点一下固定展开，再点收起"><span class="ti ti-layout-sidebar-left-expand"></span></button>
      </div>
      <div class="search"><span class="ti ti-search"></span><input placeholder="搜索"></div>
      <div class="newchat" id="newChatSlot"></div>
      <nav class="nav">
        <button class="nav-item"><span class="ti ti-message-plus"></span>总管</button>
        <button class="group-label" type="button"><span class="ti ti-layout-grid"></span>工作台<span class="ti ti-chevron-down"></span></button>
        <button class="nav-item"><span class="ti ti-bulb"></span>选题</button>
        <button class="nav-item active"><span class="ti ti-photo"></span>素材</button>
        <button class="nav-item"><span class="ti ti-file-text"></span>文案</button>
        <button class="nav-item"><span class="ti ti-video"></span>创作</button>
        <button class="nav-item"><span class="ti ti-wand"></span>后期</button>
        <button class="nav-item"><span class="ti ti-upload"></span>发布</button>
        <button class="nav-item"><span class="ti ti-chart-bar"></span>运营</button>
        <button class="group-label" type="button"><span class="ti ti-tool"></span>工具<span class="ti ti-chevron-down"></span></button>
        <button class="nav-item"><span class="ti ti-clock-play"></span>自动任务</button>
        <button class="nav-item"><span class="ti ti-sparkles"></span>技能库</button>
        <button class="nav-item"><span class="ti ti-users-group"></span>管家团队</button>
        <button class="nav-item"><span class="ti ti-key"></span>账号中心</button>
      </nav>
      <button class="group-label" type="button"><span class="ti ti-messages"></span>对话<span class="ti ti-chevron-down"></span></button>
      <div class="convos">
        <button class="convo"><span class="name">示例项目 · 今日发布</span></button>
        <button class="convo"><span class="name">评论跟进（5 条）</span></button>
        <button class="convo"><span class="name">上周数据复盘</span></button>
        <button class="convo"><span class="name">引流名单 · 待跟进</span></button>
        <button class="convo"><span class="name">视频脚本草稿</span></button>
        <button class="convo"><span class="name">技能库询价</span></button>
      </div>
      <div class="side-foot">
        <div class="me" id="meBtn" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false"><div class="ava">J</div><span>Jay</span></div>
        <button class="icon-btn" aria-label="通知"><span class="ti ti-bell"></span></button>
      </div>
          </div>
      <div class="me-menu" id="meMenu" hidden role="menu" aria-label="账号菜单">
        <div class="mm-head"><div class="ava">J</div><div class="mm-who"><b>Jay</b><span>软件账号 · 仅本机</span></div></div>
        <div class="mm-sep"></div>
        <button class="mm-item" id="mmSettings" role="menuitem"><span class="ti ti-settings"></span>设置</button>
        <button class="mm-item" id="mmLogout" role="menuitem"><span class="ti ti-logout"></span>退出登录</button>
      </div>
    </aside>

    <main class="main">
      <div class="scroll">
        <div class="wrap">
          <div class="page-head">
            <div class="page-head__main"><div>
                <h1>素材</h1>
                <div class="sub">做视频要用的料，AI 帮你收好、归好类。</div>
              </div>
            </div>
            <div class="page-head__actions">
              <button class="ghost" onclick="importFiles()"><span class="ti ti-upload"></span>导入素材</button>
            </div>
          </div>

          <div class="brief">
            <span class="ti ti-photo"></span>
            <span id="boxLine">正在看本机素材……</span>
          </div>

          <div class="sec-head">
            <h2>素材箱</h2>
            <span class="hint">导入的素材本机随取随用；缺画面就点下面「AI 帮你找」出拍摄方案</span>
          </div>
          <nav class="tabs" id="tabs">
            <button class="tab active" data-f="all">全部</button>
            <button class="tab" data-f="mine">我的拍摄</button>
            <button class="tab" data-f="web">网图网片</button>
            <button class="tab" data-f="idea">灵感收藏</button>
          </nav>
          <div class="grid" id="grid"></div>

        </div>
      </div>
      <div class="pinbar">
        <div class="ai-bar">
            <span class="ti ti-sparkles"></span>
            <input id="aiInp" placeholder="缺什么画面说一句，比如：来点教室上课的画面">
            <button class="ghost" onclick="aiFind()">AI 帮你找</button>
          </div>
        <div class="pick-bar" id="pickBar" aria-live="polite">
          <span class="pick-count" id="pickCount">已选 0 件</span>
          <span class="spacer"></span>
          <button class="ghost" type="button" onclick="cancelPick()">取消</button>
          <button class="go-btn" id="pickDone" type="button" onclick="confirmPick()" disabled>带回创作</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 右下角·总管助手 -->
  <button class="copilot-btn" id="copilotBtn" aria-label="打开总管助手"><span class="ti ti-message-dots"></span></button>
  <div class="copilot" id="copilot" hidden>
    <div class="cp-head">
      <span class="cp-ava">J</span>
      <span class="cp-title">总管</span>
      <span class="cp-sub">问点啥都行</span>
      <button class="cp-fold" id="cpFold" aria-label="收起助手"><span class="ti ti-chevron-down"></span></button>
    </div>
    <div class="cp-body" id="cpBody">
      <div class="cp-msg ai">在的。想问点什么？比如这条视频的实时数据。</div>
      <div class="cp-acts">
        <button class="cp-act" data-q="这条视频数据怎么样？">这条视频数据怎么样？</button>
        <button class="cp-act" data-q="今天还剩什么事？">今天还剩什么事？</button>
        <button class="cp-act" data-q="评论有什么动静？">评论有什么动静？</button>
      </div>
    </div>
    <div class="cp-inp">
      <textarea id="cpInp" rows="1" placeholder="问总管，比如：这条视频现在多少播放"></textarea>
      <button class="cp-send" id="cpSend" aria-label="发送"><span class="ti ti-arrow-up"></span></button>
    </div>
  </div>
  <!-- 素材预览（导入的本机文件可看） -->
  <div class="mat-preview" id="matPreview" hidden>
    <div class="mp-box">
      <div class="mp-head"><span class="mp-name" id="mpName"></span><button class="mp-close" id="mpClose" aria-label="关闭预览"><span class="ti ti-x"></span></button></div>
      <div class="mp-body" id="mpBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    /* 素材箱（真）：初始为空；你导入的素材、AI 找的画面方案，全部存本机统一数据层；
       旧 jco-materials-v1 只做一次性迁移与浏览器直开降级。 */
    const MATERIALS = [];
    let brandProfile = null;

    const gridEl = document.getElementById('grid');
    const toastEl = document.getElementById('toast');
    const ICON = { video: 'ti-video', photo: 'ti-photo', star: 'ti-star', audio: 'ti-music' };
    const PICK_PARAMS = new URLSearchParams(location.search || '');
    const PICK_MODE = PICK_PARAMS.get('pick') === '1';
    const PICK_RETURN = (function () {
      var value = String(PICK_PARAMS.get('return') || '');
      return /^J\.Co[^/\\:]*\.html$/.test(value) ? value : 'J.Co工作台-做视频.html';
    })();
    const PICKED = new Set();

    function materialKey(m) {
      return String((m && (m.path || (m.name + '|' + m.src))) || '');
    }

    function updatePickBar() {
      var count = PICKED.size;
      var countEl = document.getElementById('pickCount');
      var doneEl = document.getElementById('pickDone');
      if (countEl) countEl.textContent = '已选 ' + count + ' 件';
      if (doneEl) doneEl.disabled = count === 0;
    }

    function togglePick(m, el) {
      var key = materialKey(m);
      if (PICKED.has(key)) PICKED.delete(key);
      else PICKED.add(key);
      if (el) {
        el.classList.toggle('picked', PICKED.has(key));
        el.setAttribute('aria-pressed', PICKED.has(key) ? 'true' : 'false');
      }
      updatePickBar();
    }

    function leavePicker(hasPicked) {
      if (window.parent && window.parent !== window && typeof window.parent.__jcoGo === 'function') {
        try {
          window.parent.postMessage(
            {
              __jcoPickerReturn: PICK_RETURN,
              __jcoPickedMaterials: Boolean(hasPicked),
            },
            '*',
          );
          return;
        } catch (e) {}
      }
      location.href = PICK_RETURN;
    }

    function confirmPick() {
      var items = MATERIALS.filter(function (m) { return PICKED.has(materialKey(m)); });
      if (items.length === 0) {
        showToast('先选至少一件素材，再带回创作。');
        return;
      }
      try {
        sessionStorage.setItem('jco-picked-materials', JSON.stringify({ items: items, at: Date.now() }));
      } catch (e) {
        showToast('这台电脑的临时存储不可用，先别关页面，再试一次。');
        return;
      }
      leavePicker(true);
    }

    function cancelPick() {
      try { sessionStorage.removeItem('jco-picked-materials'); } catch (e) {}
      leavePicker(false);
    }

    if (PICK_MODE) {
      document.body.classList.add('pick-mode');
      var pickSub = document.querySelector('.page-head .sub');
      var pickHint = document.querySelector('.sec-head .hint');
      if (pickSub) pickSub.textContent = '选择要带回创作页的素材，选好后点底部「带回创作」。';
      if (pickHint) pickHint.textContent = '点卡片选中；点左上角眼睛可先预览。';
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    /* ---------- 真内核模式（桌面应用里启用；浏览器直开保持演示） ---------- */
    const JCO_KERNEL = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel) ? window.jco.kernel : null;
    /* ---------- J.Co 本地状态层：活动日志 ---------- */
    function jcoLogAdd(kind, title, detail) {
      try {
        var data = JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}');
        data.items.unshift({ t: Date.now(), kind: kind, title: String(title || '').slice(0, 80), detail: String(detail || '').slice(0, 160) });
        if (data.items.length > 200) data.items.length = 200;
        localStorage.setItem('jco-log-v1', JSON.stringify(data));
      } catch (e) {}
    }
    function cleanLines(text) {
      return String(text).split('\n').map((l) => l
        .replace(/^#{1,6}\s*/, '')
        .replace(/^[-•*]\s+/, '')
        .replace(/^\d{1,2}[.、)]\s+/, '')
        .trim()).filter((l) => l !== '');
    }
    function brandLine() {
      if (!brandProfile || typeof brandProfile !== 'object') return '';
      return window.jcoBrandText ? window.jcoBrandText(brandProfile) : '';
    }
    function materialSystemPrompt() {
      var base = '你是短视频画面策划，服务通用自媒体创作者。只输出要求的行。';
      var brand = brandLine();
      return brand ? base + '\n' + brand : base;
    }
    async function hydrateBrandProfile() {
      if (!window.jco || !window.jco.brand || !window.jco.brand.get) return;
      try {
        var res = await window.jco.brand.get();
        if (res && res.ok) brandProfile = res.data || null;
      } catch (e) {}
    }
    /* ---------- 导入素材（真文件对话框）/ 本机预览 / 持久化 ---------- */
    function fileUrl(p) {
      var q = String(p).replace(/\\/g, '/');
      if (q.charAt(0) !== '/') q = '/' + q;
      return 'file://' + encodeURI(q);
    }
    function jcoMaterialsSave() {
      var payload = { items: MATERIALS.slice(0, 100) };
      if (window.jco && window.jco.materials && window.jco.materials.save) {
        window.jco.materials.save(payload).then(function (res) {
          if (!res || !res.ok) showToast('素材没存上：' + ((res && res.error) || '未知错误'));
        }, function () {
          showToast('素材没存上，再试一次。');
        });
        return;
      }
      try {
        localStorage.setItem('jco-materials-v1', JSON.stringify(payload));
      } catch (e) {}
    }
    function jcoMaterialsLoad() {
      try { return (JSON.parse(localStorage.getItem('jco-materials-v1') || '{"items":[]}').items) || []; } catch (e) { return []; }
    }
    async function hydrateMaterialsStore() {
      if (!window.jco || !window.jco.materials || !window.jco.materials.get) return;
      try {
        var res = await window.jco.materials.get();
        if (!res || !res.ok) return;
        var items = (res.data && res.data.items) || [];
        if (items.length === 0 && MATERIALS.length > 0) {
          var migrated = await window.jco.materials.migrate({ items: MATERIALS });
          if (migrated && migrated.ok && migrated.data) items = migrated.data.items || [];
        }
        MATERIALS.length = 0;
        items.forEach(function (m) { MATERIALS.push(m); });
        var active = document.querySelector('.tab.active');
        var filter = active && active.dataset && active.dataset.f ? active.dataset.f : 'all';
        render(filter);
      } catch (e) {}
    }
    function importFiles() {
      var sys = (typeof window.jco !== 'undefined' && window.jco && window.jco.sys) ? window.jco.sys : null;
      if (!sys || !sys.pickFiles) {
        showToast('这个功能在桌面应用里可用（浏览器直开是演示模式）。');
        return;
      }

        if (!res || !res.ok) { showToast('没打开选择框：' + ((res && res.error) || '未知错误')); return; }

        var added = [];
        files.forEach(function (f) {
          var ext = String(f.name).split('.').pop().toLowerCase();
          var type = ['mp4', 'mov', 'mkv', 'webm'].indexOf(ext) >= 0 ? 'video'
            : (['mp3', 'wav', 'm4a', 'aac'].indexOf(ext) >= 0 ? 'audio' : 'photo');
          var item = { cat: 'mine', type: type, name: f.name, src: '导入 · 本机文件', badge: '', wm: false, imported: true, path: f.path };
          MATERIALS.unshift(item);
          added.push(item);
        });
        if (PICK_MODE) added.forEach(function (m) { PICKED.add(materialKey(m)); });
        jcoMaterialsSave();
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.f === 'mine'); });
        render('mine');
        showToast('导入好了 ' + files.length + ' 件，在「我的拍摄」里。点一下能预览。');
        jcoLogAdd('material', '导入素材', files.length + ' 件');
      }, function () { showToast('没打开选择框，再试一次。'); });
    }
    function openPreview(m) {
      var box = document.getElementById('matPreview');
      var body = document.getElementById('mpBody');
      var nameEl = document.getElementById('mpName');
      if (!box || !body) return;
      nameEl.textContent = m.name;
      body.innerHTML = '';
      var url = fileUrl(m.path);
      var showMissing = function () {
        body.innerHTML = '<div class="preview-missing">文件不可用，可能已经被移动或删除。<br>请重新导入这个素材。</div>';
      };
      if (m.type === 'video') {
        var v = document.createElement('video');
        v.src = url;
        v.controls = true;
        v.addEventListener('error', showMissing, { once: true });
        body.appendChild(v);
      } else if (m.type === 'audio') {
        var au = document.createElement('audio');
        au.src = url;
        au.controls = true;
        au.addEventListener('error', showMissing, { once: true });
        body.appendChild(au);
      } else {
        var img = document.createElement('img');
        img.src = url;
        img.alt = m.name;
        img.addEventListener('error', showMissing, { once: true });
        body.appendChild(img);
      }
      box.hidden = false;
    }
    function closePreview() {
      var box = document.getElementById('matPreview');
      var body = document.getElementById('mpBody');
      if (!box) return;
      box.hidden = true;
      if (body) body.innerHTML = '';
    }
    (function bindPreview() {
      var box = document.getElementById('matPreview');
      var close = document.getElementById('mpClose');
      if (close) close.addEventListener('click', closePreview);
      if (box) box.addEventListener('click', function (e) { if (e.target === box) closePreview(); });
    })();
    window.addEventListener('jco:pagehide', closePreview);

    function renderBoxLine() {
      const el = document.getElementById('boxLine');
      if (!el) return;
      const n = MATERIALS.filter((m) => m.cat === 'mine').length;
      const ideas = MATERIALS.filter((m) => m.cat === 'idea').length;
      if (n === 0 && ideas === 0) {
        el.innerHTML = '素材箱还空着：点右上「<b>导入素材</b>」把手机/电脑里的料收进来。';
        return;
      }
      const parts = [];
      if (n > 0) parts.push('你导入的素材 <b>' + n + ' 件</b>');
      if (ideas > 0) parts.push('AI 找的画面方案 <b>' + ideas + ' 条</b>');
      el.innerHTML = '素材箱里：' + parts.join(' · ') + '。';
    }

    function markMaterialMissing(el, m) {
      if (!el) return;
      const ph = el.querySelector('.ph');
      if (!ph) return;
      el.dataset.missing = '1';
      ph.classList.add('missing');
      const srcEl = el.querySelector('.src');
      if (srcEl) srcEl.textContent = '文件不可用 · 请重新导入';
      if (!ph.querySelector('.missing-tag')) {
        const tag = document.createElement('span');
        tag.className = 'missing-tag';
        tag.textContent = '文件不可用';
        ph.appendChild(tag);
      }
      if (PICKED.delete(materialKey(m))) {
        el.classList.remove('picked');
        el.setAttribute('aria-pressed', 'false');
        updatePickBar();
      }
    }

    function render(filter) {
      renderBoxLine();
      gridEl.innerHTML = '';
      const list = filter === 'all' ? MATERIALS : MATERIALS.filter((m) => m.cat === filter);
      if (list.length === 0) {
        gridEl.innerHTML = '<div class="empty">' + (PICK_MODE ? '这里还空着。点右上「导入素材」把要用的料收进来。' : '这里还空着。去收集一些吧。') + '</div>';
        updatePickBar();
        return;
      }
      list.forEach((m, i) => {
        const el = document.createElement('div');
        el.className = 'mat anim';
        el.setAttribute('role', 'button');
        el.tabIndex = 0;
        if (PICK_MODE) el.setAttribute('aria-pressed', PICKED.has(materialKey(m)) ? 'true' : 'false');
        el.innerHTML = `
          <div class="ph"><span class="ti ${ICON[m.type]}"></span>${m.badge ? `<span class="badge">${m.badge}</span>` : ''}${m.wm ? '<span class="badge wm">已去水印</span>' : ''}</div>
          <div class="info">
            <span class="nm"></span>
            <span class="src"></span>
          </div>`;
        el.querySelector('.nm').textContent = m.name;
        el.querySelector('.src').textContent = m.src;
        if (m.path && m.type === 'photo') {
          const img = document.createElement('img');
          img.className = 'ph-img';
          img.src = fileUrl(m.path);
          img.alt = '';
          img.addEventListener('error', function () {
            img.remove();
            markMaterialMissing(el, m);
          }, { once: true });
          el.querySelector('.ph').prepend(img);
        }
        const ph = el.querySelector('.ph');
        const check = document.createElement('span');
        check.className = 'pick-check';
        check.setAttribute('aria-hidden', 'true');
        check.innerHTML = '<span class="ti ti-check"></span>';
        ph.appendChild(check);

          const eye = document.createElement('button');
          eye.className = 'mat-eye';
          eye.type = 'button';
          eye.setAttribute('aria-label', '预览 ' + m.name);
          eye.innerHTML = '<span class="ti ti-eye"></span>';
          eye.addEventListener('click', function (e) {
            e.stopPropagation();
            openPreview(m);
          });
          ph.appendChild(eye);
        }
        const activate = () => {
          if (el.dataset.missing === '1') {
            if (PICK_MODE) showToast('这个素材文件不可用，先重新导入。');
            else openPreview(m);
            return;
          }
          if (PICK_MODE) {
            togglePick(m, el);
            return;
          }
          if (m.path) { openPreview(m); return; }
          showToast('「' + m.name + '」：' + (m.src || '这条先记着'));
        };
        el.addEventListener('click', activate);
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            activate();
          }
        });
        if (PICK_MODE) el.classList.toggle('picked', PICKED.has(materialKey(m)));
        gridEl.appendChild(el);
        setTimeout(() => el.classList.add('in'), 30 + i * 40);
      });
      updatePickBar();
    }

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        render(tab.dataset.f);
      });
    });

    async function aiFind() {
      const v = document.getElementById('aiInp').value.trim();
      if (!v) { showToast('说一句你缺什么画面，比如：来点教室上课的画面'); return; }
      if (JCO_KERNEL) {
        showToast('正在配画面……');
        const input = [
          '我缺这些画面：' + v,
          '我在做短视频内容创作。',
          '给我 4 条具体的画面方案，每条一行，格式：画面名称｜一句话说明怎么拍或去哪找。不要序号、不要解释。',
        ].join('\n');
        const res = await JCO_KERNEL.task({
          system: materialSystemPrompt(),
          input: input,
        });
        if (res && res.ok && res.text) {
          const rows = cleanLines(res.text).slice(0, 4).map((l) => {
            const parts = l.split(/[|｜]/);
            return { name: (parts[0] || '').trim(), tip: (parts[1] || 'AI 找的 · 刚配好').trim() };
          }).filter((x) => x.name !== '');
          if (rows.length === 0) { showToast('没配上，换个说法再试一次。'); return; }
          rows.forEach((r) => MATERIALS.unshift({ cat: 'idea', type: 'star', name: r.name, src: 'AI 找的 · ' + r.tip, badge: 'AI' }));
          jcoMaterialsSave();
          document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
          const allTab = Array.from(document.querySelectorAll('.tab')).find((t) => t.dataset.f === 'all');
          if (allTab) allTab.classList.add('active');
          render('all');
          document.getElementById('aiInp').value = '';
          showToast('配好了 ' + rows.length + ' 条画面，在最前面。点进做视频就能用。');
          jcoLogAdd('material', 'AI 找画面', rows.length + ' 条已入素材箱');
        } else {
          showToast('没配上：' + ((res && res.error) || '未知错误'));
        }
        return;
      }
      showToast('这个功能在桌面应用里可用（浏览器直开是演示模式）。');
    }

    // 恢复上次导入的素材（真模式：导入过的不丢）
    (function restoreImported() {
      const saved = jcoMaterialsLoad();
      if (saved.length > 0) {
        saved.slice().reverse().forEach((m) => MATERIALS.unshift(m));
      }
      render('all');
      void hydrateMaterialsStore();
      void hydrateBrandProfile();
    })();

      function showMenu(anchor, chat) {
        closeMenu();
        var menu = document.createElement('div');
        menu.className = 'convo-menu';
        menu.addEventListener('click', function (e) { e.stopPropagation(); });
        function item(icon, label, cls, fn) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = cls || '';
          b.innerHTML = '<span class="ti ' + icon + '"></span>' + label;
          b.addEventListener('click', fn);
          menu.appendChild(b);
          return b;
        }
        item('ti-share-3', '分享对话', '', function () { closeMenu(); shareChat(chat); });
        item('ti-file-text', '重命名', '', function () {
          closeMenu();
          var row = anchor.closest('.convo');
          var nameEl = row ? row.querySelector('.name') : null;
          if (!nameEl) return;
          var input = document.createElement('input');
          input.className = 'convo-rename';
          input.value = chat.title || '新会话';
          nameEl.replaceWith(input);
          input.focus(); input.select();
          var done = false;
          function commit(saveIt) {
            if (done) return; done = true;
            var v = input.value.trim().slice(0, 20);
            if (saveIt && v) chat.title = v;
            nameEl.textContent = chat.title || '新会话';
            input.replaceWith(nameEl);
            if (saveIt && v) { saveChats(); toastIt('改好名字了'); }
          }
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            if (e.key === 'Escape') { commit(false); }
          });
          input.addEventListener('blur', function () { commit(true); });
          input.addEventListener('click', function (e) { e.stopPropagation(); });
        });
        var del = item('ti-trash', '删除对话', 'danger', function () {
          if (del.getAttribute('data-armed') !== '1') {
            del.setAttribute('data-armed', '1');
            del.innerHTML = '<span class="ti ti-trash"></span>再点一次，真删除';
            return;
          }
          closeMenu();
          var wasActive = data.activeId === chat.id;
          data.chats = data.chats.filter(function (x) { return x.id !== chat.id; });
          if (data.chats.length === 0) {
            data.chats.push({ id: 'c' + Date.now().toString(36), title: '新会话', updatedAt: Date.now(), messages: [] });
          }
          if (wasActive) data.activeId = data.chats[0].id;
          saveChats();
          toastIt('已删除「' + (chat.title || '新会话') + '」');
          render();
        });
        document.body.appendChild(menu);
        var r = anchor.getBoundingClientRect();
        var mw = menu.offsetWidth || 160, mh = menu.offsetHeight || 130;
        var left = Math.min(r.right + 8, window.innerWidth - mw - 10);
        var top = Math.min(r.bottom + 4, window.innerHeight - mh - 10);
        if (top < 8) top = 8;
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        openMenu = menu;
      }
      function render() {
        box.innerHTML = '';
        var add = document.createElement('button');
        add.className = 'convo new-btn';
        add.innerHTML = '<span class="ti ti-plus"></span>新会话';
        add.addEventListener('click', function (e) { e.stopPropagation(); go('new'); });
        // 「新会话」按钮位：顶部搜索框下方（M7 全站统一；找不到容器时回退列表内）
        var slot = document.getElementById('newChatSlot');
        if (slot) {
          slot.innerHTML = '';
          slot.appendChild(add);
        } else {
          box.appendChild(add);
        }
        data.chats.slice(0, 8).forEach(function (c) {
          var b = document.createElement('button');
          b.className = 'convo' + (c.id === data.activeId ? ' active' : '');
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = c.title || '新会话';
          b.appendChild(nm);
          var more = document.createElement('span');
          more.className = 'convo-more';
          more.setAttribute('role', 'button');
          more.setAttribute('tabindex', '0');
          more.setAttribute('aria-label', '更多操作');
          more.textContent = '⋯';
          more.addEventListener('click', function (e) { e.stopPropagation(); showMenu(more, c); });
          more.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); showMenu(more, c); } });
          b.appendChild(more);
          b.addEventListener('click', function (e) { e.stopPropagation(); go(c.id); });
          box.appendChild(b);
        });
      }
      render();
    })();
  
  </script>
  
</body>
</html>
