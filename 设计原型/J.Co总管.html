<html lang="zh-CN">

  <link rel="stylesheet" href="./assets/jco-ui.css">
  <script src="./assets/jco-shell.js"></script>

  <style>
/* ============ 主区（聊天 + 待办面板） ============ */
  .main { flex: 1; display: flex; min-width: 0; }

.chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.chat-head {
    flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 22px 36px 0;
  }

.agent-logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--text-1); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; flex: none;
  }

.agent-name { font-size: 16px; font-weight: 600; }

.agent-chip {
    height: 32px; padding: 0 16px; border-radius: 999px;
    background: var(--card); color: var(--text-1);
    font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center;
    box-shadow: var(--shadow-card);
  }

.agent-hint { font-size: 14px; color: var(--text-2); }

.chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

.stream {
    max-width: none; width: 100%; margin: 0 auto; padding: 22px 32px 10px;
    display: flex; flex-direction: column; gap: 26px;
  }

.daymark { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12px; }

.daymark::before, .daymark::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.postlist { display: flex; flex-direction: column; gap: 8px; margin-top: 11px; }

.postlist .pt-row { display: flex; align-items: center; gap: 9px; font-size: 14px; }

.postlist .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }

.msg { display: flex; }

.msg.user { justify-content: flex-end; }

.msg.user .bubble {
    background: var(--tint); color: var(--text-1);
    border-radius: 20px; padding: 12px 16px;
    font-size: 16px; line-height: 1.6; max-width: 70%;
  }

.msg.ai { gap: 13px; }

.msg.ai .ava {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--text-1); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; margin-top: 2px;
  }

.msg.ai .body { min-width: 0; max-width: min(100%, 760px); flex: 1; }

.msg.ai .name { font-size: 13px; color: var(--text-3); margin-bottom: 7px; }

.msg.ai + .msg.ai .name { display: none; }

.msg.ai .bubble {
    background: transparent; color: var(--text-1);
    border-radius: 0; padding: 0;
    font-size: 15.5px; line-height: 1.75;
    box-shadow: none;
  }

.msg.ai .bubble p { margin: 0 0 10px; }

.msg.ai .bubble p:last-child { margin-bottom: 0; }

.msg.ai .bubble ul, .msg.ai .bubble ol { margin: 8px 0 12px; padding-left: 22px; }

.msg.ai .bubble li { margin: 3px 0; }

.msg.ai .bubble h3, .msg.ai .bubble h4, .msg.ai .bubble h5 { margin: 14px 0 8px; line-height: 1.35; }

.msg.ai .bubble pre {
    margin: 10px 0 12px; padding: 12px 14px; overflow-x: auto;
    border-radius: 12px; background: var(--tint); color: var(--text-1);
    font-size: 13px; line-height: 1.6;
  }

.msg.ai .bubble code {
    padding: 1px 5px; border-radius: 5px;
    background: var(--tint); font-size: 0.9em;
  }

.msg.ai .bubble pre code { padding: 0; background: transparent; font-size: inherit; }

.msg.ai .bubble a { color: var(--accent); text-decoration: none; }

.msg.ai .bubble a:hover { text-decoration: underline; }

.msg.ai .bubble b { font-weight: 600; }

.msg-actions { display: flex; gap: 4px; margin-top: 8px; }

.msg-actions button {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border: none; border-radius: 8px;
    background: transparent; color: var(--text-3); font-size: 16px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

.msg-actions button:hover { background: var(--hover); color: var(--text-1); }

.msg-actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }

.act {
    font-family: inherit; font-size: 14px; font-weight: 500;
    height: 36px; padding: 0 16px; cursor: pointer;
    border: 0.5px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--text-1);
    transition: background 0.15s ease, transform 0.1s ease;
  }

.act:hover { background: var(--hover); }

.act:active { transform: scale(0.97); }

.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.act.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }

.act.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

.prog { margin-top: 11px; }

.prog .track { height: 4px; border-radius: 999px; background: rgba(120, 120, 128, 0.2); overflow: hidden; }

.prog .fill { height: 100%; width: 100%; border-radius: 999px; background: var(--accent); transform-origin: left; transform: scaleX(0.06); transition: transform 0.4s linear; }

.prog .label { margin-top: 8px; font-size: 13px; color: var(--text-3); }

.typing { display: inline-flex; gap: 5px; padding: 6px 2px; }

.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: blink 1.15s infinite; }

.typing i:nth-child(2) { animation-delay: 0.18s; }

.typing i:nth-child(3) { animation-delay: 0.36s; }

@keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

.cur { display: inline-block; width: 7px; height: 15px; margin-left: 3px; vertical-align: -2px; border-radius: 4px; background: var(--accent); animation: blink 1s infinite; }

.err { color: var(--red); }

.anim { opacity: 0; transform: translateY(10px); }

.anim.in { opacity: 1; transform: none; transition: opacity 0.4s var(--ease), transform 0.4s var(--ease); }

/* 底部输入台 */
  .composer { flex: none; padding: 8px 32px 14px; }

.box {
    max-width: none; margin: 0 auto;
    background: var(--card); border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 15px 18px 11px;
    transition: box-shadow 0.2s ease;
  }

.box:focus-within { box-shadow: 0 0 0 3px rgba(0, 128, 255, 0.12), var(--shadow); }

.box textarea {
    width: 100%; border: none; background: transparent; resize: none;
    font-family: inherit; font-size: 16px; line-height: 1.5; color: var(--text-1);
    outline: none; max-height: 120px;
  }

.box textarea:focus-visible { outline: none; }

.box textarea::placeholder { color: var(--text-3); }

.box-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }

.box-bar .right { display: flex; align-items: center; gap: 10px; }

.disclaimer { margin-top: 8px; text-align: center; font-size: 12px; color: var(--text-3); }

/* ============ 右侧待办面板（右上角） ============ */
  .board {
    position: fixed; top: 14px; right: 14px; bottom: auto; max-height: 66dvh; width: 320px; z-index: 55;
    background: var(--card); border-radius: 22px;
    box-shadow: var(--shadow-modal);
    transform: translateX(calc(100% + 30px));
    transition: transform 0.26s var(--ease);
    overflow-y: auto;
  }

.board.open { transform: none; }

.board-inner { display: flex; flex-direction: column; gap: 14px; padding: 20px 22px 16px; }

.board-head { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; color: var(--text-1); }

.board-close {
    border: none; background: transparent; color: var(--text-3);
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    transition: background 0.15s ease, color 0.15s ease;
  }

.board-close:hover { background: var(--hover); color: var(--text-1); }

.board-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.board-toggle { margin-left: auto; }

.err-box { border-top: 1px solid rgba(215, 0, 21, 0.3); padding-top: 9px; }

.err-title { display: flex; align-items: center; gap: 7px; color: var(--red); font-weight: 600; font-size: 13px; }

.err-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: none; }

.err-desc { margin-top: 6px; color: var(--text-2); font-size: 13px; line-height: 1.7; }

.board-card {
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card);
    padding: 15px 16px 13px;
  }

.board-card h3 {
    font-size: 13px; font-weight: 600; color: var(--text-1);
    display: flex; align-items: center; gap: 7px; margin-bottom: 11px;
  }

.board-card h3 .ti { font-size: 14px; color: var(--text-3); }

.b-todo {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 9px 8px; margin: 0 -8px; border-radius: 12px;
    text-decoration: none; color: var(--text-1);
    font-size: 13px; line-height: 1.55;
    transition: background 0.15s ease;
  }

.b-todo:hover { background: var(--hover); }

.b-todo:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.b-todo .ti { flex: none; font-size: 14px; color: var(--accent); margin-top: 2px; }

.b-todo b { font-weight: 600; }

.b-todo .go { color: var(--accent); font-size: 12px; }

.b-line { display: flex; gap: 9px; padding: 6px 0; font-size: 12px; line-height: 1.55; color: var(--text-2); }

.b-line .ti { flex: none; font-size: 14px; margin-top: 2px; }

.b-line.done .ti { color: var(--green); }

.b-line.doing .ti { color: var(--accent); }

.b-line.plan .ti { color: var(--text-3); }

.b-line .when { font-weight: 600; color: var(--text-1); }

@media (max-width: 860px) {
    .sidebar { display: none; }
    .chat-head, .composer { padding-left: 20px; padding-right: 20px; }
    .stream { padding-left: 20px; padding-right: 20px; }
  }

/* DSH 规范：正圆与胶囊保持圆弧（其余圆角走超椭圆） */
  .me .ava, .mm-head .ava, .msg.ai .ava, .postlist .dot, .typing i, .send, .cp-send,
  .agent-chip, .badge, .act, .ghost-btn, .ghost, .go-btn, .cp-act,
  .seg button, .pf .pfck, .prog .track, .prog .fill, .prow .pbar, .prow .pf2,
  .toast { corner-shape: round; }

@media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.24); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); border-radius: 999px; }
  }

/* ===== 收编标准件：ghost-btn（总管同款次按钮） ===== */
.ghost-btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 14px; border: none; border-radius: 999px;

    font-family: inherit; font-size: 13px; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

.ghost-btn:hover { background: var(--btn-2nd-hover); }

.ghost-btn:active { transform: scale(0.97); }

.ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ghost-btn .ti { font-size: 14px; color: var(--text-2); }

  <script>
    const stream = document.getElementById('stream');
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');
    const send = document.getElementById('send');
    let busy = false;

    /* ---------- 真内核模式（桌面应用里自动启用；浏览器直开保持演示模式） ---------- */
    const JCO_KERNEL = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel) ? window.jco.kernel : null;
    let liveBubble = null;   // 正在流式写入的气泡
    let liveText = '';       // 本轮已收增量
    let liveStreamed = false;

    if (JCO_KERNEL) {
      JCO_KERNEL.onDelta((d) => {
        if (!liveBubble) return;
        if (!liveStreamed) { liveBubble.innerHTML = ''; liveStreamed = true; }
        liveText += d;
        liveBubble.innerHTML = mdToHtml(liveText) + '<span class="cur"></span>';
        bottom();
      });
    }

    function mdToHtml(text) {
      return window.JcoMessage ? window.JcoMessage.mdToHtml(text) : String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    /* ---------- J.Co 本地状态层：活动日志 / 对话历史 / 面板真数据 ---------- */
    const KIND_ICON = { task: 'ti-clock-hour-3', chat: 'ti-messages', create: 'ti-file-text', shot: 'ti-video', topic: 'ti-bulb', material: 'ti-photo', publish: 'ti-upload' };
    function jcoLogAdd(kind, title, detail) {
      try {
        var data = JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}');
        data.items.unshift({ t: Date.now(), kind: kind, title: String(title || '').slice(0, 80), detail: String(detail || '').slice(0, 160) });
        if (data.items.length > 200) data.items.length = 200;
        localStorage.setItem('jco-log-v1', JSON.stringify(data));
      } catch (e) {}
    }
    function jcoLogRead() {
      try { return (JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}').items) || []; } catch (e) { return []; }
    }
    /* ---------- 多会话：每个会话独立记录 + 独立内核上下文；可新建、可切换 ---------- */
    const CHATS_KEY = 'jco-chats-v1';
    function chatsLoad() {
      try {
        var d = JSON.parse(localStorage.getItem(CHATS_KEY) || 'null');
        if (d && Array.isArray(d.chats) && d.chats.length > 0) return d;
      } catch (e) {}
      // 从旧版单会话迁移
      var migrated = [];
      try {
        var legacy = JSON.parse(localStorage.getItem('jco-chat-v1') || 'null');
        if (legacy && Array.isArray(legacy.items) && legacy.items.length > 0) {
          migrated = legacy.items.map(function (m) { return { role: m.role, text: String(m.text || ''), t: m.t || Date.now() }; });
        }
      } catch (e) {}
      var first = { id: 'c' + Date.now().toString(36), title: migrated.length ? '之前的对话' : '新会话', updatedAt: Date.now(), messages: migrated };
      return { activeId: first.id, chats: [first] };
    }
    var chatData = chatsLoad();
    /* 清理多余的空会话：列表里最多留一个"空"的（防止"新会话"越堆越多） */
    (function cleanupEmptyChats() {
      var before = chatData.chats.length;
      chatData.chats = chatData.chats.filter(function (c) {
        return c.messages.length > 0 || c.id === chatData.activeId;
      });
      if (chatData.chats.length === 0) {
        var c0 = { id: 'c' + Date.now().toString(36), title: '新会话', updatedAt: Date.now(), messages: [] };
        chatData.chats.push(c0);
        chatData.activeId = c0.id;
      }
      if (!chatData.chats.some(function (c) { return c.id === chatData.activeId })) chatData.activeId = chatData.chats[0].id;
      if (chatData.chats.length !== before) { try { localStorage.setItem(CHATS_KEY, JSON.stringify(chatData)); } catch (e) {} }
    })();
    function chatsSave() {
      try { localStorage.setItem(CHATS_KEY, JSON.stringify(chatData)); } catch (e) {}
    }
    function notifyShellChat() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ __jcoConversation: chatData.activeId }, '*');
        }
      } catch (e) {}
    }
    function activeChat() {
      var c = chatData.chats.find(function (x) { return x.id === chatData.activeId; });
      if (!c) {
        c = { id: 'c' + Date.now().toString(36), title: '新会话', updatedAt: Date.now(), messages: [] };

        chatData.activeId = c.id;
        chatsSave();
      }
      return c;
    }
    function chatPush(role, text) {
      var c = activeChat();
      c.messages.push({ role: role, text: String(text || ''), t: Date.now() });
      c.updatedAt = Date.now();

    function renderActiveChat() {

      } else {
        // 历史消息：不带入场动画、批量插入、最多渲染最近 80 条（防长会话卡顿）
        var list = c.messages;
        var actionsHTML = '<div class="msg-actions"><button aria-label="复制"><span class="ti ti-copy"></span></button><button aria-label="赞"><span class="ti ti-thumb-up"></span></button><button aria-label="踩"><span class="ti ti-thumb-down"></span></button><button aria-label="转发"><span class="ti ti-share-3"></span></button><button aria-label="派活"><span class="ti ti-user-plus"></span></button></div>';

            el = node('<div class="msg ai"><div class="ava">J</div><div class="body"><div class="name">J.Co</div><div class="bubble">' + mdToHtml(m.text) + '</div>' + actionsHTML + '</div></div>');
          }
          frag.appendChild(el);
        });
        stream.appendChild(frag);
      }
      refreshBoard();

      // 切到会话视图即离开任务视图（批 5 修复：真实会话按钮 stopPropagation，容器委托收不到）
      if (typeof window.__jcoTaskViewClear === 'function') window.__jcoTaskViewClear();

    function switchChat(id) {
      if (!chatData.chats.some(function (x) { return x.id === id; })) return;
      chatData.activeId = id;
      chatsSave();
      notifyShellChat();
      renderActiveChat();
    }
    function newChat() {
      var empty = chatData.chats.find(function (c) { return c.messages.length === 0 });
      if (empty) {
        if (empty.id !== chatData.activeId) switchChat(empty.id);
        else notifyShellChat();
        return;
      }
      var c = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: '新会话', updatedAt: Date.now(), messages: [] };
      chatData.chats.unshift(c);
      chatData.activeId = c.id;

    /* 会话操作：分享 / 重命名 / 删除（总管版：用 switchChat / chatsSave / showToast） */
    var jcoConvMenuEl = null;
    function jcoCloseConvMenu() { if (jcoConvMenuEl) { jcoConvMenuEl.remove(); jcoConvMenuEl = null; } }
    document.addEventListener('click', jcoCloseConvMenu);
    function jcoShareChat(chat) {
      var lines = ['【和 J.Co 的对话 · ' + (chat.title || '新会话') + '】'];
      (chat.messages || []).forEach(function (m) {
        lines.push((m.role === 'user' ? '我：' : 'J.Co：') + String(m.text || ''));
      });
      var text = lines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { showToast('对话已复制，去粘贴分享吧'); },
          function () { showToast('没复制成，手动选中复制一下'); }
        );
      } else { showToast('这台环境不支持直接复制'); }
    }
    function jcoShowConvMenu(anchor, chat) {
      jcoCloseConvMenu();
      var menu = document.createElement('div');
      menu.className = 'convo-menu';
      menu.addEventListener('click', function (e) { e.stopPropagation(); });
      function item(icon, label, cls, fn) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = cls || '';
        b.innerHTML = '<span class="ti ' + icon + '"></span>' + label;
        b.addEventListener('click', fn);
        menu.appendChild(b);
        return b;
      }
      item('ti-share-3', '分享对话', '', function () { jcoCloseConvMenu(); jcoShareChat(chat); });
      item('ti-file-text', '重命名', '', function () {
        jcoCloseConvMenu();
        var row = anchor.closest('.convo');
        var nameEl = row ? row.querySelector('.name') : null;
        if (!nameEl) return;
        var input = document.createElement('input');
        input.className = 'convo-rename';
        input.value = chat.title || '新会话';
        nameEl.replaceWith(input);
        input.focus(); input.select();
        var done = false;
        function commit(saveIt) {
          if (done) return; done = true;
          var v = input.value.trim().slice(0, 20);
          if (saveIt && v) chat.title = v;
          nameEl.textContent = chat.title || '新会话';
          input.replaceWith(nameEl);
          if (saveIt && v) { chatsSave(); showToast('改好名字了'); }
        }
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); commit(true); }
          if (e.key === 'Escape') { commit(false); }
        });
        input.addEventListener('blur', function () { commit(true); });
        input.addEventListener('click', function (e) { e.stopPropagation(); });
      });
      var del = item('ti-trash', '删除对话', 'danger', function () {
        if (del.getAttribute('data-armed') !== '1') {
          del.setAttribute('data-armed', '1');
          del.innerHTML = '<span class="ti ti-trash"></span>再点一次，真删除';
          return;
        }
        jcoCloseConvMenu();
        var wasActive = chatData.activeId === chat.id;
        chatData.chats = chatData.chats.filter(function (x) { return x.id !== chat.id; });
        if (chatData.chats.length === 0) {
          chatData.chats.push({ id: 'c' + Date.now().toString(36), title: '新会话', updatedAt: Date.now(), messages: [] });
        }
        if (wasActive) chatData.activeId = chatData.chats[0].id;
        chatsSave();
        showToast('已删除「' + (chat.title || '新会话') + '」');
        if (wasActive) { switchChat(chatData.activeId); } else { renderConvoList(); }
      });
      document.body.appendChild(menu);
      var r = anchor.getBoundingClientRect();
      var mw = menu.offsetWidth || 160, mh = menu.offsetHeight || 130;
      var left = Math.min(r.right + 8, window.innerWidth - mw - 10);
      var top = Math.min(r.bottom + 4, window.innerHeight - mh - 10);
      if (top < 8) top = 8;
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      jcoConvMenuEl = menu;
    }
    function renderConvoList() {
      if (!JCO_KERNEL) return; // 浏览器直开：保留演示列表
      // 注意：侧栏有两个 .convos（#taskList 任务分区在前）；会话列表必须取"非任务"的那个（批 5 修复）
      var box = document.querySelector('.convos:not(#taskList)');
      if (!box) return;
      box.innerHTML = '';
      var add = document.createElement('button');
      add.className = 'convo new-btn';
      add.setAttribute('title', '新会话');
      add.innerHTML = '<span class="ti ti-plus"></span>新会话';
      add.addEventListener('click', function (e) { e.stopPropagation(); newChat(); });
      // 「新会话」按钮位：顶部搜索框下方；找不到容器时回退旧位置（列表内）
      var slot = document.getElementById('newChatSlot');
      if (slot) {
        slot.innerHTML = '';
        slot.appendChild(add);
      } else {
        box.appendChild(add);
      }
      chatData.chats.slice(0, 12).forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'convo' + (c.id === chatData.activeId ? ' active' : '');
        var nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = c.title || '新会话';
        b.appendChild(nm);
        var more = document.createElement('span');
        more.className = 'convo-more';
        more.setAttribute('role', 'button');
        more.setAttribute('tabindex', '0');
        more.setAttribute('aria-label', '更多操作');
        more.textContent = '⋯';
        more.addEventListener('click', function (e) { e.stopPropagation(); jcoShowConvMenu(more, c); });
        more.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); jcoShowConvMenu(more, c); } });
        b.appendChild(more);
        b.addEventListener('click', function (e) { e.stopPropagation(); switchChat(c.id); });
        box.appendChild(b);
      });
    }
    /* 其它页面点对话带过来的请求：'new' 或会话 id */
    (function consumeOpenChat() {
      var req = null;
      try { req = sessionStorage.getItem('jco-open-chat'); if (req) sessionStorage.removeItem('jco-open-chat'); } catch (e) {}
      if (!req) return;
      setTimeout(function () {
        if (req === 'new') { newChat(); return; }
        switchChat(req);
      }, 60);
    })();

    /* ---------- 任务分区（M7 任务会话桥·批 1a）：派活任务列表 + 只读回看 ---------- */
    (function jcoTaskList() {
      var live = (typeof window.jco !== 'undefined' && window.jco && window.jco.tasks && window.jco.tasks.sessions);
      if (!live) return; // 浏览器直开：不显示
      var listEl = document.getElementById('taskList');
      if (!listEl) return;
      var tasks = [];
      var viewingId = null;
      function stateGlyph(s) { return s === 'running' ? '…' : (s === 'done' ? '✓' : '✗'); }
      function renderTasks() {
        listEl.innerHTML = '';
        if (tasks.length === 0) {
          var empty = document.createElement('div');
          empty.style.cssText = 'padding:6px 10px;font-size:12.5px;color:var(--text-3);';
          empty.textContent = '还没有派出去的任务';
          listEl.appendChild(empty);
          return;
        }
        tasks.slice(0, 10).forEach(function (t) {
          var b = document.createElement('button');
          b.className = 'convo' + (t.id === viewingId ? ' active' : '');
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = t.name + ' ' + stateGlyph(t.state);
          b.appendChild(nm);
          b.addEventListener('click', function (e) {
            e.stopPropagation();
            if (window.parent && window.parent !== window && typeof window.parent.__jcoOpenTaskById === 'function') {
              window.parent.__jcoOpenTaskById(t.id);
              return;
            }
            openTaskView(t.id);
          });
          listEl.appendChild(b);
        });
      }
      function refreshTasks(cb) {
        window.jco.tasks.sessions().then(function (r) {
          tasks = (r && r.tasks) || [];
          renderTasks();
          if (typeof cb === 'function') cb();
        }).catch(function () {});
      }
      function openTaskView(id) {
        window.jco.tasks.session(id).then(function (r) {
          if (!r || !r.ok || !r.task) { showToast('读不到这个任务'); return; }
          var t = r.task;
          viewingId = id;
          renderTasks();
          stream.innerHTML = '';
          var mark = node('<div class="daymark"></div>');
          mark.textContent = '任务视图 · ' + t.name + '（' + (t.state === 'running' ? '在跑' : (t.state === 'done' ? '跑完了' : '没跑成')) + '；点左侧任一对话可返回）';
          stream.appendChild(mark);
          if (t.state === 'running') {
            var liveBox = document.createElement('div');
            liveBox.style.cssText = 'padding:2px 18px 10px;font-size:12.5px;color:var(--text-3);line-height:1.9;';
            var liveLines = (t.live && t.live.length) ? t.live.slice(-12) : [];
            if (liveLines.length === 0) {
              var waitRow = document.createElement('div');
              waitRow.textContent = 'AI 正在干活…（跑完就能在这里看到它干了什么）';
              liveBox.appendChild(waitRow);
            } else {
              liveLines.forEach(function (l) {
                var row = document.createElement('div');
                row.textContent = '· ' + String((l && l.text) || '');
                liveBox.appendChild(row);
              });
            }
            stream.appendChild(liveBox);
          }
          var actionsHTML = '<div class="msg-actions"><button aria-label="复制"><span class="ti ti-copy"></span></button><button aria-label="赞"><span class="ti ti-thumb-up"></span></button><button aria-label="踩"><span class="ti ti-thumb-down"></span></button><button aria-label="转发"><span class="ti ti-share-3"></span></button></div>';
          (t.messages || []).forEach(function (m) {
            var el;
            if (m.role === 'user') {
              el = node('<div class="msg user"><div class="bubble"></div></div>');
              el.querySelector('.bubble').textContent = m.text;
            } else {
              el = node('<div class="msg ai"><div class="ava">J</div><div class="body"><div class="name">J.Co</div><div class="bubble">' + mdToHtml(String(m.text || '')) + '</div>' + actionsHTML + '</div></div>');
            }
            stream.appendChild(el);
          });
          bottom();
        }).catch(function () {});
      }
      // 实时：Activity 事件带 taskId（派活任务广播）→ 刷新列表；正在看该任务 → 重渲染视图
      JCO_KERNEL.onActivity(function (act) {
        if (!act || !act.taskId) return;
        refreshTasks(function () {
          if (viewingId === act.taskId) openTaskView(act.taskId);
        });
      });
      // 任务结束事件（kernel:task）：状态变化即时刷新（不等下一条活动事件）
      if (JCO_KERNEL.onTask) {
        JCO_KERNEL.onTask(function (ev) {
          if (!ev || !ev.taskId) return;
          refreshTasks(function () {
            if (viewingId === ev.taskId) openTaskView(ev.taskId);
          });
        });
      }
      // 点左侧「对话」区的任一会话 = 回到会话视图（清任务视图标记）
      var convoBox = document.querySelector('.convos:not(#taskList)');
      if (convoBox) convoBox.addEventListener('click', function () { viewingId = null; renderTasks(); });
      // 供会话切换路径（按钮内 stopPropagation，冒泡委托收不到）直接清任务视图标记
      window.__jcoTaskViewClear = function () { viewingId = null; renderTasks(); };
      // 派活跳转（批 1b）：别的页放 jco-open-task → 落地后自动打开该任务视图
      function consumeOpenTask() {
        var want = '';
        try { want = sessionStorage.getItem('jco-open-task') || ''; if (want) sessionStorage.removeItem('jco-open-task'); } catch (e) {}
        if (!want) return;
        var tries = 0;
        (function attempt() {
          tries++;
          window.jco.tasks.session(want).then(function (r) {
            if (r && r.ok && r.task) openTaskView(want);
            else if (tries < 12) setTimeout(attempt, 500);
          }).catch(function () { if (tries < 12) setTimeout(attempt, 500); });
        })();
      }
      refreshTasks();
      consumeOpenTask();
      // 供系统通知点击直达（主进程 executeJavaScript 调用；对抗审查 R7）
      window.__jcoOpenTaskById = function (id) { if (id) openTaskView(String(id)); };
    })();

    /** 真模式：右侧「等你拍板」+「今天的安排」用本地真实状态渲染 */
    function refreshBoard() {
      if (!JCO_KERNEL) return;
      var cards = document.querySelectorAll('.board .board-card');
      if (cards.length < 2) return;
      var todoCard = cards[0];
      var lineCard = cards[1];
      // 等你拍板
      todoCard.querySelectorAll('.b-todo').forEach(function (el) { el.remove(); });
      var rows = [];
      var reviewDrafts = 0;
      try {
        var ds = JSON.parse(localStorage.getItem('jco-drafts-v1') || '{"items":[]}');
        reviewDrafts = (ds.items || []).filter(function (d) { return d.status === 'review'; }).length;
      } catch (e) {}
      if (reviewDrafts > 0) rows.push({ href: 'J.Co工作台-做视频.html', icon: 'ti-player-play', b: reviewDrafts + ' 条分镜', rest: '等你过目', to: '去「创作」→' });
      var pubCount = 0;
      try {
        var ps = JSON.parse(localStorage.getItem('jco-publish-v1') || '{"items":[]}');
        pubCount = (ps.items || []).length;
      } catch (e) {}
      if (pubCount > 0) rows.push({ href: 'J.Co工作台-发布.html', icon: 'ti-upload', b: pubCount + ' 条发布记录', rest: '在这存着', to: '去「发布」→' });
      if (rows.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'b-todo';
        empty.innerHTML = '<span class="ti ti-flag"></span><span>目前没有等你拍板的事，安心做内容。</span>';
        todoCard.appendChild(empty);
      } else {
        rows.forEach(function (r) {
          var a = document.createElement('a');
          a.className = 'b-todo';
          a.href = r.href;
          a.innerHTML = '<span class="ti ' + r.icon + '"></span><span><b>' + r.b + '</b>' + r.rest + ' <span class="go">' + r.to + '</span></span>';
          todoCard.appendChild(a);
        });
      }
      // 今天的安排 → 真活动日志
      lineCard.querySelectorAll('.b-line').forEach(function (el) { el.remove(); });
      var log = jcoLogRead().slice(0, 6);
      if (log.length === 0) {
        var el0 = document.createElement('div');
        el0.className = 'b-line plan';
        el0.innerHTML = '<span class="ti ti-clock"></span><span><span class="when">现在</span> 还没有干活记录，说句话就开张</span>';
        lineCard.appendChild(el0);
      } else {
        log.forEach(function (x, i) {
          var el = document.createElement('div');
          el.className = 'b-line ' + (i === 0 ? 'doing' : 'done');
          var d = new Date(x.t);
          var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
          el.innerHTML = '<span class="ti ' + (i === 0 ? 'ti-refresh' : (KIND_ICON[x.kind] || 'ti-check')) + '"></span><span><span class="when"></span> </span>';
          el.querySelector('.when').textContent = hh;
          el.lastElementChild.appendChild(document.createTextNode(x.title + (x.detail ? '（' + x.detail + '）' : '')));
          lineCard.appendChild(el);
        });
      }
    }

    function addAILive() {

    async function askKernel(text) {
      chatPush('user', text);
      renderConvoList();
      const el = addAILive();
      const bubble = el.querySelector('.bubble');
      liveBubble = bubble;
      liveText = '';
      liveStreamed = false;
      let res = null;
      try {
        res = await Promise.race([
          JCO_KERNEL.ask(text, activeChat().id),
        new Promise((resolveTimeout) => setTimeout(() => resolveTimeout({ ok: false, error: '等太久了（超过 4 分钟）。内核可能卡住了，再发一次试试。' }), 240000)),
        ]);
      } catch (e) {
        res = { ok: false, error: String((e && e.message) || e) };
      }
      liveBubble = null;
      if (res && res.ok) {
        bubble.innerHTML = mdToHtml(res.text || liveText || '（这轮没有内容）');
      } else {
        bubble.innerHTML = '<div class="err-box"><div class="err-title"><span class="dot"></span>本轮没答上来</div><div class="err-desc">' + mdToHtml((res && res.error) || '未知错误') + '</div></div>';
      }
      busy = false;
      inputChanged();
      bottom();
      chatPush('ai', (res && res.ok) ? (res.text || liveText || '（这轮没有内容）') : ('没答上来：' + ((res && res.error) || '未知错误')));
      maybeProposeTask(text, res);
      renderConvoList();
      jcoLogAdd('chat', String(text).slice(0, 40), (res && res.ok) ? '聊了一轮' : '这轮没答上来');
      refreshBoard();
    }

    const bottom = () => { chat.scrollTop = chat.scrollHeight; };

    function addAI(html, typingFirst = true) {

        const actionsHTML = `<div class="msg-actions">

    /* W1-03 任务卡：先展示草稿，用户确认后才调用 tasks:propose + tasks:confirm */
    function taskDraftFromText(text) {
      var value = String(text || '').trim();
      var titleText = value.replace(/^(帮我|请帮我|请|麻烦|把)+/, '').replace(/[。！!]+$/, '').trim() || value;
      var type = 'content';
      var ownerRole = 'writer';
      if (/(发到|发布|上传)/.test(value)) { type = 'publish'; ownerRole = 'publisher'; }
      else if (/(剪辑|后期|字幕|配乐|裁剪|拼接)/.test(value)) { type = 'edit'; ownerRole = 'editor'; }
      else if (/(评论|战报|数据|运营)/.test(value)) { type = 'operate'; ownerRole = 'operator'; }
      return {
        title: Array.from(titleText).slice(0, 28).join('') || '新的任务',
        goal: value,
        type: type,
        ownerRole: ownerRole,
        inputs: [{ kind: 'conversation', ref: activeChat().id, label: '来源会话' }],
        constraints: ['不自动发布、删除或支付；不可逆动作等你确认'],
        deliverables: [type === 'publish' ? '发布草稿（停在发布按钮前）' : type === 'edit' ? '处理后的新文件' : type === 'operate' ? '运营草稿或数据记录' : '完成的内容草稿'],
        approvalPolicy: { requirePublishApproval: true, requireDeleteApproval: true, requirePaymentApproval: true, requireFinalApproval: true },
        sourceConversationId: activeChat().id,
      };
    }

    function showTaskCard(draft) {
      var old = stream.querySelector('.task-card');
      if (old) old.remove();
      var card = document.createElement('section');
      card.className = 'task-card';
      card.setAttribute('aria-label', '任务卡草稿');
      card.innerHTML = '<h3>任务卡草稿</h3><p class="task-card-note">确认前不会创建 Task，也不会启动浏览器。</p>' +
        '<div class="task-field"><label for="taskCardTitle">标题</label><input id="taskCardTitle"></div>' +
        '<div class="task-field"><label for="taskCardGoal">目标</label><textarea id="taskCardGoal"></textarea></div>' +
        '<div class="task-field"><label for="taskCardDeliverable">交付物</label><input id="taskCardDeliverable"></div>' +
        '<div class="task-card-error" role="status"></div>' +
        '<div class="task-card-actions"><button class="go-btn" type="button" data-task-confirm>确认派活</button><button class="ghost" type="button" data-task-modify>修改</button><button class="ghost" type="button" data-task-cancel>取消</button></div>';
      card.querySelector('#taskCardTitle').value = draft.title || '';
      card.querySelector('#taskCardGoal').value = draft.goal || '';
      card.querySelector('#taskCardDeliverable').value = (draft.deliverables || [])[0] || '';
      var error = card.querySelector('.task-card-error');
      card.querySelector('[data-task-modify]').addEventListener('click', function () {
        card.querySelector('#taskCardTitle').focus();
        card.querySelector('#taskCardTitle').select();
      });
      card.querySelector('[data-task-cancel]').addEventListener('click', function () {
        card.remove();
        showToast('任务卡已取消，没有创建任务。');
      });
      card.querySelector('[data-task-confirm]').addEventListener('click', async function () {
        var next = Object.assign({}, draft, {
          title: card.querySelector('#taskCardTitle').value.trim(),
          goal: card.querySelector('#taskCardGoal').value.trim(),
          deliverables: [card.querySelector('#taskCardDeliverable').value.trim()].filter(Boolean),
        });
        if (!next.title || !next.goal || next.deliverables.length === 0) {
          error.textContent = '标题、目标和交付物都要填。';
          return;
        }
        if (!window.jco || !window.jco.tasks || !window.jco.tasks.propose) {
          error.textContent = '这个功能在桌面应用里可用。';
          return;
        }
        var button = card.querySelector('[data-task-confirm]');
        button.disabled = true;
        try {
          var proposed = await window.jco.tasks.propose(next);
          if (!proposed || !proposed.ok || !proposed.task) throw new Error((proposed && proposed.error) || '任务卡提交失败');
          var confirmed = await window.jco.tasks.confirm(proposed.task.id);
          if (!confirmed || !confirmed.ok) throw new Error((confirmed && confirmed.error) || '任务确认失败');
          card.remove();
          showToast('任务已创建，正在打开任务详情。');
          if (window.parent && window.parent !== window && typeof window.parent.__jcoOpenTaskById === 'function') {
            window.parent.__jcoOpenTaskById(proposed.task.id);
          }
        } catch (err) {
          button.disabled = false;
          error.textContent = String((err && err.message) || err);
        }
      });
      stream.appendChild(card);
      bottom();
    }

      }
      function saveFolded(list) {
        try { localStorage.setItem(KEY, list.join(',')); } catch (e) {}

        label.classList.toggle('folded', hide);
        var el = label.nextElementSibling;
        while (el && !el.classList.contains('group-label')) {
          if (el.classList.contains('nav-item') || el.classList.contains('convos')) {

        var name = label.textContent.trim();
        if (folded.indexOf(name) !== -1) applyFold(label, true);
        label.addEventListener('click', function () {

          applyFold(label, hide);
          var list = loadFolded();
          if (hide) { if (list.indexOf(name) === -1) list.push(name); }

      try { items = (JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}').items) || []; } catch (e) {}
      var pop = document.createElement('div');
      pop.className = 'notif-pop';
      var r = anchor.getBoundingClientRect();
      pop.style.position = 'fixed';
      pop.style.left = Math.min(r.right + 10, window.innerWidth - 296) + 'px';
      pop.style.bottom = Math.max(12, window.innerHeight - r.bottom) + 'px';
      var head = document.createElement('div');
      head.className = 'np-head';
      head.textContent = '最近动态';
      pop.appendChild(head);
      if (items.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'np-empty';
        empty.textContent = '还没有记录。干一句活，这里就开始记。';
        pop.appendChild(empty);
      } else {
        items.slice(0, 8).forEach(function (x) {
          var row = document.createElement('div');
          row.className = 'np-row';
          var d = new Date(x.t);
          var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
          var time = document.createElement('span');
          time.className = 'np-time';
          time.textContent = hh;
          var txt = document.createElement('span');
          txt.className = 'np-txt';
          txt.textContent = x.title + (x.detail ? '（' + x.detail + '）' : '');
          row.appendChild(time);
          row.appendChild(txt);
          pop.appendChild(row);
        });
      }
      var foot = document.createElement('a');
      foot.className = 'np-foot';
      foot.href = 'J.Co总管.html';
      foot.textContent = '去总管看全部 →';
      pop.appendChild(foot);
      document.body.appendChild(pop);
      var closer = function (ev) {
        if (!pop.contains(ev.target)) {
          pop.remove();
          document.removeEventListener('click', closer, true);
        }
      };
      setTimeout(function () { document.addEventListener('click', closer, true); }, 0);
    }
  
  </script>
  <script>
  /* 右上角"待办与安排"悬浮面板：默认收起，点开关滑入；点外面/Esc 收起；Ctrl+Shift+B 切换；记忆状态 */
  (function () {
    var board = document.getElementById('board');
    var toggle = document.getElementById('boardToggle');
    var close = document.getElementById('boardClose');
    if (!board || !toggle) return;
    var KEY = 'jco-board-open';
    function setOpen(v) {
      board.classList.toggle('open', v);
      toggle.setAttribute('aria-expanded', v ? 'true' : 'false');
      try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) {}
    }
    toggle.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!board.classList.contains('open')); });
    if (close) close.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && board.classList.contains('open')) setOpen(false);
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'B' || e.key === 'b')) { e.preventDefault(); setOpen(!board.classList.contains('open')); }
    });
    document.addEventListener('click', function (e) {
      if (!board.classList.contains('open')) return;
      if (board.contains(e.target) || toggle.contains(e.target)) return;
      setOpen(false);
    });
    try { if (localStorage.getItem(KEY) === '1') setOpen(true); } catch (e) {}
  })();
  </script>
  
</body>
