  <script>
    /* ================= 状态 ================= */
    const state = {
      type: 'video',       // video | image
      ratio: '9:16',
      duration: '30 秒',
      res: '1080P',
      voice: '标准女声',
      count: '3 张',
      method: 'assemble',  // 技能会影响它
    };

    const $ = (id) => document.getElementById(id);
    const toastEl = $('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    /* ================= 数据 ================= */
    const RATIOS = {
      video: [
        { v: '9:16', tip: '竖屏，发抖音、视频号、小红书' },
        { v: '16:9', tip: '横屏，发 B站、公众号视频' },
        { v: '1:1', tip: '方形，朋友圈、头条也适用' },
      ],
      image: [
        { v: '3:4', tip: '小红书图文首选' },
        { v: '9:16', tip: '封面 / 竖屏物料' },
        { v: '1:1', tip: '方图，朋友圈、头像' },
      ],
    };
    const VIDEO_DURATIONS = [
      { v: '5 秒', tip: '一条口播开头的时间' },
      { v: '10 秒', tip: '一个完整卖点' },
      { v: '30 秒', tip: '口播常用，讲清一件事（推荐）' },
      { v: '1 分钟', tip: '讲两三个卖点，抖音也能发' },
      { v: '3 分钟', tip: '长视频：AI 分段生成，再自动拼接' },
      { v: '5 分钟', tip: '长视频：讲深讲透，适合 B站、视频号' },
    ];
    const RES = {
      video: [
        { v: '720P', tip: '省时间；先看效果用这个' },
        { v: '1080P', tip: '清晰度够用，平台都认（推荐）' },
        { v: '2K', tip: '更清晰，生成更慢' },
      ],
      image: [
        { v: '1K', tip: '够发出去用' },
        { v: '2K', tip: '清楚细腻（推荐）' },
        { v: '4K', tip: '放大也不糊，生成更慢' },
      ],
    };
    const VOICES = ['标准女声', '沉稳男声', '我自己录'];
    const COUNTS = [
      { v: '1 张', tip: '一张封面够用' },
      { v: '3 张', tip: '配图常用（推荐）' },
      { v: '5 张', tip: '整篇图文都用它' },
    ];

    /* 技能排（M5）：数据来自技能库单一事实源：启用的手艺才出现（停用时少一个按钮，不动已做好的东西） */
    var MV_ORDER = ['s1', 's2', 's13', 's4', 's3', 's14', 's15', 's16']; // 保持做视频页既有排布顺序（原 8 按钮的次序）
    function loadMakeVideoSkills() {
      var local = null;
      try { var d = JSON.parse(localStorage.getItem('jco-skills-v1') || 'null'); if (d && Array.isArray(d.items)) local = d.items; } catch (e) {}
      var base = (typeof window.JCO_SKILLS !== 'undefined' && window.JCO_SKILLS) ? window.JCO_SKILLS : null;
      if (!base) return [];
      var list = base.makeVideoSkills(base.merge(local));
      list.sort(function (a, b) {
        var ia = MV_ORDER.indexOf(a.id); var ib = MV_ORDER.indexOf(b.id);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });
      return list.map(function (s) {
        var a = s.action || {};
        return { id: s.id, icon: a.icon || s.icon, nm: s.name, fill: a.fill || '', method: a.method, toast: a.toast, type: a.type, duration: a.duration };
      });
    }
    const SKILLS = loadMakeVideoSkills();

    const TEMPLATES = [
      { icon: 'ti-file-text', nm: '政策解读', ds: '新规出来，第一时间讲清楚', fill: '做一条政策解读视频：把最新的变化讲清楚' },
      { icon: 'ti-users-group', nm: '用户故事', ds: '真实用户的改变，最打动人', fill: '做一条用户故事视频：32 岁宝妈 6 个月完成转变的故事' },
      { icon: 'ti-bulb', nm: '避坑指南', ds: '这几种说法别信，信任感拉满', fill: '做一条避坑视频：这件事里最常见的 4 个坑' },
      { icon: 'ti-chart-bar', nm: '对比测评', ds: '两种方式怎么选，一条讲完', fill: '做一条对比视频：两种方案到底怎么选' },
    ];

    /* ================= 渲染 ================= */
    const TYPE_DEFAULT_RATIO = { video: '9:16', image: '3:4' };
    const HINTS = { video: '说说你想做什么', image: '说说你要什么图' };
    const PLACEHOLDERS = {
      video: '说说你的创作想法，也可以选素材或参考（比如：把稿子做成口播视频，用用户采访画面）',
      image: '比如：给这篇稿子配 3 张小红书风格的图',
    };

    function segRender(container, options, current, onPick) {
      container.innerHTML = '';
      options.forEach((opt) => {
        const b = document.createElement('button');
        b.textContent = opt.v;
        if (opt.v === current) b.classList.add('on');
        b.addEventListener('click', () => onPick(opt));
        container.appendChild(b);
      });
    }

    function pillInfo() {
      if (state.type === 'image') {
        return 'Seedream 5.0 | ' + state.ratio + ' · ' + state.count + ' · ' + state.res;
      }
      return 'Seedance 2.5 | ' + state.ratio + ' · ' + state.duration + ' · ' + state.res;
    }

    function render() {
      $('pillText').textContent = pillInfo();
      $('agentHint').textContent = HINTS[state.type];
      $('askInp').placeholder = PLACEHOLDERS[state.type];
      document.querySelectorAll('#agentTabs button').forEach((b) => {
        b.classList.toggle('on', b.dataset.t === state.type);
      });

      // 弹层
      const isImage = state.type === 'image';
      segRender($('segModel'), [{ v: isImage ? 'Seedream 5.0' : 'Seedance 2.5' }], isImage ? 'Seedream 5.0' : 'Seedance 2.5', () => {});
      segRender($('segRatio'), RATIOS[state.type], state.ratio, (o) => { state.ratio = o.v; render(); tip(o.tip); });
      $('durLabel').textContent = isImage ? '张数' : '时长';
      if (isImage) {
        segRender($('segDur'), COUNTS, state.count, (o) => { state.count = o.v; render(); tip(o.tip); });
      } else {
        segRender($('segDur'), VIDEO_DURATIONS, state.duration, (o) => { state.duration = o.v; render(); tip(o.tip); });
      }
      const resOpts = isImage ? RES.image : RES.video;
      segRender($('segRes'), resOpts, state.res, (o) => { state.res = o.v; render(); tip(o.tip); });
      $('voiceRow').style.display = (isImage) ? 'none' : '';
      segRender($('segVoice'), VOICES.map((v) => ({ v })), state.voice, (o) => { state.voice = o.v; render(); tip('AI 的声音。想用自己的，选「我自己录」'); });

      // 技能排
      const el = $('skills');
      el.innerHTML = '';
      SKILLS.forEach((s) => {
        const b = document.createElement('button');
        b.className = 'skill';
        b.innerHTML = `<span class="ic ti ${s.icon}"></span><span class="nm">${s.nm}</span>`;
        b.addEventListener('click', () => onSkill(s));
        el.appendChild(b);
      });
    }

    function renderTemplates() {
      const el = $('tpGrid');
      el.innerHTML = '';
      TEMPLATES.forEach((t) => {
        const b = document.createElement('button');
        b.className = 'tp';
        b.innerHTML = `<span class="ic ti ${t.icon}"></span><span class="nm"></span><span class="ds"></span>`;
        b.querySelector('.nm').textContent = t.nm;
        b.querySelector('.ds').textContent = t.ds;
        b.addEventListener('click', () => {
          askInp.value = t.fill;
          inputChanged();
          askInp.focus();
          askInp.setSelectionRange(t.fill.length, t.fill.length);
          showToast('填好了。点发送就开始，AI 会照这个做成你的版本。');
        });
        el.appendChild(b);
      });
    }

    function tip(text) {
      $('popTip').textContent = text;
    }

    function onSkill(s) {
      if (s.type && s.type !== state.type) {
        state.type = s.type;
        state.ratio = TYPE_DEFAULT_RATIO[s.type];
        if (state.type === 'image') state.res = '2K'; else state.res = '1080P';
      }
      if (s.duration) state.duration = s.duration;
      if (s.method) state.method = s.method;
      if (s.fill) {
        $('askInp').value = s.fill;
        inputChanged();
        $('askInp').focus();
        $('askInp').setSelectionRange(s.fill.length, s.fill.length);
      }
      render();
      showToast(s.toast);
    }

    /* ================= 输入 ================= */
    const askInp = $('askInp');
    const goBtn = $('goBtn');

    // 从「选题」带过来的主题：预填想法，确认一下就开做（不自动开始）
    (function consumeHandoff() {
      // 注意：这里不能引用后面的 JCO_KERNEL 常量（TDZ），直接现场判断
      var hasKernel = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel);
      if (!hasKernel) return;
      let t = null;
      try { t = sessionStorage.getItem('jco-make-topic'); if (t) sessionStorage.removeItem('jco-make-topic'); } catch (e) {}
      if (t) {
        askInp.value = '把《' + t + '》做成口播短视频，用用户采访和真实场景画面';
        inputChanged();
        askInp.focus();
        showToast('从选题带过来的，确认一下想法就能开做。');
      }
    })();

    function inputChanged() { goBtn.disabled = askInp.value.trim().length === 0; }

    askInp.addEventListener('input', () => {
      inputChanged();
      askInp.style.height = 'auto';
      askInp.style.height = Math.min(askInp.scrollHeight, 140) + 'px';
    });
    askInp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!goBtn.disabled) startGen();
      }
    });
    goBtn.addEventListener('click', startGen);

    // 模式切换
    document.querySelectorAll('#agentTabs button').forEach((b) => {
      b.addEventListener('click', () => {
        state.type = b.dataset.t;
        state.ratio = TYPE_DEFAULT_RATIO[state.type];
        if (state.type === 'image') { state.res = '2K'; state.count = '3 张'; } else { state.res = '1080P'; }
        render();
      });
    });

    // 胶囊弹层
    const pillPop = $('pillPop');
    $('pillBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      pillPop.classList.toggle('show');
      if (pillPop.classList.contains('show')) tip(RATIOS[state.type].find((r) => r.v === state.ratio).tip);
    });
    pillPop.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => pillPop.classList.remove('show'));

    /* ================= 生成流程（沿用） ================= */
    /* ---------- 真内核模式（桌面应用里启用；浏览器直开保持演示） ---------- */
    const JCO_KERNEL = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel) ? window.jco.kernel : null;
    /* ---------- J.Co 本地状态层：活动日志 + 草稿持久化 ---------- */
    function jcoLogAdd(kind, title, detail) {
      try {
        var data = JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}');
        data.items.unshift({ t: Date.now(), kind: kind, title: String(title || '').slice(0, 80), detail: String(detail || '').slice(0, 160) });
        if (data.items.length > 200) data.items.length = 200;
        localStorage.setItem('jco-log-v1', JSON.stringify(data));
      } catch (e) {}
    }
    /** 完事提醒（真：系统通知；可在设置页关掉） */
    function jcoNotifyDone(title, body) {
      try {
        if (localStorage.getItem('jco-notify-done') === '0') return;
        var sys = (typeof window.jco !== 'undefined' && window.jco && window.jco.sys) ? window.jco.sys : null;
        if (sys && sys.notify) sys.notify({ title: title, body: body });
      } catch (e) {}
    }
    function jcoDraftsSave() {
      try {
        var items = drafts.slice(0, 12).map(function (d) {
          return {
            id: d.id, idea: d.idea, status: d.status, type: d.type, ratio: d.ratio,
            duration: d.duration, res: d.res, voice: d.voice, method: d.method, fixNote: d.fixNote || '',
            shots: (d.shots || []).slice(0, 20),
            videos: d.videos || {},
            images: (d.images || []).slice(0, 6).map(function (im) {
              if (!im) return null;
              var src = String(im.src || '');
              // 旧版内嵌大图（dataUrl）：不入存储，避免撑爆（新图都走素材文件夹落盘）
              if (src.length > 300000 && !im.path) return { src: '', path: '', prompt: (im.prompt || '') + '（旧版大图未入草稿）' };
              return { src: src, path: im.path || '', prompt: im.prompt || '' };
            }).filter(Boolean),
          };
        });
        localStorage.setItem('jco-drafts-v1', JSON.stringify({ items: items }));
      } catch (e) {}
    }
    function jcoDraftsLoad() {
      try {
        var items = (JSON.parse(localStorage.getItem('jco-drafts-v1') || '{"items":[]}').items) || [];
        return items.map(function (d) {
          d.progress = 100;
          if (d.status === 'generating') d.status = 'review'; // 中断的生成不复活成假进度，落成待检查
          d.stepText = '';
          // 中断的"出片中"段：复位为可重试，不装成还在跑
          if (d.videos && typeof d.videos === 'object') {
            Object.keys(d.videos).forEach(function (k) {
              if (d.videos[k] && d.videos[k].status === 'doing') {
                d.videos[k] = { status: 'failed', error: '上次出片被中断，点「重试」。' };
              }
            });
          }
          return d;
        });
      } catch (e) { return []; }
    }
    function cleanLines(text) {
      return String(text).split('\n').map((l) => l
        .replace(/^#{1,6}\s*/, '')
        .replace(/^[-•*]\s+/, '')
        .replace(/^\d{1,2}[.、)]\s+/, '')
        .trim()).filter((l) => l !== '');
    }
    /** 解析分镜：优先 JSON 数组，失败回退按行 */
    function parseShots(text) {
      let t = String(text).trim();
      t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      const start = t.indexOf('[');
      const end = t.lastIndexOf(']');
      if (start >= 0 && end > start) t = t.slice(start, end + 1);
      try {
        const arr = JSON.parse(t);
        if (Array.isArray(arr)) {
          const shots = arr
            .map((x) => ({ line: String((x && x.line) || '').trim(), pic: String((x && x.pic) || '').trim() }))
            .filter((x) => x.line !== '');
          if (shots.length >= 3) return shots;
        }
      } catch (e) {}
      const lines = cleanLines(text);
      if (lines.length >= 3) {
        return lines
          .map((l) => {
            const parts = l.split(/[|｜]/);
            return { line: (parts[0] || '').trim(), pic: (parts[1] || '').trim() };
          })
          .filter((x) => x.line !== '');
      }
      return null;
    }

    const SHOT_LINES = [
      '别被网上那些流程吓到。',
      '把一件事讲清楚，其实就三步，两分钟讲完。',
      '第一步，定学校和专业。这个最花时间，今天就能定下来。',
      '第二步，备齐三样东西。身份证明、相关材料、两寸照片。',
      '第三步，网上填报。十分钟的事，别拖到最后一天。',
      '对了，这次的活动截止比往年早半个月。',
      '想报的抓紧，错过真的要再等一年。',
      '我是 J.Co，帮你把这件事整明白。',
    ];
    const PIC_POOL = ['用户采访片段·小李', '真实场景实拍', '城市清晨空镜', '用户采访片段·王姐', '办公室学习场景', '工作桌上资料', '成果展示背景', '讲解花絮'];
    const SHOT_DUR = ['4 秒', '5 秒', '6 秒', '6 秒', '5 秒', '5 秒', '5 秒', '4 秒'];

    let genTimer = null;
    let p = 0;
    let draftSeq = 0;
    const drafts = [];
    let currentDraft = null;
    const STATUS_META = {
      generating: { cls: 'gen', text: '生成中' },
      review: { cls: 'review', text: '待检查' },
      adjusted: { cls: 'adjusted', text: '已改过' },
      approved: { cls: 'approved', text: '已通过' },
    };

    function stepsFor() {
      const isLongVid = state.type === 'video' && (state.duration === '3 分钟' || state.duration === '5 分钟');
      if (state.type === 'image') {
        return [
          { text: '读懂稿子重点', icon: 'ti-file-text' },
          { text: '生成 ' + state.ratio + ' 图片（' + state.count + '）', icon: 'ti-photo' },
        ];
      }
      if (isLongVid) {
        return [
          { text: '配音中（' + state.voice + '）', icon: 'ti-microphone' },
          { text: '分段生成画面并拼接', icon: 'ti-movie' },
          { text: '统一字幕和背景音乐', icon: 'ti-music' },
        ];
      }
      if (state.method === 't2v') {
        return [
          { text: '拆解爆款结构', icon: 'ti-repeat' },
          { text: '按你的内容生成画面（' + state.ratio + ' · ' + state.res + '）', icon: 'ti-sparkles' },
        ];
      }
      if (state.method === 'i2v') {
        return [
          { text: '读你选的那张图', icon: 'ti-photo' },
          { text: '生成动态画面（' + state.duration + ' · ' + state.res + '）', icon: 'ti-photo-video' },
        ];
      }
      return [
        { text: '配音中（' + state.voice + '）', icon: 'ti-microphone' },
        { text: '铺画面（3 件素材）', icon: 'ti-photo' },
        { text: '加字幕和背景音乐', icon: 'ti-music' },
      ];
    }

    /* ---------- 草稿系统 ---------- */
    function draftTitle(d) {
      return d.idea.length > 24 ? d.idea.slice(0, 24) + '…' : d.idea;
    }

    function createDraft(idea) {
      const d = {
        id: ++draftSeq,
        idea,
        status: 'generating',
        progress: 0,
        stepText: stepsFor()[0].text,
        type: state.type,
        ratio: state.ratio,
        duration: state.type === 'image' ? state.count : state.duration,
        res: state.res,
        voice: state.voice,
        method: state.method,
      };
      drafts.unshift(d);
      if (drafts.length > 30) drafts.pop();
      return d;
    }

    function renderDrafts() {
      const el = $('drafts');
      el.innerHTML = '';
      if (drafts.length === 0) {
        el.innerHTML = '<div class="drafts-empty">草稿箱还空着。在下面说一句你的想法，生成第一个单位：一个单位可以是一组图，也可以是一条多段视频；点开就能看里面的每一张、每一段。</div>';
        return;
      }
      drafts.forEach((d) => {
        const st = STATUS_META[d.status];
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'dcard';
        // 封面：优先第一张图；视频单位用播放图标
        const coverImg = (d.images && d.images[0] && d.images[0].src) ? d.images[0].src : '';
        const coverHtml = coverImg
          ? '<img src="' + coverImg + '" alt="">'
          : '<span class="ti ' + (d.type === 'image' ? 'ti-photo' : 'ti-player-play') + '"></span>';
        // 单位内容量
        let amount = '';
        if (d.type === 'image') {
          amount = ((d.images || []).length || (d.status === 'generating' ? 0 : IMG_COUNT)) + ' 张图';
        } else {
          const nShots = (d.shots || []).length || 8;
          const nVid = d.videos ? Object.values(d.videos).filter((v) => v && v.status === 'done').length : 0;
          amount = nShots + ' 段' + (nVid > 0 ? ' · 已出 ' + nVid : '');
        }
        card.innerHTML = '<span class="dcover">' + coverHtml + '<span class="dcorner badge ' + st.cls + '">' + (d.status === 'generating' ? ('生成中 ' + Math.round(d.progress) + '%') : st.text) + '</span></span>' +
          '<span class="dbody"><span class="dname"></span><span class="dsub"><span class="dmeta"></span><span class="dtime"></span></span>' +
          (d.status === 'generating' ? '<span class="dprog"><span class="dfill"></span></span>' : '') +
          '</span>';
        card.querySelector('.dname').textContent = draftTitle(d);
        card.querySelector('.dmeta').textContent = d.ratio + ' · ' + amount;
        card.querySelector('.dtime').textContent = d.status === 'generating' ? '' : '点开看详情';
        if (d.status === 'generating') {
          card.disabled = true;
          const f = card.querySelector('.dfill');
          if (f) f.style.transform = 'scaleX(' + (d.progress / 100) + ')';
        } else {
          card.addEventListener('click', () => { openDraft(d.id); });
        }
        el.appendChild(card);
      });
      // 状态落定后持久化（生成中的过程不落盘，避免假进度复活）
      if (!drafts.some(function (d) { return d.status === 'generating'; })) jcoDraftsSave();
    }

    function phoneClassFor(d) {
      if (d.ratio === '16:9') return 'phone wide';
      if (d.ratio === '1:1') return 'phone square';
      return 'phone';
    }

    function openDraft(id) {
      const d = drafts.find((x) => x.id === id);
      if (!d) return;
      currentDraft = d;
      const done = $('done');
      done.classList.add('show');
      const st = STATUS_META[d.status];
      $('dStatus').className = 'badge ' + st.cls;
      $('dStatus').textContent = st.text;
      $('ibStatus').className = 'badge ' + st.cls;
      $('ibStatus').textContent = st.text;
      $('donePhone').className = phoneClassFor(d);
      const isImage = d.type === 'image';
      $('imgBoard').style.display = isImage ? 'flex' : 'none';
      document.querySelector('.done .board').style.display = isImage ? 'none' : 'flex';
      if (isImage) {
        imgIdx = 0;
        renderImgBoard();
      } else {
        $('donePhoneTxt').textContent = d.ratio + ' · ' + d.duration;
        const isLong = d.duration === '3 分钟' || d.duration === '5 分钟';
        const shotCount = Array.isArray(d.shots) && d.shots.length > 0 ? d.shots.length : 8;
        const titleText = d.idea && d.idea.length <= 28 ? d.idea : '《把一件事讲清楚，其实就 3 步》' + (isLong ? '（长视频版）' : '');
        $('doneTitle').textContent = titleText;
        const voiceTxt = d.method === 'assemble' ? (' · AI 配音（' + d.voice + '）') : '';
        $('doneMeta').textContent = d.ratio + ' · ' + d.res + ' · ' + d.duration + voiceTxt + ' · 共 ' + shotCount + ' 段 · 每一段都能看、能换';
        renderShots();
      }
      $('approveBtn').textContent = d.status === 'approved' ? '去发布' : '这版可以了';
      $('ibApprove').textContent = d.status === 'approved' ? '去发布' : '这版可以了';
      done.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function approveDraft() {
      if (!currentDraft) return;
      if (currentDraft.status === 'approved') {
        goPublish(currentDraft);
        return;
      }
      currentDraft.status = 'approved';
      const st = STATUS_META.approved;
      $('dStatus').className = 'badge ' + st.cls;
      $('dStatus').textContent = st.text;
      $('ibStatus').className = 'badge ' + st.cls;
      $('ibStatus').textContent = st.text;
      $('approveBtn').textContent = '去发布';
      $('ibApprove').textContent = '去发布';
      renderDrafts();
      showToast('这版通过了。草稿还在，随时能回来再改。');
    }

    function markAdjusted() {
      if (!currentDraft) return;
      if (currentDraft.status === 'approved' || currentDraft.status === 'generating') return;
      if (currentDraft.status === 'review') currentDraft.status = 'adjusted';
      const st = STATUS_META[currentDraft.status];
      $('dStatus').className = 'badge ' + st.cls;
      $('dStatus').textContent = st.text;
      $('ibStatus').className = 'badge ' + st.cls;
      $('ibStatus').textContent = st.text;
      renderDrafts();
    }

    /** 从草稿想法里提取一个像标题的名字（《xxx》优先，否则截断） */
    function draftTitleOf(d) {
      if (!d) return '';
      const m = /《([^》]+)》/.exec(d.idea || '');
      if (m) return m[1];
      return String(d.idea || '').slice(0, 30);
    }

    /** 带着这条成片去「发布」页（交接给下一页） */
    function goPublish(d) {
      try {
        sessionStorage.setItem('jco-publish-draft', JSON.stringify({
          title: draftTitleOf(d),
          ratio: d ? d.ratio : '',
          duration: d ? d.duration : '',
        }));
      } catch (e) {}
      location.href = 'J.Co工作台-发布.html';
    }

    function startGen() {
      const idea = askInp.value.trim();
      if (!idea) return;
      // 「每步问我」模式：第一次点击先问一句，再点一次才真的开始
      let runMode = 'auto';
      try { runMode = localStorage.getItem('jco-mode-v1') || 'auto'; } catch (e) {}
      if (runMode === 'ask' && goBtn.dataset.confirm !== '1') {
        goBtn.dataset.confirm = '1';
        showToast('「每步问我」：再点一次「开始生成」就开始。');
        setTimeout(() => { if (goBtn.dataset.confirm === '1') goBtn.dataset.confirm = ''; }, 4000);
        return;
      }
      goBtn.dataset.confirm = '';
      askInp.value = '';
      inputChanged();
      askInp.style.height = 'auto';

      // 每生成一条 = 开一个草稿（实时记录在草稿卡上）
      const d = createDraft(idea);
      renderDrafts();
      $('drafts').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // 真模式（视频类）：真分镜生成；图片类与浏览器演示保持原流程
      if (JCO_KERNEL && state.type === 'video') { startGenReal(d, idea); return; }
      if (JCO_KERNEL && state.type === 'image') { startGenImageReal(d, idea); return; }

      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      p = 0;
      $('done').classList.remove('show');
      const list = stepsFor();
      const stepSpan = 100 / list.length;
      genTimer = setInterval(() => {
        p = Math.min(p + 2, 100);
        d.progress = p;
        if (p >= 100) {
          clearInterval(genTimer);
          genTimer = null;
          d.progress = 100;
          d.status = 'review';
          d.stepText = '';
          renderDrafts();
          openDraft(d.id);
          showToast(state.type === 'image'
            ? '图片方案出来了（预演图；在设置里填「画图修图」的 Key 后出真图）。'
            : '草稿出来了。每一段都摆好了，不顺眼的直接换，满意了再点「这版可以了」。');
        } else {
          d.stepText = list[Math.min(Math.floor(p / stepSpan), list.length - 1)].text;
          renderDrafts();
        }
      }, 100);
    }

    /** 真模式：调内核生成分镜（进度条走到 90% 等真实结果） */
    async function startGenReal(d, idea) {
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      p = 0;
      $('done').classList.remove('show');
      const list = stepsFor();
      const stepSpan = 90 / list.length;
      genTimer = setInterval(() => {
        p = Math.min(p + 2, 90); // 封顶 90%：剩下一段留给真实生成
        d.progress = p;
        d.stepText = list[Math.min(Math.floor(p / stepSpan), list.length - 1)].text;
        renderDrafts();
      }, 240);
      const isLong = state.duration === '3 分钟' || state.duration === '5 分钟';
      const input = [
        '我要做一条' + (isLong ? '长' : '短') + '视频：' + idea,
        '比例 ' + state.ratio + '，时长目标 ' + state.duration + '，清晰度 ' + state.res + '。',
        isLong ? '给我 12~16 个镜头的分镜。' : '给我 8~12 个镜头的分镜。',
        '输出一个 JSON 数组（不要 markdown 代码块、不要解释），每个元素形如：{"line":"这一句台词，口语、一句话","pic":"这个镜头的画面描述，简短，比如 用户采访片段·小李"}',
      ].join('\n');
      const res = await Promise.race([
        JCO_KERNEL.task({
          system: '你是短视频分镜师，服务通用自媒体创作者；行业、受众、平台由品牌档案决定。只输出 JSON 数组。',
          input: input,
        }),
        new Promise((resolve) => setTimeout(() => resolve({ ok: false, error: '这次想太久了（超过 100 秒），再点一次试试。' }), 100000)),
      ]);
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      const shots = res && res.ok ? parseShots(res.text) : null;
      if (shots && shots.length >= 3) {
        d.shots = shots;
        d.progress = 100;
        d.status = 'review';
        d.stepText = '';
        renderDrafts();
        openDraft(d.id);
        jcoLogAdd('shot', draftTitleOf(d) || '一条分镜', '共 ' + shots.length + ' 段，待你过目');
        jcoNotifyDone('分镜好了', '共 ' + shots.length + ' 段，等你过目');
        showToast('分镜好了，共 ' + shots.length + ' 段。每段都能换画面、点着改，满意了再点「这版可以了」。');
        return;
      }
      // 失败：不留假草稿，如实报错
      const idx = drafts.indexOf(d);
      if (idx >= 0) drafts.splice(idx, 1);
      renderDrafts();
      showToast('没生成成：' + ((res && res.error) || '内容没解析出来') + '。再点一次试试。');
    }

    /** 真模式（图片类）：内核先出画面方案，再逐张真画（用「画图修图」的配置） */
    async function startGenImageReal(d, idea) {
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      p = 0;
      $('done').classList.remove('show');
      const list = stepsFor();
      const stepSpan = 90 / list.length;
      genTimer = setInterval(() => {
        p = Math.min(p + 2, 90);
        d.progress = p;
        d.stepText = list[Math.min(Math.floor(p / stepSpan), list.length - 1)].text;
        renderDrafts();
      }, 240);
      // 想画几张：读用户选的数量（3 张 / 6 张）
      const wanted = Math.max(1, Math.min(6, parseInt(state.count, 10) || 3))
      const ratioWord = state.ratio === '9:16' ? '9:16 竖屏' : (state.ratio === '16:9' ? '16:9 横屏' : '1:1 方形')
      // 1) 画面方案（wanted 条描述）
      let prompts = []
      try {
        const planRes = await JCO_KERNEL.task({
          system: '你是短视频画面策划，只输出画面描述行，不要解释。',
          input: '视频想法：' + idea + '\n为这条视频设计 ' + wanted + ' 个镜头的画面（' + ratioWord + '，当前品牌主题），每行一条简短描述，不要序号。',
        })
        if (planRes && planRes.ok && planRes.text) prompts = cleanLines(planRes.text).filter((l) => l.length > 3).slice(0, wanted)
      } catch (e) {}
      if (prompts.length === 0) prompts = [idea, idea + '（细节特写）', idea + '（场景全景）'].slice(0, wanted)
      // 2) 逐张真画
      const images = []
      let lastError = ''
      for (let i = 0; i < prompts.length; i++) {
        d.stepText = '正在画第 ' + (i + 1) + ' 张 / ' + prompts.length;
        d.progress = Math.max(d.progress, 40 + Math.round((i / prompts.length) * 50));
        renderDrafts()
        const r = await JCO_KERNEL.draw({ prompt: ratioWord + '，' + prompts[i] })
        if (r && r.ok && (r.dataUrl || r.url)) {
          let src = r.dataUrl || r.url
          let savedPath = ''
          // 落盘到素材文件夹：草稿只存路径，不撑爆本机存储
          try {
            const sys = window.jco && window.jco.sys
            if (sys && sys.saveAsset) {
              const saved = await sys.saveAsset(r.dataUrl ? { kind: 'image', dataUrl: r.dataUrl } : { kind: 'image', url: r.url })
              if (saved && saved.ok && saved.path) {
                savedPath = saved.path
                src = 'file:///' + String(saved.path).replace(/\\/g, '/')
              }
            }
          } catch (e) {}
          images.push({ src: src, path: savedPath, prompt: prompts[i] })
        }
        else if (r && r.error) lastError = r.error
      }
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      if (images.length === 0) {
        const idx = drafts.indexOf(d)
        if (idx >= 0) drafts.splice(idx, 1)
        renderDrafts()
        showToast('没画成：' + (lastError || '检查「设置 → AI 大脑 → 画图修图」的 Key 后重试'))
        return
      }
      d.images = images
      d.progress = 100
      d.status = 'review'
      d.stepText = ''
      renderDrafts()
      openDraft(d.id)
      jcoLogAdd('material', 'AI 出图', images.length + ' 张')
      jcoNotifyDone('图好了', '共 ' + images.length + ' 张，等你过目')
      showToast('画好了 ' + images.length + ' 张。点着看、框住改；满意了点「这版可以了」。' + (images.length < prompts.length ? '（有 ' + (prompts.length - images.length) + ' 张没画成，可重试）' : ''))
    }

    function regen() {
      if (!currentDraft) return;
      askInp.value = currentDraft.idea;
      inputChanged();
      startGen();
    }

    function renderShots() {
      const el = $('shots');
      el.innerHTML = '';
      const real = currentDraft && Array.isArray(currentDraft.shots) && currentDraft.shots.length > 0 ? currentDraft.shots : null;
      const rows = real || SHOT_LINES.map((line, i) => ({ line: line, pic: PIC_POOL[i % PIC_POOL.length] }));

      // 真模式：全出片工具行（逐段出真视频，干完系统通知）
      if (JCO_KERNEL && rows.length > 0) {
        const videos = (currentDraft && currentDraft.videos) || {};
        const doneCount = Object.values(videos).filter((v) => v && v.status === 'done').length;
        const doing = Object.values(videos).some((v) => v && v.status === 'doing');
        const bar = document.createElement('div');
        bar.className = 'shot-bar';
        const btn = document.createElement('button');
        btn.className = 'go-btn';
        const remain = rows.length - doneCount;
        btn.textContent = doing ? '出片中……' : (doneCount > 0 && remain > 0 ? '继续出片（还差 ' + remain + ' 段）' : (remain === 0 ? '全部出好了' : '全部出片（' + rows.length + ' 段）'));
        btn.disabled = doing || remain === 0;
        if (!btn.disabled) btn.addEventListener('click', () => makeAllVideos(rows));
        const hint = document.createElement('span');
        hint.className = 'shot-hint';
        hint.textContent = remain > 0 ? ('每段约 3~4 分钟 · 全部约 ' + Math.round(remain * 3.5) + ' 分钟 · 干完弹通知') : '都出好了，点每段的「看这段」预览';
        bar.appendChild(btn);
        bar.appendChild(hint);
        el.appendChild(bar);
      }

      rows.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'shot';
        row.innerHTML = `
          <span class="no">${String(i + 1).padStart(2, '0')}</span>
          <span class="pic-thumb ti ti-player-play"></span>
          <span class="mid"><span class="line"></span><span class="pic"></span></span>
          <span class="dur">${SHOT_DUR[i % SHOT_DUR.length]}</span>
          <button class="swap">换画面</button>`;
        row.querySelector('.line').textContent = item.line;
        // 真分镜保留模型给的画面描述；点「换画面」在本机备选池里轮换
        let picIdx = -1;
        const picEl = row.querySelector('.pic');
        const paintPic = () => {
          picEl.textContent = '画面：' + (picIdx < 0 ? (item.pic || '现场画面') : PIC_POOL[picIdx % PIC_POOL.length]);
        };
        paintPic();
        row.querySelector('.swap').addEventListener('click', () => {
          picIdx = (picIdx + 1) % PIC_POOL.length;
          paintPic();
          markAdjusted();
          showToast('第 ' + (i + 1) + ' 段换成了「' + PIC_POOL[picIdx] + '」。每一段都能这样换。');
        });
        // 真模式：每段一个出片入口
        if (JCO_KERNEL) {
          const videos = (currentDraft && currentDraft.videos) || {};
          const vs = videos[i];
          const mk = document.createElement('button');
          mk.className = 'swap make';
          let reBtn = null;
          if (vs && vs.status === 'doing') {
            mk.textContent = '生成中…';
            mk.disabled = true;
          } else if (vs && vs.status === 'done') {
            mk.textContent = '看这段';
            mk.addEventListener('click', () => playShotVideo(vs.url, i));
            reBtn = document.createElement('button');
            reBtn.className = 'swap make';
            reBtn.textContent = '重出';
            reBtn.title = '按最新要求重出一版';
            reBtn.addEventListener('click', () => makeShotVideo(i, item));
          } else if (vs && vs.status === 'failed') {
            mk.textContent = '重试';
            mk.title = vs.error || '';
            mk.addEventListener('click', () => makeShotVideo(i, item));
          } else {
            mk.textContent = '出这段';
            mk.addEventListener('click', () => makeShotVideo(i, item));
          }
          row.appendChild(mk);
          if (reBtn) row.appendChild(reBtn);
        }
        el.appendChild(row);
      });
    }

    /* ---------- 分段出真视频（Agnes 异步任务，单段约 3~4 分钟） ---------- */
    async function makeShotVideo(i, item) {
      if (!JCO_KERNEL || !currentDraft) return;
      const videos = (currentDraft.videos = currentDraft.videos || {});
      if (videos[i] && videos[i].status === 'doing') return;
      videos[i] = { status: 'doing' };
      renderShots();
      const aspect = state.ratio === '9:16' ? '9:16' : (state.ratio === '16:9' ? '16:9' : '1:1');
      const prompt = (item.pic ? item.pic + '。' : '') + (item.line || '') + (currentDraft.fixNote ? ('。（修改要求：' + currentDraft.fixNote + '）') : '');
      const res = await JCO_KERNEL.video({ prompt: prompt, seconds: 5, aspect: aspect });
      if (res && res.ok && res.url) {
        let src = res.url
        let savedPath = ''
        // 视频落盘（平台 URL 会过期；本地文件长期可播）
        try {
          const sys = window.jco && window.jco.sys
          if (sys && sys.saveAsset) {
            const saved = await sys.saveAsset({ kind: 'video', url: res.url, ext: 'mp4' })
            if (saved && saved.ok && saved.path) {
              savedPath = saved.path
              src = 'file:///' + String(saved.path).replace(/\\/g, '/')
            }
          }
        } catch (e) {}
        videos[i] = { status: 'done', url: src, path: savedPath, videoId: res.videoId || '' };
        jcoLogAdd('shot', '出片：第 ' + (i + 1) + ' 段', '5 秒 · 720P');
        jcoNotifyDone('第 ' + (i + 1) + ' 段视频好了', '回做视频页点「看这段」');
      } else {
        videos[i] = { status: 'failed', error: (res && res.error) || '未知错误' };
      }
      jcoDraftsSave();
      renderDrafts();
      renderShots();
    }
    async function makeAllVideos(rows) {
      if (!currentDraft) return;
      const videos = (currentDraft.videos = currentDraft.videos || {});
      for (let i = 0; i < rows.length; i++) {
        if (videos[i] && videos[i].status === 'done') continue;
        await makeShotVideo(i, rows[i]);
      }
      jcoNotifyDone('全部出片完成', '共 ' + rows.length + ' 段，回做视频页过目');
      showToast('全部出好了：每段点「看这段」预览，不满意的段可以重出。');
    }
    function playShotVideo(url, i) {
      const pop = document.getElementById('videoPop');
      const v = document.getElementById('vpVideo');
      if (!pop || !v || !url) return;
      document.getElementById('vpTitle').textContent = '第 ' + (i + 1) + ' 段 · 5 秒 · 720P';
      v.src = url;
      pop.hidden = false;
      v.play().catch(() => {});
    }
    /* 整片连播（分段顺序播；自动拼接还没接上：如实标"分段连播"） */
    let wholeQueue = [];
    let wholeIdx = 0;
    function playWhole() {
      if (!currentDraft) { showToast('先开一张草稿，再点播放。'); return; }
      const videos = currentDraft.videos || {};
      const keys = Object.keys(videos).filter((k) => videos[k] && videos[k].status === 'done' && videos[k].url);
      keys.sort((a, b) => Number(a) - Number(b));
      wholeQueue = keys.map((k) => videos[k].url);
      if (wholeQueue.length === 0) { showToast('这段还没有出片：先点「全部出片」或每段的「出这段」。'); return; }
      wholeIdx = 0;
      openWholeVideo();
    }
    function openWholeVideo() {
      const pop = document.getElementById('videoPop');
      const v = document.getElementById('vpVideo');
      if (!pop || !v || wholeQueue.length === 0) return;
      const total = (currentDraft && Array.isArray(currentDraft.shots) && currentDraft.shots.length) || wholeQueue.length;
      document.getElementById('vpTitle').textContent =
        '整片 · 分段连播（' + (wholeIdx + 1) + '/' + wholeQueue.length + ' 段已出片' + (total > wholeQueue.length ? '，共 ' + total + ' 段；未出片的会略过' : '') + '）';
      v.src = wholeQueue[wholeIdx];
      pop.hidden = false;
      v.play().catch(() => {});
    }
    function closeVideoPop() {
      const pop = document.getElementById('videoPop');
      const v = document.getElementById('vpVideo');
      if (!pop) return;
      pop.hidden = true;
      wholeQueue = [];
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    }
    (function bindVideoPop() {
      const pop = document.getElementById('videoPop');
      const close = document.getElementById('vpClose');
      const v = document.getElementById('vpVideo');
      if (close) close.addEventListener('click', closeVideoPop);
      if (pop) pop.addEventListener('click', (e) => { if (e.target === pop) closeVideoPop(); });
      if (v)
        v.addEventListener('ended', () => {
          if (!pop || pop.hidden || wholeQueue.length === 0) return;
          wholeIdx += 1;
          if (wholeIdx < wholeQueue.length) openWholeVideo();
          else wholeQueue = [];
        });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideoPop(); });
    })();

    /* ---------- 图片草稿：大图随选随修（框住哪里、修哪里） ---------- */
    let imgIdx = 0;
    const IMG_COUNT = 3;
    let selRect = null;
    let dragOn = false;
    let dragSx = 0;
    let dragSy = 0;

    function imgClass(i) { return 'g' + ((i % 3) + 1); }

    function clearSel() {
      selRect = null;
      const sel = $('ibSel');
      sel.className = 'ib-sel';
      sel.style.display = 'none';
      const tip = $('ibTip');
      tip.textContent = '在图上拖框，圈住要改的地方（比如那行字、那个背景），再告诉 AI 改成什么';
      tip.classList.remove('on');
    }

    function renderImgBoard() {
      const big = $('ibBig');
      const realImgs = (currentDraft && Array.isArray(currentDraft.images) && currentDraft.images.length > 0) ? currentDraft.images : null;
      const count = realImgs ? realImgs.length : IMG_COUNT;
      if (imgIdx >= count) imgIdx = 0;
      big.className = 'ib-big ' + imgClass(imgIdx);
      $('ibCount').textContent = (imgIdx + 1) + ' / ' + count;
      const anchors = [1, 3, 6];
      $('ibTitle').textContent = '配图 ' + (imgIdx + 1) + ' · 放在稿子第 ' + anchors[imgIdx % 3] + ' 段旁边';
      clearSel();
      // 真图：大图区显示真实图片（占位图标藏起来）
      const oldImg = big.querySelector('.ib-img');
      if (oldImg) oldImg.remove();
      const phIcon = big.querySelector('.ti-photo');
      if (phIcon) phIcon.style.display = realImgs ? 'none' : '';
      if (realImgs && realImgs[imgIdx]) {
        const img = document.createElement('img');
        img.className = 'ib-img';
        img.src = realImgs[imgIdx].src;
        img.alt = realImgs[imgIdx].prompt || '';
        big.insertBefore(img, big.firstChild);
      }
      const thumbs = $('ibThumbs');
      thumbs.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const t = document.createElement('button');
        t.className = 'ib-thumb ' + imgClass(i) + (i === imgIdx ? ' on' : '');
        t.setAttribute('aria-label', '选择第 ' + (i + 1) + ' 张');
        t.innerHTML = realImgs && realImgs[i]
          ? ''
          : '<span class="ti ti-photo"></span>';
        if (realImgs && realImgs[i]) {
          const ti = document.createElement('img');
          ti.src = realImgs[i].src;
          ti.alt = '';
          t.appendChild(ti);
        }
        t.addEventListener('click', () => { imgIdx = i; renderImgBoard(); });
        thumbs.appendChild(t);
      }
      const add = document.createElement('button');
      add.className = 'ib-add';
      add.textContent = '＋';
      add.setAttribute('aria-label', '再出几张');
      add.addEventListener('click', async () => {
        if (!JCO_KERNEL || !currentDraft || !Array.isArray(currentDraft.images) || currentDraft.images.length === 0) {
          showToast('先生成一版图，这里就能继续加画。');
          return;
        }
        showToast('再画 3 张……');
        const ratioWord = state.ratio === '9:16' ? '9:16 竖屏' : (state.ratio === '16:9' ? '16:9 横屏' : '1:1 方形');
        const base = currentDraft.idea || '画面';
        const more = [];
        for (let i = 0; i < 3; i++) {
          const r = await JCO_KERNEL.draw({ prompt: ratioWord + '，' + base + '（第 ' + (currentDraft.images.length + i + 1) + ' 个角度，与已有画面不重复）' });
          if (r && r.ok && (r.dataUrl || r.url)) more.push({ src: r.dataUrl || r.url, prompt: base });
        }
        if (more.length === 0) { showToast('没画出来，再试一次。'); return; }
        currentDraft.images = currentDraft.images.concat(more);
        renderDrafts();
        renderImgBoard();
        jcoLogAdd('material', 'AI 加图', more.length + ' 张');
        jcoNotifyDone('图好了', '又加了 ' + more.length + ' 张');
        showToast('加了 ' + more.length + ' 张，点缩略图看。');
      });
      thumbs.appendChild(add);
    }

    function ibStep(d) {
      const realImgs = (currentDraft && Array.isArray(currentDraft.images) && currentDraft.images.length > 0) ? currentDraft.images : null;
      const count = realImgs ? realImgs.length : IMG_COUNT;
      imgIdx = (imgIdx + d + count) % count;
      renderImgBoard();
    }

    /* 在图上拖框 = 选中要修的地方 */
    (function bindSelDrag() {
      const big = $('ibBig');
      big.addEventListener('mousedown', (e) => {
        if (e.target.closest('.ib-nav')) return;
        e.preventDefault();
        dragOn = true;
        const r = big.getBoundingClientRect();
        dragSx = Math.min(Math.max(e.clientX - r.left, 0), r.width);
        dragSy = Math.min(Math.max(e.clientY - r.top, 0), r.height);
        const sel = $('ibSel');
        sel.className = 'ib-sel';
        sel.style.left = dragSx + 'px';
        sel.style.top = dragSy + 'px';
        sel.style.width = '0px';
        sel.style.height = '0px';
        sel.style.display = 'block';
      });
      window.addEventListener('mousemove', (e) => {
        if (!dragOn) return;
        const r = big.getBoundingClientRect();
        const cx = Math.min(Math.max(e.clientX - r.left, 0), r.width);
        const cy = Math.min(Math.max(e.clientY - r.top, 0), r.height);
        const x = Math.min(dragSx, cx);
        const y = Math.min(dragSy, cy);
        const w = Math.abs(cx - dragSx);
        const h = Math.abs(cy - dragSy);
        const sel = $('ibSel');
        sel.style.left = x + 'px';
        sel.style.top = y + 'px';
        sel.style.width = w + 'px';
        sel.style.height = h + 'px';
      });
      window.addEventListener('mouseup', () => {
        if (!dragOn) return;
        dragOn = false;
        const sel = $('ibSel');
        const w = parseFloat(sel.style.width);
        const h = parseFloat(sel.style.height);
        if (w < 12 || h < 12) { clearSel(); return; }
        sel.classList.add('show');
        selRect = { x: parseFloat(sel.style.left), y: parseFloat(sel.style.top), w, h };
        const tip = $('ibTip');
        tip.textContent = '已框住一块。说一句把它改成什么，点「修这里」，只改这块，其它地方不动';
        tip.classList.add('on');
      });
    })();

    async function ibFix() {
      if (!selRect) { showToast('先在图上拖住鼠标，框住要改的地方'); return; }
      const v = $('ibFixInp').value.trim();
      if (!v) { showToast('说一句把这块改成什么，比如：换成“新的项目名称”'); return; }
      $('ibFixInp').value = '';
      const sel = $('ibSel');
      if (!JCO_KERNEL || !currentDraft || !Array.isArray(currentDraft.images) || currentDraft.images.length === 0) {
        showToast('这版还没有真图可改：先在底部写要求生成一版图。');
        return;
      }
      sel.classList.add('working');
      const base = (currentDraft.images[imgIdx] && currentDraft.images[imgIdx].prompt) || currentDraft.idea || '画面';
      const ratioWord = state.ratio === '9:16' ? '9:16 竖屏' : (state.ratio === '16:9' ? '16:9 横屏' : '1:1 方形');
      const r = await JCO_KERNEL.draw({ prompt: ratioWord + '，' + base + '；按这个要求调整：' + v + '（整图重绘）' });
      sel.classList.remove('working');
      sel.style.display = 'none';
      selRect = null;
      if (r && r.ok && (r.dataUrl || r.url)) {
        currentDraft.images = currentDraft.images.concat([{ src: r.dataUrl || r.url, prompt: base + '（改：' + v + '）' }]);
        imgIdx = currentDraft.images.length - 1;
        renderDrafts();
        renderImgBoard();
        markAdjusted();
        jcoLogAdd('material', 'AI 重画一版', String(v).slice(0, 30));
        jcoNotifyDone('重画好了', '按你说的改了一版（整图重绘）');
        showToast('按你说的重画了一张（整图重绘，不是局部修改）：在新缩略图里。');
      } else {
        showToast('没画成：' + ((r && r.error) || '再试一次'));
      }
    }

    function fixGo() {
      if (!currentDraft) { showToast('先开一张草稿，再说要改什么。'); return; }
      const v = $('fixInp').value.trim();
      if (!v) { showToast('说一句你想怎么改，比如：配音换男声'); return; }
      $('fixInp').value = '';
      currentDraft.fixNote = v;
      jcoDraftsSave();
      markAdjusted();
      showToast('记下了：「' + v + '」会带进后面的出片；已出好的段，点「重出」就能按新要求再出一版。');
    }

    /* 手头素材行：读本机真数据（最近稿子 / 素材库） */
    (function handyLine() {
      const el = document.getElementById('handyLine');
      if (!el) return;
      let script = null;
      try { script = JSON.parse(localStorage.getItem('jco-script-v1') || 'null'); } catch (e) {}
      let mats = 0;
      try { mats = (JSON.parse(localStorage.getItem('jco-materials-v1') || '{"items":[]}').items || []).length; } catch (e) {}
      function paint(materialCount) {
        const parts = [];
        if (script && script.topic && Array.isArray(script.lines) && script.lines.length > 0) parts.push('《' + String(script.topic).slice(0, 18) + '》稿子 ' + script.lines.length + ' 句');
        else parts.push('还没有稿子（去「文案」页写一篇）');
        parts.push(materialCount > 0 ? ('素材 ' + materialCount + ' 件') : '素材还没导入');
        el.textContent = parts.join(' · ');
      }
      paint(mats);
      if (window.jco && window.jco.materials && window.jco.materials.get) {
        window.jco.materials.get().then(function (res) {
          if (!res || !res.ok) return;
          var items = (res.data && res.data.items) || [];
          paint(items.length);
        }, function () {});
      }
    })();
    render();
    renderTemplates();
    // 恢复上次的草稿（真模式：草稿不丢，回来接着改）
    (function restoreDrafts() {
      var saved = jcoDraftsLoad();
      if (saved.length === 0) return;
      saved.forEach(function (d) {
        drafts.push(d);
        draftSeq = Math.max(draftSeq, d.id || 0);
      });
      renderDrafts();
    })();
    renderDrafts();
  </script>
  <script>
    /* ---------- 侧栏导航（原型可点通） ---------- */
    (function () {
      var here = decodeURIComponent(location.pathname.split('/').pop());
      var PAGES = {
        '总管': 'J.Co总管.html',
        '选题': 'J.Co工作台-选题.html',
        '素材': 'J.Co工作台-素材.html',
        '文案': 'J.Co工作台-创作.html',
        '创作': 'J.Co工作台-做视频.html',
        '后期': 'J.Co工作台-后期.html',
        '发布': 'J.Co工作台-发布.html',
        '运营': 'J.Co工作台-运营.html',
        '管家团队': 'J.Co管家团队.html',
        '账号中心': 'J.Co账号中心.html',
        '设置': 'J.Co设置.html',
        '自动任务': 'J.Co自动任务.html',
        '技能库': 'J.Co技能库.html'
      };
      document.querySelectorAll('.nav-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var label = btn.textContent.trim();
          var target = PAGES[label];
          if (target) {
            if (target !== here) location.href = target;
            return;
          }
          showToast('「' + label + '」还没开工，已经记进下一步清单（先把现有的七个环节用顺）。');
        });
      });
      var bell = document.querySelector('.side-foot .icon-btn');
      if (bell) bell.addEventListener('click', function (e) {
        e.stopPropagation();
        jcoToggleNotif(bell);
      });
      /* ---------- 右下角·总管助手 ---------- */
      (function () {
        var btn = document.getElementById('copilotBtn');
        var panel = document.getElementById('copilot');
        var fold = document.getElementById('cpFold');
        var body = document.getElementById('cpBody');
        var inp = document.getElementById('cpInp');
        var sendBtn = document.getElementById('cpSend');
        if (!btn || !panel) return;
        btn.addEventListener('click', function () { panel.hidden = !panel.hidden; });
        if (fold) fold.addEventListener('click', function () { panel.hidden = true; });
        var FIXED = {
          '这条视频数据怎么样？': '《把一件事讲清楚，其实就 3 步》实时数据：播放 <b>5.2 万</b>（还在涨）、点赞 3,180、评论 57、带来咨询 6 条。比你的平均表现高 <b>8 倍</b>。',
          '今天还剩什么事？': '还有 3 件在你手上：2 条视频等你过目、8 条评论等你放行、19:30 的发布等你确认。都排好了，你点头就行。',
          '评论有什么动静？': '新评论 6 条：2 条问价格（我拟好引导话术了），3 条夸的，1 条问「初中能不能报」。建议你亲自回，这种最容易成。'
        };
        function appendMe(t) {
          var el = document.createElement('div');
          el.className = 'cp-msg me';
          el.textContent = t;
          body.appendChild(el);
          body.scrollTop = body.scrollHeight;
        }
        function appendAI(html) {
          var el = document.createElement('div');
          el.className = 'cp-msg ai';
          el.innerHTML = html;
          body.appendChild(el);
          body.scrollTop = body.scrollHeight;
        }
        function ask(q) {
          if (!q) return;
          appendMe(q);
          var cpKernel = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel);
          if (cpKernel) {
            appendAI('…');
            var cpMsgs = body.querySelectorAll('.cp-msg.ai');
            var cpEl = cpMsgs[cpMsgs.length - 1];
            window.jco.kernel.ask(q).then(function (res) {
              var cpText = (res && res.ok && res.text) ? res.text : ('没答上来：' + ((res && res.error) || '未知错误'));
              cpEl.textContent = cpText;
              cpEl.style.whiteSpace = 'pre-wrap';
              body.scrollTop = body.scrollHeight;
            });
            return;
          }
          setTimeout(function () {
            appendAI(FIXED[q] || ('收到「' + q + '」。正式版里我马上去查，查完把明细端给你。'));
          }, 420);
        }
        document.querySelectorAll('.cp-act').forEach(function (b) {
          b.addEventListener('click', function () { ask(b.getAttribute('data-q')); });
        });
        function fire() {
          var v = inp.value.trim();
          if (!v) return;
          inp.value = '';
          inp.style.height = 'auto';
          ask(v);
        }
        sendBtn.addEventListener('click', fire);
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fire(); }
        });
        inp.addEventListener('input', function () {
          inp.style.height = 'auto';
          inp.style.height = Math.min(inp.scrollHeight, 90) + 'px';
        });
      })();
      /* ---------- 侧栏（图标栏 + 悬停展开 + 固定展开） ---------- */
      (function () {
        var sidebar = document.querySelector('.sidebar');
        var pinBtn = document.querySelector('.side-toggle');
        if (!sidebar) return;
        function setPinned(v) {
          document.documentElement.classList.toggle('side-pinned', v);
          if (pinBtn) pinBtn.querySelector('.ti').className = 'ti ' + (v ? 'ti-layout-sidebar-left-collapse' : 'ti-layout-sidebar-left-expand');
          try { localStorage.setItem('jco-side-pinned', v ? '1' : '0'); } catch (err) {}
        }
        if (pinBtn) pinBtn.addEventListener('click', function () {
          setPinned(!document.documentElement.classList.contains('side-pinned'));
        });
        try {
          if (localStorage.getItem('jco-side-pinned') === '1') setPinned(true);
        } catch (err) {}
      })();
      /* ---------- 侧栏分组折叠 ---------- */
      (function () {
        var KEY = 'jco-sidebar-folded-groups';
        function loadFolded() {
          try { return (localStorage.getItem(KEY) || '').split(',').filter(Boolean); } catch (e) { return []; }
        }
        function saveFolded(list) {
          try { localStorage.setItem(KEY, list.join(',')); } catch (e) {}
        }
        function applyFold(label, hide) {
          label.classList.toggle('folded', hide);
          var el = label.nextElementSibling;
          while (el && !el.classList.contains('group-label')) {
            if (el.classList.contains('nav-item') || el.classList.contains('convos')) {
              el.style.display = hide ? 'none' : '';
            }
            el = el.nextElementSibling;
          }
        }
        var folded = loadFolded();
        document.querySelectorAll('.group-label').forEach(function (label) {
          var name = label.textContent.trim();
          if (folded.indexOf(name) !== -1) applyFold(label, true);
          label.addEventListener('click', function () {
            var hide = !label.classList.contains('folded');
            applyFold(label, hide);
            var list = loadFolded();
            if (hide) { if (list.indexOf(name) === -1) list.push(name); }
            else { list = list.filter(function (x) { return x !== name; }); }
            saveFolded(list);
          });
        });
      })();
      var wm = document.querySelector('.wordmark');
      if (wm) wm.addEventListener('click', function () {
        if ('J.Co主界面-首页.html' !== here) location.href = 'J.Co主界面-首页.html';
      });
      document.querySelectorAll('.convo').forEach(function (btn) {
        btn.addEventListener('click', function () {
          location.href = 'J.Co总管.html';
        });
      });
    })();
  
    /* ---------- 账号菜单（点头像弹出：设置 / 退出登录） ---------- */
    (function () {
      var meBtn = document.getElementById('meBtn');
      var menu = document.getElementById('meMenu');
      if (!meBtn || !menu) return;
      function setOpen(open) {
        menu.hidden = !open;
        meBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      meBtn.addEventListener('click', function () { setOpen(menu.hidden); });
      meBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(menu.hidden); }
        if (e.key === 'Escape') setOpen(false);
      });
      document.addEventListener('click', function (e) {
        if (!menu.hidden && !menu.contains(e.target) && !meBtn.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !menu.hidden) setOpen(false);
      });
      document.getElementById('mmSettings').addEventListener('click', function () {
        setOpen(false);
        var here = decodeURIComponent(location.pathname.split('/').pop());
        if (here !== 'J.Co设置.html') location.href = 'J.Co设置.html';
      });
      document.getElementById('mmLogout').addEventListener('click', function () {
        setOpen(false);
        showToast('这台电脑上不用单独登录：关掉窗口就是退出，素材和草稿都留着。');
      });
    })();
  
    /* ---------- 通知面板：最近的活动记录（真数据） ---------- */
    function jcoToggleNotif(anchor) {
      var old = document.querySelector('.notif-pop');
      if (old) { old.remove(); return; }
      var items = [];
      try { items = (JSON.parse(localStorage.getItem('jco-log-v1') || '{"items":[]}').items) || []; } catch (e) {}
      var pop = document.createElement('div');
      pop.className = 'notif-pop';
      var r = anchor.getBoundingClientRect();
      pop.style.position = 'fixed';
      pop.style.left = Math.min(r.right + 10, window.innerWidth - 296) + 'px';
      pop.style.bottom = Math.max(12, window.innerHeight - r.bottom) + 'px';
      var head = document.createElement('div');
      head.className = 'np-head';
      head.textContent = '最近动态';
      pop.appendChild(head);
      if (items.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'np-empty';
        empty.textContent = '还没有记录。干一句活，这里就开始记。';
        pop.appendChild(empty);
      } else {
        items.slice(0, 8).forEach(function (x) {
          var row = document.createElement('div');
          row.className = 'np-row';
          var d = new Date(x.t);
          var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
          var time = document.createElement('span');
          time.className = 'np-time';
          time.textContent = hh;
          var txt = document.createElement('span');
          txt.className = 'np-txt';
          txt.textContent = x.title + (x.detail ? '（' + x.detail + '）' : '');
          row.appendChild(time);
          row.appendChild(txt);
          pop.appendChild(row);
        });
      }
      var foot = document.createElement('a');
      foot.className = 'np-foot';
      foot.href = 'J.Co总管.html';
      foot.textContent = '去总管看全部 →';
      pop.appendChild(foot);
      document.body.appendChild(pop);
      var closer = function (ev) {
        if (!pop.contains(ev.target)) {
          pop.remove();
          document.removeEventListener('click', closer, true);
        }
      };
      setTimeout(function () { document.addEventListener('click', closer, true); }, 0);
    }
  
  
    /* ---------- 对话列表（真会话）：点击续聊；每项可分享 / 重命名 / 删除；＋ 新会话 ---------- */
    (function jcoConvos() {
      var hasKernel = (typeof window.jco !== 'undefined' && window.jco && window.jco.kernel);
      if (!hasKernel) return; // 浏览器直开：保留演示列表
      var data = null;
      try { data = JSON.parse(localStorage.getItem('jco-chats-v1') || 'null'); } catch (e) {}
      var box = document.querySelector('.convos');
      if (!box) return
      // M7：数据缺失也渲染：「新会话」按钮常驻，不依赖"总管页先初始化"
      if (!data || !Array.isArray(data.chats)) { data = { activeId: null, chats: [] } };
      var here = decodeURIComponent(location.pathname.split('/').pop());
      function go(req) {
        try { sessionStorage.setItem('jco-open-chat', req); } catch (e) {}
        if (here !== 'J.Co总管.html') location.href = 'J.Co总管.html';
      }
      function saveChats() { try { localStorage.setItem('jco-chats-v1', JSON.stringify(data)); } catch (e) {} }

      /* 会话操作：分享 / 重命名 / 删除（含两步防误删） */
      var openMenu = null;
      function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
      document.addEventListener('click', closeMenu);
      function toastIt(msg) {
        var t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg; t.classList.add('show');
        clearTimeout(toastIt._t); toastIt._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
      }
      function shareChat(chat) {
        var lines = ['【和 J.Co 的对话 · ' + (chat.title || '新会话') + '】'];
        (chat.messages || []).forEach(function (m) {
          lines.push((m.role === 'user' ? '我：' : 'J.Co：') + String(m.text || ''));
        });
        var text = lines.join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { toastIt('对话已复制，去粘贴分享吧'); },
            function () { toastIt('没复制成，手动选中复制一下'); }
          );
        } else { toastIt('这台环境不支持直接复制'); }
      }
      function showMenu(anchor, chat) {
        closeMenu();
        var menu = document.createElement('div');
        menu.className = 'convo-menu';
        menu.addEventListener('click', function (e) { e.stopPropagation(); });
        function item(icon, label, cls, fn) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = cls || '';
          b.innerHTML = '<span class="ti ' + icon + '"></span>' + label;
          b.addEventListener('click', fn);
          menu.appendChild(b);
          return b;
        }
        item('ti-share-3', '分享对话', '', function () { closeMenu(); shareChat(chat); });
        item('ti-file-text', '重命名', '', function () {
          closeMenu();
          var row = anchor.closest('.convo');
          var nameEl = row ? row.querySelector('.name') : null;
          if (!nameEl) return;
          var input = document.createElement('input');
          input.className = 'convo-rename';
          input.value = chat.title || '新会话';
          nameEl.replaceWith(input);
          input.focus(); input.select();
          var done = false;
          function commit(saveIt) {
            if (done) return; done = true;
            var v = input.value.trim().slice(0, 20);
            if (saveIt && v) chat.title = v;
            nameEl.textContent = chat.title || '新会话';
            input.replaceWith(nameEl);
            if (saveIt && v) { saveChats(); toastIt('改好名字了'); }
          }
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            if (e.key === 'Escape') { commit(false); }
          });
          input.addEventListener('blur', function () { commit(true); });
          input.addEventListener('click', function (e) { e.stopPropagation(); });
        });
        var del = item('ti-trash', '删除对话', 'danger', function () {
          if (del.getAttribute('data-armed') !== '1') {
            del.setAttribute('data-armed', '1');
            del.innerHTML = '<span class="ti ti-trash"></span>再点一次，真删除';
            return;
          }
          closeMenu();
          var wasActive = data.activeId === chat.id;
          data.chats = data.chats.filter(function (x) { return x.id !== chat.id; });
          if (data.chats.length === 0) {
            data.chats.push({ id: 'c' + Date.now().toString(36), title: '新会话', updatedAt: Date.now(), messages: [] });
          }
          if (wasActive) data.activeId = data.chats[0].id;
          saveChats();
          toastIt('已删除「' + (chat.title || '新会话') + '」');
          render();
        });
        document.body.appendChild(menu);
        var r = anchor.getBoundingClientRect();
        var mw = menu.offsetWidth || 160, mh = menu.offsetHeight || 130;
        var left = Math.min(r.right + 8, window.innerWidth - mw - 10);
        var top = Math.min(r.bottom + 4, window.innerHeight - mh - 10);
        if (top < 8) top = 8;
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        openMenu = menu;
      }
      function render() {
        box.innerHTML = '';
        var add = document.createElement('button');
        add.className = 'convo new-btn';
        add.innerHTML = '<span class="ti ti-plus"></span>新会话';
        add.addEventListener('click', function (e) { e.stopPropagation(); go('new'); });
        // 「新会话」按钮位：顶部搜索框下方（M7 全站统一；找不到容器时回退列表内）
        var slot = document.getElementById('newChatSlot');
        if (slot) {
          slot.innerHTML = '';
          slot.appendChild(add);
        } else {
          box.appendChild(add);
        }
        data.chats.slice(0, 8).forEach(function (c) {
          var b = document.createElement('button');
          b.className = 'convo' + (c.id === data.activeId ? ' active' : '');
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = c.title || '新会话';
          b.appendChild(nm);
          var more = document.createElement('span');
          more.className = 'convo-more';
          more.setAttribute('role', 'button');
          more.setAttribute('tabindex', '0');
          more.setAttribute('aria-label', '更多操作');
          more.textContent = '⋯';
          more.addEventListener('click', function (e) { e.stopPropagation(); showMenu(more, c); });
          more.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); showMenu(more, c); } });
          b.appendChild(more);
          b.addEventListener('click', function (e) { e.stopPropagation(); go(c.id); });
          box.appendChild(b);
        });
      }
      render();
    })();
  
  </script>
  
</body>
