<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.Co · 创作</title>
  <link rel="stylesheet" href="./assets/jco-ui.css">
  <script src="./assets/jco-shell.js"></script>
  <style>
/* ============ 主区 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.scroll { flex: 1; overflow-y: auto; }

.wrap { max-width: none; margin: 0 auto; padding: var(--jco-page-top) var(--jco-page-x) 70px; }

/* 头部：和 J.Co + 模式切换 */
  .agent-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }

.agent-logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--text-1); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; flex: none;
  }

.agent-name { font-size: 16px; font-weight: 600; }

.agent-tabs { display: flex; background: var(--tint); border-radius: 999px; padding: 3px; gap: 2px; }

.agent-tabs button {
    border: none; background: transparent; border-radius: 999px;
    font-family: inherit; font-size: 14px; color: var(--text-2);
    height: 32px; padding: 0 16px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

.agent-tabs button:hover { color: var(--text-1); }

.agent-tabs button.on { background: var(--card); color: var(--text-1); font-weight: 600; box-shadow: var(--shadow-card); }

.agent-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.agent-hint { font-size: 16px; color: var(--text-2); }

.from {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--tint); border-radius: 20px; padding: 12px 18px;
    font-size: 13px; color: var(--text-2); margin-bottom: 16px;
  }

.from .ti { font-size: 16px; color: var(--text-2); }

.from b { color: var(--text-1); font-weight: 600; }

.from .src { color: var(--text-3); font-size: 12px; margin-left: auto; }

.picked-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: -4px 0 14px; font-size: 12px; color: var(--text-2);
  }

.picked-bar[hidden] { display: none; }

.picked-bar .label { color: var(--text-3); }

.picked-list { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.picked-chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 240px;
    padding: 4px 6px 4px 10px; border-radius: 999px;
    background: var(--card); box-shadow: var(--shadow-card); color: var(--text-1);
  }

.picked-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.picked-chip .rm {
    flex: none; width: 20px; height: 20px; border: none; border-radius: 999px;
    background: transparent; color: var(--text-3); font-size: 13px; cursor: pointer;
  }

.picked-chip .rm:hover { background: var(--hover); color: var(--text-1); }

.picked-chip .rm:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ============ 核心输入卡 ============ */
  .ask {
    position: static; max-width: none; margin: 0 74px 0 0;
    background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    padding: 16px 20px 12px;
  }

.pinbar {
    flex: none; padding: 8px 32px 14px;
    background: transparent; border-top: none;
  }



.ask:focus-within { box-shadow: 0 0 0 3px rgba(0, 128, 255, 0.12), var(--shadow); }

.ask textarea {
    width: 100%; border: none; background: transparent; resize: none;
    font-family: inherit; font-size: 16px; line-height: 1.6; color: var(--text-1);
    outline: none; min-height: 54px; max-height: 140px;
  }

.ask textarea:focus-visible { outline: none; }

.ask textarea::placeholder { color: var(--text-3); }

.ask-bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: nowrap; }

  .ask-bar .left, .ask-bar .right { display: flex; align-items: center; gap: 8px; flex: none; }
  .ask-bar .right { margin-left: 0; }

.ask-bar .mid { flex: 1; display: flex; justify-content: center; min-width: 0; }

.tool {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--text-2);
    font-family: inherit; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

.tool:hover { background: var(--hover); color: var(--text-1); }

.tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.model-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--tint); color: var(--text-1);
    font-family: inherit; cursor: pointer;
    max-width: 100%; white-space: nowrap; overflow: hidden;
    transition: background 0.15s ease;
  }

.model-pill:hover { background: var(--btn-2nd); }

.model-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.model-pill .ti { font-size: 14px; color: var(--accent); flex: none; }

.model-pill .px { overflow: hidden; text-overflow: ellipsis; }

.model-pill .chev { color: var(--text-3); }

.send-big {
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #ffffff; font-size: 18px; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
  }

.send-big:hover { background: var(--accent-strong); }

.send-big:active { transform: scale(0.95); }

.send-big:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.send-big:disabled { background: rgba(120, 120, 128, 0.22); color: var(--bg); cursor: default; }

/* 参数弹层 */
  .pill-pop {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(100% - 44px); z-index: 30;
    width: 480px; max-width: calc(100vw - 80px);
    background: var(--card); border-radius: 20px;
    box-shadow: var(--shadow-float);
    padding: 18px 20px 14px;
    display: none;
  }

.pill-pop.show { display: block; }

/* 参数小分类：每个只显示当前值，点开选 */
.ask-params {
  display: flex; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; align-items: center; gap: 6px;
  padding: 0; overflow: visible;
}
.ask-params .param { position: relative; }
.ask-params .param { flex: none; }
.ask-params .param-chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); background: transparent;
  color: var(--text-2); font-family: inherit; cursor: pointer;
}
.ask-params .param-chip:hover { border-color: var(--text-3); color: var(--text-1); }
.ask-params .param-chip .ti { color: var(--text-3); }
.ask-params .param-menu {
  position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 40;
  min-width: 120px;
  padding: 8px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); box-shadow: var(--shadow-float);
}
.ask-params .param-menu[hidden] { display: none; }
.ask-params .param-menu .seg { display: flex; flex-wrap: wrap; gap: 4px; width: max-content; max-width: 280px; }
.ask-params .param-menu .seg button { height: 26px; padding: 0 9px; border-radius: 8px; font-size: 12px; white-space: nowrap; flex: none; }

.pop-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

.pop-row .plabel { width: 58px; flex: none; font-size: 13px; color: var(--text-2); }

.pop-tip { font-size: 12px; color: var(--text-3); border-top: 0.5px solid var(--line); padding-top: 10px; margin-top: 2px; min-height: 20px; }

/* ============ 技能快捷排（图标卡片） ============ */
  .skills {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    margin-top: 20px;
  }

.skill {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 4px 11px; border: none; border-radius: 20px;
    background: transparent; color: var(--text-1);
    font-family: inherit; font-size: 12px; cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
  }

.skill:hover { background: var(--card); box-shadow: var(--shadow-card); }

.skill:active { transform: scale(0.96); }

.skill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.skill .ic {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--tint); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: background 0.15s ease, color 0.15s ease;
  }

.skill:hover .ic { background: rgba(0, 128, 255, 0.12); color: var(--accent); }

.skill .nm { white-space: nowrap; color: var(--text-2); }

.skill:hover .nm { color: var(--text-1); font-weight: 500; }

/* ============ 我的草稿 ============ */
  .sec-drafts { margin-top: 34px; }

.sec-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }

.sec-title h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }

.sec-title .sec-hint { font-size: 13px; color: var(--text-3); }

/* 草稿箱：白卡框里一排排"扑克牌"，每个单位一张 */
  .drafts { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card); padding: 14px; min-height: 96px; }

.dcard { display: flex; flex-direction: column; border: 0.5px solid var(--line); border-radius: 20px; background: var(--bg); overflow: hidden; cursor: pointer; text-align: left; font-family: inherit; padding: 0; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }

.dcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--text-3); }

.dcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.dcard:disabled { cursor: default; opacity: 0.95; }

.dcard:disabled:hover { transform: none; box-shadow: none; border-color: var(--line); }

.dcard .dcover { height: 128px; background: var(--tint); display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 28px; position: relative; overflow: hidden; }

.dcard .dcover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.dcard .dcorner { position: absolute; top: 8px; right: 8px; z-index: 1; }

.dcard .dbody { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }

.dcard .dname { font-size: 12px; font-weight: 600; line-height: 1.5; color: var(--text-1); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.dcard .dsub { font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; gap: 6px; }

.dcard .dprog { height: 4px; border-radius: 999px; background: rgba(120, 120, 128, 0.18); overflow: hidden; }

.dcard .dprog .dfill { height: 100%; width: 100%; border-radius: 999px; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform 0.3s linear; }

.drafts-empty {
    grid-column: 1 / -1;
    padding: 26px 24px; text-align: center;
    font-size: 13px; color: var(--text-3); line-height: 1.7;
  }

.draft {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card);
    padding: 13px 16px;
    transition: box-shadow 0.16s ease;
  }

.draft:hover { box-shadow: var(--shadow); }

.draft .thumb {
    flex: none; width: 66px; height: 42px; border-radius: 12px;
    background: var(--tint); color: var(--text-3);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }

.draft .info { flex: 1; min-width: 0; }

.draft .dtitle { font-size: 14px; font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.draft .dmeta { margin-top: 4px; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.draft .dprog { margin-top: 7px; height: 4px; border-radius: 999px; background: rgba(120, 120, 128, 0.18); overflow: hidden; }

.draft .dprog .dfill { height: 100%; width: 100%; border-radius: 999px; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform 0.3s linear; }

.badge {
    flex: none; font-size: 12px; font-weight: 600;
    border-radius: 999px; padding: 4px 12px;
    background: var(--tint); color: var(--text-2);
  }

.badge.gen { color: var(--accent); background: rgba(0, 128, 255, 0.12); }

.badge.review { color: #b25000; background: rgba(255, 140, 40, 0.14); }

.badge.adjusted { color: var(--accent); background: rgba(0, 128, 255, 0.12); }

.badge.approved { color: var(--green); background: rgba(36, 138, 61, 0.12); }

.draft .open {
    flex: none; height: 34px; padding: 0 16px; border: none; border-radius: 999px;
    background: var(--btn-2nd); color: var(--text-1);
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

.draft .open:hover { background: var(--btn-2nd-hover); }

.draft .open:active { transform: scale(0.97); }

.draft .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.draft .open.primary { background: var(--accent); color: #ffffff; }

.draft .open.primary:hover { background: var(--accent-strong); }

/* 草稿详情状态头 */
  .dhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

.dhead .dtime { font-size: 12px; color: var(--text-3); }

/* ============ 图片草稿：大图随选随修 ============ */
  .imgboard { display: none; flex-direction: column; width: 100%; gap: 14px; }

.ib-head { display: flex; align-items: center; gap: 10px; }

.ib-head .dtime { font-size: 12px; color: var(--text-3); }

.ib-body { display: flex; gap: 24px; }

.ib-main { flex: none; }

.ib-big {
    position: relative; width: 252px; height: 336px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 34px;
    border: 0.5px solid var(--line);
  }

.ib-big.g1, .ib-thumb.g1 { background: linear-gradient(135deg, rgba(64, 120, 255, 0.18), rgba(64, 120, 255, 0.05)); }

.ib-big.g2, .ib-thumb.g2 { background: linear-gradient(135deg, rgba(40, 160, 110, 0.18), rgba(40, 160, 110, 0.05)); }

.ib-big.g3, .ib-thumb.g3 { background: linear-gradient(135deg, rgba(235, 140, 60, 0.2), rgba(235, 140, 60, 0.06)); }

.ib-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

.ib-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

.ib-count {
    position: absolute; right: 10px; top: 10px;
    font-size: 12px; color: var(--text-2); background: var(--card);
    border-radius: 999px; padding: 3px 10px;
  }

.ib-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; border-radius: 50%;
    background: var(--card); box-shadow: var(--shadow-card); color: var(--text-1);
    font-size: 16px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

.ib-nav:hover { background: var(--btn-2nd-hover); }

.ib-nav:active { transform: translateY(-50%) scale(0.94); }

.ib-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ib-nav.prev { left: 8px; }

.ib-nav.next { right: 8px; }

.ib-sel {
    position: absolute; display: none;
    border: 2px solid var(--accent);
    background: rgba(0, 128, 255, 0.12);
    border-radius: 4px;
    pointer-events: none;
  }

.ib-sel.show { display: block; }

.ib-sel.working { animation: selpulse 0.6s infinite alternate; }

@keyframes selpulse {
    from { background: rgba(0, 128, 255, 0.12); }
    to { background: rgba(0, 128, 255, 0.34); }
  }

.ib-sel.done { border-color: var(--green); background: rgba(36, 138, 61, 0.12); }

.ib-sel.done::after {
    content: '已修改';
    position: absolute; right: -2px; top: -24px;
    font-size: 12px; color: var(--green); background: var(--card);
    border-radius: 4px; padding: 2px 8px; border: 0.5px solid var(--line);
  }

.ib-tip { font-size: 12px; color: var(--text-3); }

.ib-tip.on { color: var(--accent); font-weight: 600; }

.ib-title { margin-top: 10px; font-size: 12px; color: var(--text-2); text-align: center; }

.ib-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

.ib-thumbs { display: flex; gap: 10px; }

.ib-thumb {
    width: 64px; height: 86px; border-radius: 12px; border: 2px solid transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 18px; padding: 0;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

.ib-thumb:hover { transform: translateY(-2px); }

.ib-thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ib-thumb.on { border-color: var(--accent); }

.ib-add {
    width: 64px; height: 86px; border-radius: 12px;
    border: 1px dashed var(--line); background: transparent;
    color: var(--text-3); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

.ib-add:hover { border-color: var(--text-3); color: var(--text-1); }

.ib-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ib-side .fix-bar { margin-top: 0; }

.ib-ops { display: flex; align-items: center; gap: 10px; margin-top: auto; }

/* ============ 模板区 ============ */
  .templates { margin-top: 36px; }

.tp-head { font-size: 14px; color: var(--text-2); margin-bottom: 12px; }

.tp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

.tp {
    text-align: left; background: var(--card); border: none; border-radius: 20px;
    box-shadow: var(--shadow-card); padding: 16px 16px 15px;
    font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: transform 0.16s var(--ease), box-shadow 0.16s var(--ease);
  }

.tp:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.tp:active { transform: scale(0.985); }

.tp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tp .ic { font-size: 20px; color: var(--text-2); }

.tp .nm { font-size: 14px; font-weight: 600; color: var(--text-1); }

.tp .ds { font-size: 12px; color: var(--text-2); line-height: 1.6; min-height: 40px; }

/* ============ 对话流 / 生成 / 成品 ============ */
  .flow { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }

.stage {
    display: none;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    padding: 22px 24px; margin-top: 16px;
  }

.stage.show { display: flex; gap: 24px; }

.phone {
    flex: none; width: 150px; aspect-ratio: 9 / 16;
    background: var(--tint); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-3); font-size: 12px; text-align: center; padding: 10px;
  }

.phone .ti { font-size: 30px; }

.phone.wide { width: 190px; aspect-ratio: 16 / 9; }

.phone.square { width: 150px; aspect-ratio: 1 / 1; }

.stage .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.stage .stage-title { font-size: 16px; font-weight: 600; }

.steps { margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }

.step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-3); }

.step .dot {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--tint); color: var(--text-3); font-size: 12px;
  }

.step.cur { color: var(--text-1); font-weight: 600; }

.step.cur .dot { background: rgba(0, 128, 255, 0.12); color: var(--accent); }

.step.done { color: var(--text-2); }

.step.done .dot { background: rgba(36, 138, 61, 0.12); color: var(--green); }

.track { margin-top: 18px; height: 5px; border-radius: 999px; background: rgba(120, 120, 128, 0.2); overflow: hidden; }

.fill { height: 100%; width: 100%; border-radius: 999px; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform 0.24s linear; }

.stage .note { margin-top: 12px; font-size: 12px; color: var(--text-3); }

.done {
    display: none;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    padding: 22px 24px; margin-top: 16px;
  }

.done.show { display: flex; }

.board { display: flex; gap: 22px; width: 100%; }

.board .left { flex: none; display: flex; flex-direction: column; gap: 10px; align-items: center; }

.board .right { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.board .phone { cursor: pointer; }

.board-head .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }

.board-head .meta { margin-top: 6px; font-size: 13px; color: var(--text-2); }

.shots { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

.shot-bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

.shot-bar .go-btn:disabled { opacity: 0.55; cursor: default; }

.shot-hint { font-size: 12px; color: var(--text-3); }

.shot .make { color: var(--accent); }

.shot .make:disabled { opacity: 0.6; cursor: default; }

/* 视频预览弹层 */
  .video-pop { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(20, 20, 24, 0.55); }

.video-pop[hidden] { display: none; }

.vp-box { width: min(560px, 88vw); max-height: 86vh; background: var(--card); border-radius: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32); overflow: hidden; display: flex; flex-direction: column; }

.vp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 18px; border-bottom: 0.5px solid var(--line); font-size: 14px; font-weight: 600; }

.vp-close { flex: none; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: none; border-radius: 8px; background: transparent; color: var(--text-2); font-size: 16px; cursor: pointer; }

.vp-close:hover { background: var(--hover); }

.vp-close:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.vp-box video { width: 100%; max-height: 70vh; background: #141418; display: block; }

.shot {
    display: flex; align-items: center; gap: 12px;
    background: var(--tint); border-radius: 12px; padding: 10px 12px;
  }

.shot .no { flex: none; width: 24px; font-size: 12px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }

.shot .pic-thumb {
    flex: none; width: 54px; height: 34px; border-radius: 8px;
    background: rgba(120, 120, 128, 0.16); color: var(--text-3);
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }

.shot .pic-thumb.has-img { background-size: cover; background-position: center; color: transparent; }

.shot .mid { flex: 1; min-width: 0; }

.shot .line { display: block; font-size: 13px; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.shot .pic { display: block; margin-top: 3px; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.shot .dur { flex: none; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }

.shot .swap {
    flex: none; height: 28px; padding: 0 11px; border: none; border-radius: 999px;
    background: var(--card); color: var(--text-1); font-family: inherit; font-size: 12px;
    cursor: pointer; transition: background 0.15s ease;
  }

.shot .swap:hover { background: var(--btn-2nd-hover); }

.shot .swap:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.ops { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 16px; flex-wrap: wrap; }

.fix-bar {
    margin-top: 14px; display: flex; gap: 10px; align-items: center;
    background: var(--tint); border-radius: 12px; padding: 9px 10px 9px 16px;
  }

.fix-bar .ti { font-size: 16px; color: var(--text-2); flex: none; }

.fix-bar input {
    flex: 1; border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 14px; color: var(--text-1);
  }

.fix-bar input:focus-visible { outline: none; }

.fix-bar input::placeholder { color: var(--text-3); }

.fix-bar .ghost { background: var(--card); }

  <script>
    /* ================= 状态 ================= */
    const state = {
      type: 'video',       // video | image
      ratio: '9:16',
      duration: '30 秒',
    res: '720P',
      voice: '标准女声',
      count: '3 张',
      method: 'assemble',  // 技能会影响它
    };

    const $ = (id) => document.getElementById(id);
    const toastEl = $('toast');
    const MEDIA = window.JCO_MEDIA;
    let pickedMaterials = [];

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    function renderPickedMaterials() {
      const bar = $('pickedBar');
      const list = $('pickedList');
      if (!bar || !list) return;
      bar.hidden = pickedMaterials.length === 0;
      list.innerHTML = '';
      pickedMaterials.forEach((m, index) => {
        const chip = document.createElement('span');
        chip.className = 'picked-chip';
        const icon = m.type === 'video' ? 'ti-video' : (m.type === 'audio' ? 'ti-music' : 'ti-photo');
        chip.innerHTML = '<span class="ti ' + icon + '"></span><span class="nm"></span><button class="rm" type="button" aria-label="移除素材">×</button>';
        chip.querySelector('.nm').textContent = m.name || '素材';
        chip.querySelector('.rm').addEventListener('click', () => {
          pickedMaterials.splice(index, 1);
          renderPickedMaterials();
        });
        list.appendChild(chip);
      });
    }

    function pickedPromptLine() {
      if (pickedMaterials.length === 0) return '';
      return '参考素材：' + pickedMaterials.map((m) => m.name).filter(Boolean).join('、');
    }

    function openMaterialPicker() {
      try { sessionStorage.setItem('jco-make-input', askInp.value); } catch (e) {}
      const page = 'J.Co工作台-素材.html?pick=1&return=' + encodeURIComponent('J.Co工作台-做视频.html');
      if (typeof window.__jcoGo === 'function') window.__jcoGo(page);
      else location.href = page;
    }

    (function restorePickedMaterials() {
      try {
        const raw = sessionStorage.getItem('jco-picked-materials');
        if (!raw) return;
        sessionStorage.removeItem('jco-picked-materials');
        const data = JSON.parse(raw);
        const items = data && Array.isArray(data.items) ? data.items : [];
        pickedMaterials = items.filter((m) => m && m.name).slice(0, 12);
        renderPickedMaterials();
        if (pickedMaterials.length > 0) {
          setTimeout(() => showToast('已带回 ' + pickedMaterials.length + ' 件素材，会作为这次的创作参考。'), 200);
        }
      } catch (e) {}
    })();
    let brandProfile = null;
    function brandLine() {
      if (!brandProfile || typeof brandProfile !== 'object') return '';
      return window.jcoBrandText ? window.jcoBrandText(brandProfile) : '';
    }
    function withBrand(base) {
      var brand = brandLine();
      return brand ? base + '\n' + brand : base;
    }
    function shotSystemPrompt() {
      return withBrand('你是短视频分镜师，服务通用自媒体创作者；行业、受众、平台由品牌档案决定。只输出 JSON 数组。');
    }
    function imageSystemPrompt() {
      return withBrand('你是短视频画面策划，只输出画面描述行，不要解释。');
    }
    async function hydrateBrandProfile() {
      if (!window.jco || !window.jco.brand || !window.jco.brand.get) return;
      try {
        var res = await window.jco.brand.get();
        if (res && res.ok) brandProfile = res.data || null;
      } catch (e) {}
    }

    /* ================= 数据 ================= */
    const RATIOS = {
      video: [
        { v: '9:16', tip: '竖屏，发抖音、视频号、小红书' },
        { v: '16:9', tip: '横屏，发 B站、公众号视频' },
        { v: '1:1', tip: '方形，朋友圈、头条也适用' },
      ],
      image: [
        { v: '3:4', tip: '小红书图文首选' },
        { v: '9:16', tip: '封面 / 竖屏物料' },
        { v: '1:1', tip: '方图，朋友圈、头像' },
      ],
    };
    const VIDEO_DURATIONS = [
      { v: '5 秒', tip: '一条口播开头的时间' },
      { v: '10 秒', tip: '一个完整卖点' },
      { v: '30 秒', tip: '口播常用，讲清一件事（推荐）' },
      { v: '1 分钟', tip: '讲两三个卖点，抖音也能发' },
      { v: '3 分钟', tip: '长视频：AI 分段生成，再自动拼接' },
      { v: '5 分钟', tip: '长视频：讲深讲透，适合 B站、视频号' },
    ];
    const RES = {
      video: [
        { v: '720P', tip: 'Agnes 视频当前只支持 720P，平台都认' },
      ],
      image: [
        { v: '1K', tip: '够发出去用' },
        { v: '2K', tip: '清楚细腻（推荐）' },
        { v: '4K', tip: '放大也不糊，生成更慢' },
      ],
    };
    const VOICES = ['标准女声', '沉稳男声', '我自己录'];
    const COUNTS = [
      { v: '1 张', tip: '一张封面够用' },
      { v: '3 张', tip: '配图常用（推荐）' },
      { v: '5 张', tip: '整篇图文都用它' },

    function cleanLines(text) {
      return String(text).split('\n').map((l) => l
        .replace(/^#{1,6}\s*/, '')

    /** 解析分镜：优先 JSON 数组，失败回退按行 */
    function parseShots(text) {
      let t = String(text).trim();
      t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      const start = t.indexOf('[');
      const end = t.lastIndexOf(']');
      if (start >= 0 && end > start) t = t.slice(start, end + 1);
      try {
        const parsed = JSON.parse(t);
        const arr = Array.isArray(parsed) ? parsed : (parsed && typeof parsed === 'object' ? [parsed] : null);
        if (Array.isArray(arr)) {
          const shots = arr
            .map((x) => ({ line: String((x && x.line) || '').trim(), pic: String((x && x.pic) || '').trim() }))

          if (shots.length >= 1) return shots;
        }
      } catch (e) {}
      const lines = cleanLines(text);
      if (lines.length >= 1) {
        return lines
          .map((l) => {
            const parts = l.split(/[|｜]/);
            return { line: (parts[0] || '').trim(), pic: (parts[1] || '').trim() };
          })
          .filter((x) => x.line !== '');
      }
      return null;

        } else {
          const progress = MEDIA.videoProgress(d);
          amount = progress.total + ' 段' + (progress.done > 0 ? ' · 已出 ' + progress.done : '');
        }
        card.innerHTML = '<span class="dcover">' + coverHtml + '<span class="dcorner badge ' + st.cls + '">' + (d.status === 'generating' ? ('生成中 ' + Math.round(d.progress) + '%') : st.text) + '</span></span>' +
          '<span class="dbody"><span class="dname"></span><span class="dsub"><span class="dmeta"></span><span class="dtime"></span></span>' +
          (d.status === 'generating' ? '<span class="dprog"><span class="dfill"></span></span>' : '') +
          '</span>';
        card.querySelector('.dname').textContent = draftTitle(d);
        card.querySelector('.dmeta').textContent = d.ratio + ' · ' + amount;
        card.querySelector('.dtime').textContent = d.status === 'generating' ? '后台生成中' : '点开看详情';
        if (d.status === 'generating') {
          const f = card.querySelector('.dfill');
          if (f) f.style.transform = 'scaleX(' + (d.progress / 100) + ')';
        }
        card.addEventListener('click', () => { openDraft(d.id); });
        el.appendChild(card);
      });
      // 生成中的草稿由 startGen* 显式落盘；稳定状态在这里收口。
      if (!drafts.some(function (d) { return d.status === 'generating'; })) jcoDraftsSave();
    }

    function phoneClassFor(d) {
      if (d.ratio === '16:9') return 'phone wide';
      if (d.ratio === '1:1') return 'phone square';
      return 'phone';
    }

    function openDraft(id, silent) {
      const d = drafts.find((x) => x.id === id);
      if (!d) return;
      currentDraft = d;
      try { sessionStorage.setItem('jco-make-last-draft', String(d.id)); } catch (e) {}
      if (d.type === 'image') d.images = MEDIA.normalizeImages(d.images);
      const done = $('done');
      done.classList.add('show');
      const st = STATUS_META[d.status] || STATUS_META.review;
      $('dStatus').className = 'badge ' + st.cls;
      $('dStatus').textContent = st.text;
      $('ibStatus').className = 'badge ' + st.cls;
      $('ibStatus').textContent = st.text;
      $('donePhone').className = phoneClassFor(d);
      const isImage = d.type === 'image';
      $('imgBoard').style.display = isImage ? 'flex' : 'none';
      document.querySelector('.done .board').style.display = isImage ? 'none' : 'flex';
      if (isImage) {
        imgIdx = 0;
        renderImgBoard();
      } else {
        $('donePhoneTxt').textContent = d.ratio + ' · ' + d.duration;
        const shotCount = Array.isArray(d.shots) ? d.shots.length : 0;
        const titleText = d.idea || '未命名草稿';
        $('doneTitle').textContent = titleText;
        const seconds = MEDIA.shotSecondsFor(d.duration, shotCount);
        const voiceTxt = d.method === 'assemble' ? (' · 配音偏好：' + d.voice + '（成片暂不含配音）') : '';
        $('doneMeta').textContent = d.ratio + ' · ' + d.res + ' · ' + d.duration + voiceTxt + ' · 共 ' + shotCount + ' 段 · 每段约 ' + seconds + ' 秒' + (d.status === 'generating' ? ' · ' + (d.stepText || '生成中') : '');
        renderShots();
      }
      $('approveBtn').textContent = d.status === 'approved' ? '去发布' : '这版可以了';
      $('ibApprove').textContent = d.status === 'approved' ? '去发布' : '这版可以了';
      if (!silent) done.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function mediaJobToDraft(d, job) {
      if (!d || !job) return;
      d.progress = Number(job.progress) || 0;
      d.stepText = String(job.stepText || '');
      d.jobId = String(job.id || '');
      d.jobKind = job.kind === 'image' || job.kind === 'video' ? job.kind : '';
      if (job.status === 'running') d.status = 'generating';
      else if (job.status === 'interrupted' || job.status === 'canceled') {
        if (d.status === 'generating') d.status = 'interrupted';
      } else if (d.status === 'generating') d.status = 'review';
      if (
        job.kind === 'video' &&
        Array.isArray(job.items) &&
        (job.status === 'running' || job.status === 'interrupted' || job.status === 'canceled')
      ) {
        d.videos = d.videos || {};
        job.items.forEach((item) => {
          const index = Number(item && item.index);
          if (!Number.isFinite(index)) return;
          if (item.status === 'doing') {
            d.videos[index] = job.status === 'running' ? { status: 'doing' } : { status: 'failed', error: job.error || '任务已中断' };
          }
          else if (item.status === 'done') {
            d.videos[index] = { status: 'done', url: item.url || '', path: item.path || '', videoId: item.videoId || '' };
          } else if (item.status === 'failed') {
            d.videos[index] = { status: 'failed', error: item.error || '' };
          }
        });
        if (job.status === 'running' && Array.isArray(job.shots)) {
          const finished = new Set(
            job.items
              .filter((item) => item.status === 'done' || item.status === 'failed')
              .map((item) => Number(item.index)),
          );
          job.shots.forEach((shot) => {
            const index = Number(shot && shot.index);
            if (Number.isFinite(index) && !finished.has(index)) d.videos[index] = { status: 'doing' };
          });
        }
      }
    }

    async function refreshDraftFromStore(id) {
      if (!window.jco || !window.jco.drafts || !window.jco.drafts.get) return false;
      const res = await window.jco.drafts.get();
      if (!res || !res.ok) return false;
      const item = ((res.data && res.data.items) || []).find((draft) => Number(draft.id) === Number(id));
      if (!item) return false;
      const keepGenerating = Boolean(mediaJobState && mediaJobState.status === 'running' && Number(mediaJobState.draftId) === Number(id));
      const normalized = normalizeLoadedDraft(item, keepGenerating);
      const index = drafts.findIndex((draft) => Number(draft.id) === Number(id));
      if (index >= 0) drafts[index] = normalized;
      else drafts.unshift(normalized);
      if (currentDraft && Number(currentDraft.id) === Number(id)) openDraft(id, true);
      else renderDrafts();
      return true;
    }

    async function finishMediaJob(job) {
      if (!job) return;
      mediaRefreshing = true;
      let refreshed = false;
      try {
        refreshed = await refreshDraftFromStore(job.draftId);
      } finally {
        mediaRefreshing = false;
        if (refreshed) jcoDraftsSave();
      }
    }

    function scheduleDraftRefresh(id) {
      clearTimeout(mediaRefreshTimer);
      mediaRefreshTimer = setTimeout(() => {
        void refreshDraftFromStore(id);
      }, 250);
    }

    function stopMediaPoll() {
      if (mediaPollTimer) {
        clearInterval(mediaPollTimer);
        mediaPollTimer = null;
      }
    }

    function startMediaPoll() {
      stopMediaPoll();
      mediaPollTimer = setInterval(async () => {
        if (!mediaJobState || mediaJobState.status !== 'running') {
          stopMediaPoll();
          return;
        }
        const res = await window.jco.media.get(mediaJobState.id);
        if (!res || !res.ok || !res.job) return;
        mediaJobState = res.job;
        if (mediaJobState.status !== 'running') mediaRefreshing = true;
        const d = drafts.find((draft) => Number(draft.id) === Number(mediaJobState.draftId));
        if (d) {
          mediaJobToDraft(d, mediaJobState);
          if (mediaJobState.kind === 'image' && mediaJobState.status === 'running') {
            scheduleDraftRefresh(mediaJobState.draftId);
          }
          if (currentDraft && currentDraft.id === d.id) {
            renderDrafts();
            if (d.type === 'image') renderImgBoard();
            else renderShots();
          } else {
            renderDrafts();
          }
        }
        if (mediaJobState.status !== 'running') {
          stopMediaPoll();
          void finishMediaJob(mediaJobState);
        }
      }, 2000);
    }

    function attachMediaJob(job) {
      if (!job) return;
      mediaJobState = job;
      if (job.status !== 'running') mediaRefreshing = true;
      const d = drafts.find((draft) => Number(draft.id) === Number(job.draftId));
      if (d) {
        mediaJobToDraft(d, job);
        if (!currentDraft || Number(currentDraft.id) !== Number(d.id)) openDraft(d.id, true);
        else {
          renderDrafts();
          if (d.type === 'image') renderImgBoard();
          else renderShots();
        }
      }
      if (job.status === 'running') startMediaPoll();
      else {
        stopMediaPoll();
        void finishMediaJob(job);
      }
    }

    async function hydrateMediaJobs() {
      try {
        if (!window.jco || !window.jco.media || !window.jco.media.list) return;
        const res = await window.jco.media.list();
        if (!res || !res.ok) return;
        const jobs = Array.isArray(res.jobs) ? res.jobs : [];
        const latestByDraft = new Map();
        for (const job of jobs) {
          const key = Number(job.draftId);
          const previous = latestByDraft.get(key);
          const newer =
            !previous ||
            (job.status === 'running' && previous.status !== 'running') ||
            (job.status !== 'running' &&
              previous.status !== 'running' &&
              (Number(job.updatedAt) || 0) > (Number(previous.updatedAt) || 0));
          if (newer) latestByDraft.set(key, job);
        }
        for (const job of latestByDraft.values()) {
          if (job.status !== 'running' && job.status !== 'interrupted' && job.status !== 'canceled') continue;
          const d = drafts.find((draft) => Number(draft.id) === Number(job.draftId));
          if (d) mediaJobToDraft(d, job);
        }
        renderDrafts();
        let lastId = 0;
        try { lastId = Number(sessionStorage.getItem('jco-make-last-draft')) || 0; } catch (e) {}
        const lastDraft = drafts.find((draft) => Number(draft.id) === lastId) || drafts[0] || null;
        if (lastDraft) openDraft(lastDraft.id, true);
        const active =
          jobs.find((job) => job.status === 'running' && lastDraft && Number(job.draftId) === Number(lastDraft.id)) ||
          jobs.find((job) => job.status === 'running');
        if (active) attachMediaJob(active);
      } finally {
        mediaHydrating = false;
        if (!mediaJobState || mediaJobState.status !== 'running') jcoDraftsSave();
      }
    }

    async function cancelCurrentMediaJob() {
      if (!mediaJobState || !window.jco.media) return;
      const id = mediaJobState.id;
      const res = await window.jco.media.cancel(id);
      if (res && res.ok) {
        mediaJobState = res.job || mediaJobState;
        showToast('已停止生成，已完成的结果保留。');
        void finishMediaJob(mediaJobState);
      } else {
        showToast('停止失败：' + ((res && res.error) || '再试一次'));
      }
    }

    function draftReady(d) {
      if (!d) return false;
      if (d.status === 'generating' || d.status === 'interrupted') return false;
      if (d.type === 'image') return MEDIA.normalizeImages(d.images).length > 0;
      return MEDIA.videoProgress(d).complete;
    }

    function draftBlockedMessage(d) {
      if (!d) return '先打开一条草稿。';
      if (d.status === 'generating') return '这条还在后台生成，等任务结束再通过。';
      if (d.status === 'interrupted') return d.stepText || '上次生成被中断，先重试未完成项。';
      if (d.type === 'image') return '这版还没有可用图片，先点重画或再出几张。';
      const progress = MEDIA.videoProgress(d);
      if (progress.total === 0) return '这条还没有分镜，先点「换一版」重新生成。';
      return '还有 ' + (progress.total - progress.done) + ' 段没出片。先点「全部出片」或每段「出这段」，视频模型跑完再通过。';
    }

    function approveDraft() {
      if (!currentDraft) return;
      if (currentDraft.status === 'approved') {
        if (!draftReady(currentDraft)) { showToast(draftBlockedMessage(currentDraft)); return; }
        goPublish(currentDraft);
        return;
      }
      if (!draftReady(currentDraft)) {
        showToast(draftBlockedMessage(currentDraft));
        return;
      }
      currentDraft.status = 'approved';
      const st = STATUS_META.approved;
      $('dStatus').className = 'badge ' + st.cls;
      $('dStatus').textContent = st.text;
      $('ibStatus').className = 'badge ' + st.cls;
      $('ibStatus').textContent = st.text;
      $('approveBtn').textContent = '去发布';
      $('ibApprove').textContent = '去发布';
      renderDrafts();
      showToast('这版通过了，可以带成片去发布。草稿还在，随时能回来再改。');
    }

    function markAdjusted() {
      if (!currentDraft) return;
      if (currentDraft.status === 'approved' || currentDraft.status === 'generating') return;
      if (currentDraft.status === 'review') currentDraft.status = 'adjusted';
      const st = STATUS_META[currentDraft.status];
      $('dStatus').className = 'badge ' + st.cls;
      $('dStatus').textContent = st.text;
      $('ibStatus').className = 'badge ' + st.cls;
      $('ibStatus').textContent = st.text;
      renderDrafts();
    }

    /** 从草稿想法里提取一个像标题的名字（《xxx》优先，否则截断） */
    function draftTitleOf(d) {
      if (!d) return '';
      const m = /《([^》]+)》/.exec(d.idea || '');
      if (m) return m[1];
      return String(d.idea || '').slice(0, 30);
    }

    /** 带着这条成片去「发布」页（交接给下一页） */
    function goPublish(d) {
      if (!draftReady(d)) {
        showToast(draftBlockedMessage(d));
        return;
      }
      const doneVideos = d && d.videos
        ? Object.keys(d.videos)
            .map((key) => d.videos[key])
            .filter((item) => item && item.status === 'done')
        : [];
      const lastVideo = doneVideos.length ? doneVideos[doneVideos.length - 1] : null;
      try {
        sessionStorage.setItem('jco-publish-draft', JSON.stringify({
          title: draftTitleOf(d),
          ratio: d ? d.ratio : '',
          duration: d ? d.duration : '',
          videoPath: lastVideo ? (lastVideo.path || '') : '',
          videoUrl: lastVideo ? (lastVideo.url || '') : '',
        }));
      } catch (e) {}
      location.href = 'J.Co工作台-发布.html';
    }

    function startGen() {
      const idea = askInp.value.trim();
      if (!idea) return;
      // 「每步问我」模式：第一次点击先问一句，再点一次才真的开始
      let runMode = 'auto';
      try {
        const settings = (window.jco && window.jco.settings && window.jco.settings.getSync) ? window.jco.settings.getSync() : null;
        if (settings && settings.mode) runMode = settings.mode;
        else runMode = localStorage.getItem('jco-mode-v1') || 'auto';
      } catch (e) {}
      if (runMode === 'ask' && goBtn.dataset.confirm !== '1') {
        goBtn.dataset.confirm = '1';
        showToast('「每步问我」：再点一次「开始生成」就开始。');
        setTimeout(() => { if (goBtn.dataset.confirm === '1') goBtn.dataset.confirm = ''; }, 4000);
        return;
      }
      goBtn.dataset.confirm = '';
      askInp.value = '';
      inputChanged();
      askInp.style.height = 'auto';

      // 每生成一条 = 开一个草稿（实时记录在草稿卡上）
      const d = createDraft(idea);
      renderDrafts();
      $('drafts').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // 真模式（视频类）：真分镜生成；图片类与浏览器演示保持原流程
      if (JCO_KERNEL && state.type === 'video') { startGenReal(d, idea); return; }
      if (JCO_KERNEL && state.type === 'image') { startGenImageReal(d, idea); return; }

      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      p = 0;
      $('done').classList.remove('show');
      const list = stepsFor();
      const stepSpan = 100 / list.length;
      genTimer = setInterval(() => {
        p = Math.min(p + 2, 100);
        d.progress = p;
        if (p >= 100) {
          clearInterval(genTimer);
          genTimer = null;
          d.progress = 100;
          d.status = 'review';
          d.stepText = '';
          renderDrafts();
          openDraft(d.id);
          showToast(state.type === 'image'
            ? '图片方案出来了（预演图；在设置里填「画图修图」的 Key 后出真图）。'
            : '草稿出来了。每一段都摆好了，不顺眼的直接换，满意了再点「这版可以了」。');
        } else {
          d.stepText = list[Math.min(Math.floor(p / stepSpan), list.length - 1)].text;
          renderDrafts();
        }
      }, 100);
    }

    /** 真模式：调内核生成分镜（进度条走到 90% 等真实结果） */
    async function startGenReal(d, idea) {
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      p = 0;
      $('done').classList.remove('show');
      d.status = 'generating';
      d.stepText = 'AI 正在写分镜';
      jcoDraftsSave();
      const list = stepsFor();
      const stepSpan = 90 / list.length;
      genTimer = setInterval(() => {
        p = Math.min(p + 2, 90); // 封顶 90%：剩下一段留给真实生成
        d.progress = p;
        d.stepText = list[Math.min(Math.floor(p / stepSpan), list.length - 1)].text;
        renderDrafts();
      }, 240);
      const targetShots = MEDIA.targetShotCount(d.duration);
      const refs = pickedPromptLine();
      const input = [
        '我要做一条短视频：' + idea,
        '比例 ' + d.ratio + '，时长目标 ' + d.duration + '，清晰度 ' + d.res + '。',
        refs ? refs + '（画面和语气要参考这些素材）' : '',
        '给我 ' + targetShots + ' 个镜头的分镜，每段 4~12 秒，总时长尽量接近目标。',
        '输出一个 JSON 数组（不要 markdown 代码块、不要解释），每个元素形如：{"line":"这一句台词，口语、一句话","pic":"这个镜头的画面描述，简短，比如 用户采访片段·小李"}',
      ].filter(Boolean).join('\n');
      const res = await Promise.race([
        JCO_KERNEL.task({
          system: shotSystemPrompt(),
          input: input,
        }),
        new Promise((resolve) => setTimeout(() => resolve({ ok: false, error: '这次想太久了（超过 100 秒），再点一次试试。' }), 100000)),
      ]);
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      const shots = res && res.ok ? parseShots(res.text) : null;
      if (shots && shots.length >= 1) {
        d.shots = shots;
        d.progress = 100;
        d.status = 'review';
        d.stepText = '';
        renderDrafts();
        openDraft(d.id);
        jcoLogAdd('shot', draftTitleOf(d) || '一条分镜', '共 ' + shots.length + ' 段，待你过目');
        jcoNotifyDone('分镜好了', '共 ' + shots.length + ' 段，等你过目');
        showToast('分镜好了，共 ' + shots.length + ' 段。先审分镜；点「全部出片」或每段「出这段」才会调用视频模型。');
        return;
      }
      // 失败也保留工作态，回来能看到失败原因并重试。
      d.status = 'interrupted';
      d.stepText = '分镜没生成成：' + ((res && res.error) || '内容没解析出来');
      jcoDraftsSave();
      renderDrafts();
      showToast(d.stepText + '。再点「换一版」试试。');
    }

    /** 真模式（图片类）：内核先出画面方案，再逐张真画（用「画图修图」的配置） */
    async function startGenImageReal(d, idea) {
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      p = 0;
      $('done').classList.remove('show');
      d.status = 'generating';
      d.progress = 0;
      d.stepText = '读懂稿子重点';
      jcoDraftsSave();
      const list = stepsFor();
      const stepSpan = 90 / list.length;
      genTimer = setInterval(() => {
        p = Math.min(p + 2, 90);
        d.progress = p;
        d.stepText = list[Math.min(Math.floor(p / stepSpan), list.length - 1)].text;
        renderDrafts();
      }, 240);
      // 想画几张：读这条草稿创建时选的数量（1 张 / 3 张 / 5 张）
      const wanted = Math.max(1, Math.min(6, parseInt(d.duration, 10) || 3))
      const ratioWord = MEDIA.aspectWord(d.ratio)
      const imageResolution = d.res || '1K'
      const imageModel = configuredModel('image', '')
      const refs = pickedPromptLine()
      // 1) 画面方案（wanted 条描述）
      let prompts = []
      try {
        const planRes = await JCO_KERNEL.task({
          system: imageSystemPrompt(),
          input: '创作想法：' + idea + '\n' + (refs ? refs + '\n' : '') + '为这组图设计 ' + wanted + ' 个不同画面（' + ratioWord + '，当前品牌主题），每行一条简短描述，不要序号。',
        })
        if (planRes && planRes.ok && planRes.text) prompts = cleanLines(planRes.text).filter((l) => l.length > 3).slice(0, wanted)
      } catch (e) {}
      if (prompts.length === 0) prompts = [idea, idea + '（细节特写）', idea + '（场景全景）'].slice(0, wanted)
      prompts = MEDIA.ensurePromptCount(prompts, wanted, idea)
      if (genTimer) { clearInterval(genTimer); genTimer = null; }
      if (!window.jco || !window.jco.media || !window.jco.media.start) {
        d.status = 'interrupted';
        d.stepText = '当前环境不支持后台出图，请更新桌面应用。';
        jcoDraftsSave();
        showToast(d.stepText);
        return;
      }
      d.progress = 10;
      d.stepText = '图片模型出图中（后台任务）';
      d.jobKind = 'image';
      jcoDraftsSave();
      const jobRes = await window.jco.media.start({
        kind: 'image',
        draftId: d.id,
        prompts: prompts.map(function (prompt) { return ratioWord + '，' + prompt; }),
        ratio: d.ratio,
        res: imageResolution,
        sizePx: MEDIA.imageSizeFor(d.ratio, imageResolution),
        model: imageModel,
      });
      if (jobRes && jobRes.ok && jobRes.job) {
        attachMediaJob(jobRes.job);
        showToast('图片任务已转到后台，切页或刷新都不会丢。');
      } else {
        d.status = 'review';
        d.stepText = '';
        jcoDraftsSave();
        showToast('图片任务没启动：' + ((jobRes && jobRes.error) || '再试一次'));
      }
    }

    function regen() {
      if (!currentDraft) return;
      askInp.value = currentDraft.idea;
      inputChanged();
      startGen();
    }

    function renderShots() {
      const el = $('shots');
      el.innerHTML = '';
      const real = currentDraft && Array.isArray(currentDraft.shots) && currentDraft.shots.length > 0 ? currentDraft.shots : null;
      const rows = real || (!JCO_KERNEL ? SHOT_LINES.map((line, i) => ({ line: line, pic: PIC_POOL[i % PIC_POOL.length] })) : []);
      const shotSeconds = MEDIA.shotSecondsFor(currentDraft ? currentDraft.duration : '', rows.length);

      if (JCO_KERNEL && rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'shot-hint';
        empty.textContent = '这条还没有分镜。点「换一版」重新生成，或在下面说一句你的想法。';
        el.appendChild(empty);
        return;
      }

      // 真模式：全出片工具行（逐段出真视频，干完系统通知）
      if (JCO_KERNEL && rows.length > 0) {
        const videos = (currentDraft && currentDraft.videos) || {};
        const progress = MEDIA.videoProgress(currentDraft);
        const doneCount = progress.done;
        const doing = Object.values(videos).some((v) => v && v.status === 'doing');
        const bar = document.createElement('div');
        bar.className = 'shot-bar';
        const btn = document.createElement('button');
        btn.className = 'go-btn';
        const remain = rows.length - doneCount;
        const generating = currentDraft && currentDraft.status === 'generating';
        btn.textContent = generating ? '生成中…' : (doing ? '出片中……' : (doneCount > 0 && remain > 0 ? '继续出片（还差 ' + remain + ' 段）' : (remain === 0 ? '全部出好了' : '全部出片（' + rows.length + ' 段）')));
        btn.disabled = generating || doing || remain === 0;
        if (!btn.disabled) btn.addEventListener('click', () => makeAllVideos(rows));
        const hint = document.createElement('span');
        hint.className = 'shot-hint';
        hint.textContent = generating
          ? ((currentDraft.stepText || '后台生成中…') + ' · ' + Math.round(Number(currentDraft.progress) || 0) + '%')
          : (doing
          ? ('视频模型正在跑，别关窗口；干完弹通知')
          : (doneCount === 0
              ? '点「全部出片」才会调用视频模型；先审分镜，不满意可换画面'
              : (remain > 0
                  ? ('还差 ' + remain + ' 段 · 每段约 3~4 分钟 · 干完弹通知')
                  : '都出好了，点每段的「看这段」预览')));
        bar.appendChild(btn);
        bar.appendChild(hint);
        if (generating && currentDraft.jobId) {
          const stop = document.createElement('button');
          stop.className = 'ghost';
          stop.textContent = '停止生成';
          stop.addEventListener('click', () => void cancelCurrentMediaJob());
          bar.appendChild(stop);
        }
        el.appendChild(bar);
      }

      rows.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'shot';
        row.innerHTML = `
          <span class="no">${String(i + 1).padStart(2, '0')}</span>
          <span class="pic-thumb ti ti-player-play"></span>
          <span class="mid"><span class="line"></span><span class="pic"></span></span>
          <span class="dur">${shotSeconds} 秒</span>
          <button class="swap">换画面</button>`;
        row.querySelector('.line').textContent = item.line;

        const picThumb = row.querySelector('.pic-thumb');
        if (item.picSrc) {
          picThumb.classList.add('has-img');
          picThumb.innerHTML = '';
          picThumb.style.backgroundImage = 'url("' + String(item.picSrc).replace(/"/g, '%22') + '")';
        }

        // 真分镜保留模型给的画面描述；浏览器演示模式才用本机备选池轮换。
        let picIdx = -1;
        const picEl = row.querySelector('.pic');
        const paintPic = () => {
          picEl.textContent = '画面：' + (picIdx < 0 ? (item.pic || '现场画面') : PIC_POOL[picIdx % PIC_POOL.length]);
        };
        paintPic();
        const swap = row.querySelector('.swap');
        if (JCO_KERNEL) {
          const changing = currentDraft && currentDraft._changingPic === i;
          swap.textContent = changing ? '换画面中…' : '换画面';
          swap.disabled = changing;
          swap.addEventListener('click', () => changeShotPicture(i, item));
        } else {
          swap.addEventListener('click', () => {
            picIdx = (picIdx + 1) % PIC_POOL.length;
            paintPic();
            markAdjusted();
            showToast('第 ' + (i + 1) + ' 段换成了「' + PIC_POOL[picIdx] + '」。每一段都能这样换。');
          });
        }
        // 真模式：每段一个出片入口
        if (JCO_KERNEL) {
          const videos = (currentDraft && currentDraft.videos) || {};
          const vs = videos[i];
          const mk = document.createElement('button');
          mk.className = 'swap make';
          let reBtn = null;
          if (vs && vs.status === 'doing') {
            mk.textContent = '生成中…';
            mk.disabled = true;
          } else if (vs && vs.status === 'done') {
            mk.textContent = '看这段';
            mk.addEventListener('click', () => playShotVideo(vs.url, i));
            reBtn = document.createElement('button');
            reBtn.className = 'swap make';
            reBtn.textContent = '重出';
            reBtn.title = '按最新要求重出一版';
            reBtn.addEventListener('click', () => makeShotVideo(i, item));
          } else if (vs && vs.status === 'failed') {
            mk.textContent = '重试';
            mk.title = vs.error || '';
            mk.addEventListener('click', () => {
              if (vs && vs.error) showToast('上次失败：' + vs.error);
              makeShotVideo(i, item);
            });
          } else {
            mk.textContent = '出这段';
            mk.addEventListener('click', () => makeShotVideo(i, item));
          }
          row.appendChild(mk);
          if (reBtn) row.appendChild(reBtn);
        }
        el.appendChild(row);
      });
    }

    /** 真换画面：调用图片模型重画这一段的静帧，不再用固定演示词轮换。 */
    async function changeShotPicture(i, item) {
      if (!JCO_KERNEL || !currentDraft) return;
      if (currentDraft._changingPic === i) return;
      const d = currentDraft;
      d._changingPic = i;
      renderShots();
      const ratio = d.ratio || '9:16';
      const prompt = MEDIA.aspectWord(ratio) + '，' + (item.pic || item.line || '画面') + '；换一个不同构图和景别，保持同一主题和人物';
      let res = null;
      try {
        res = await JCO_KERNEL.draw({
          prompt: prompt,
          size: '1K',
          sizePx: MEDIA.imageSizeFor(ratio, '1K'),
          aspect: ratio,
          model: configuredModel('image', ''),
        });
      } catch (e) {
        res = { ok: false, error: String((e && e.message) || e) };
      }
      if (res && res.ok && (res.dataUrl || res.url)) {
        let src = res.dataUrl || res.url;
        let savedPath = '';
        try {
          const sys = window.jco && window.jco.sys;
          if (sys && sys.saveAsset) {
            const saved = await sys.saveAsset(res.dataUrl ? { kind: 'image', dataUrl: res.dataUrl } : { kind: 'image', url: res.url });
            if (saved && saved.ok && saved.path) {
              savedPath = saved.path;
              src = 'file:///' + String(saved.path).replace(/\\/g, '/');
            }
          }
        } catch (e) {}
        item.picSrc = src;
        item.picPath = savedPath;
        if (d.videos && d.videos[i]) delete d.videos[i];
        delete d._changingPic;
        markAdjusted();
        jcoDraftsSave();
        renderDrafts();
        renderShots();
        showToast('第 ' + (i + 1) + ' 段画面已重画。已出过的这段需要重新出片。');
      } else {
        delete d._changingPic;
        renderShots();
        showToast('第 ' + (i + 1) + ' 段没换成：' + ((res && res.error) || '再试一次'));
      }
    }

    /* ---------- 分段出真视频（Agnes 异步任务，单段约 3~4 分钟） ---------- */
    function shotJobPayload(d, i, item) {
      const shotCount = Array.isArray(d.shots) && d.shots.length > 0 ? d.shots.length : 1;
      return {
        index: i,
        seconds: MEDIA.shotSecondsFor(d.duration, shotCount),
        prompt: (item.pic ? item.pic + '。' : '') + (item.line || '') + (d.fixNote ? ('。（修改要求：' + d.fixNote + '）') : ''),
      };
    }

    async function startVideoJob(d, shots, label) {
      if (!window.jco || !window.jco.media || !window.jco.media.start) {
        showToast('当前环境不支持后台出片，请更新桌面应用。');
        return null;
      }
      d.status = 'generating';
      d.progress = 0;
      d.stepText = label;
      d.jobKind = 'video';
      jcoDraftsSave();
      renderDrafts();
      renderShots();
      const res = await window.jco.media.start({
        kind: 'video',
        draftId: d.id,
        shots: shots,
        ratio: d.ratio,
        res: '720P',
        model: configuredModel('video', ''),
      });
      if (res && res.ok && res.job) {
        attachMediaJob(res.job);
        showToast('视频任务已转到后台，切页或刷新都不会丢。');
        return res.job;
      }
      const errorText = (res && res.error) || '任务没启动';
      shots.forEach((shot) => {
        d.videos[shot.index] = { status: 'failed', error: errorText };
      });
      d.status = 'review';
      d.stepText = '';
      jcoDraftsSave();
      renderDrafts();
      renderShots();
      showToast('视频任务没启动：' + errorText);
      return null;
    }

    async function makeShotVideo(i, item) {
      if (!JCO_KERNEL || !currentDraft) {
        showToast('内核还没就绪，等两秒再试。');
        return;
      }
      if (!window.jco || !window.jco.media || !window.jco.media.start) {
        showToast('当前环境不支持后台出片，请更新桌面应用。');
        return;
      }
      const d = currentDraft;
      const videos = (d.videos = d.videos || {});
      if (videos[i] && videos[i].status === 'doing') return;
      videos[i] = { status: 'doing' };
      await startVideoJob(d, [shotJobPayload(d, i, item)], '准备出片（第 ' + (i + 1) + ' 段）');
    }

    async function makeAllVideos(rows) {
      if (!currentDraft || !JCO_KERNEL) return;
      if (!window.jco || !window.jco.media || !window.jco.media.start) {
        showToast('当前环境不支持后台出片，请更新桌面应用。');
        return;
      }
      const d = currentDraft;
      const videos = (d.videos = d.videos || {});
      const pending = [];
      rows.forEach((item, i) => {
        if (videos[i] && videos[i].status === 'done') return;
        videos[i] = { status: 'doing' };
        pending.push(shotJobPayload(d, i, item));
      });
      if (pending.length === 0) {
        showToast('这几段都已经出好了。');
        return;
      }
      await startVideoJob(d, pending, '准备出片（' + pending.length + ' 段）');
    }
    function playShotVideo(url, i) {
      const pop = document.getElementById('videoPop');
      const v = document.getElementById('vpVideo');
      if (!pop || !v || !url) return;
      const shotCount = currentDraft && Array.isArray(currentDraft.shots) && currentDraft.shots.length > 0 ? currentDraft.shots.length : 1;
      const seconds = MEDIA.shotSecondsFor(currentDraft ? currentDraft.duration : '', shotCount);
      document.getElementById('vpTitle').textContent = '第 ' + (i + 1) + ' 段 · ' + seconds + ' 秒 · 720P';
      v.src = url;
      pop.hidden = false;
      v.play().catch(() => {});
    }
    /* 整片连播（分段顺序播；自动拼接还没接上：如实标"分段连播"） */
    let wholeQueue = [];
    let wholeIdx = 0;
    function playWhole() {
      if (!currentDraft) { showToast('先开一张草稿，再点播放。'); return; }
      const videos = currentDraft.videos || {};
      const keys = Object.keys(videos).filter((k) => videos[k] && videos[k].status === 'done' && videos[k].url);
      keys.sort((a, b) => Number(a) - Number(b));
      wholeQueue = keys.map((k) => videos[k].url);
      if (wholeQueue.length === 0) { showToast('这段还没有出片：先点「全部出片」或每段的「出这段」。'); return; }
      wholeIdx = 0;
      openWholeVideo();
    }
    function openWholeVideo() {
      const pop = document.getElementById('videoPop');
      const v = document.getElementById('vpVideo');
      if (!pop || !v || wholeQueue.length === 0) return;
      const total = (currentDraft && Array.isArray(currentDraft.shots) && currentDraft.shots.length) || wholeQueue.length;
      document.getElementById('vpTitle').textContent =
        '整片 · 分段连播（' + (wholeIdx + 1) + '/' + wholeQueue.length + ' 段已出片' + (total > wholeQueue.length ? '，共 ' + total + ' 段；未出片的会略过' : '') + '）';
      v.src = wholeQueue[wholeIdx];
      pop.hidden = false;
      v.play().catch(() => {});
    }
    function closeVideoPop() {
      const pop = document.getElementById('videoPop');
      const v = document.getElementById('vpVideo');
      if (!pop) return;
      pop.hidden = true;
      wholeQueue = [];
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    }
    (function bindVideoPop() {
      const pop = document.getElementById('videoPop');
      const close = document.getElementById('vpClose');
      const v = document.getElementById('vpVideo');
      if (close) close.addEventListener('click', closeVideoPop);
      if (pop) pop.addEventListener('click', (e) => { if (e.target === pop) closeVideoPop(); });
      if (v)
        v.addEventListener('ended', () => {
          if (!pop || pop.hidden || wholeQueue.length === 0) return;
          wholeIdx += 1;
          if (wholeIdx < wholeQueue.length) openWholeVideo();
          else wholeQueue = [];
        });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideoPop(); });
    })();

    /* ---------- 图片草稿：大图随选随修（框住哪里、修哪里） ---------- */
    let imgIdx = 0;
    const IMG_COUNT = 3;
    let selRect = null;
    let dragOn = false;
    let dragSx = 0;
    let dragSy = 0;

    function imgClass(i) { return 'g' + ((i % 3) + 1); }

    function clearSel() {
      selRect = null;
      const sel = $('ibSel');
      sel.className = 'ib-sel';
      sel.style.display = 'none';
      const tip = $('ibTip');
      tip.textContent = '在图上拖框，圈住要改的地方（比如那行字、那个背景），再告诉 AI 改成什么';
      tip.classList.remove('on');
    }

    function renderImgBoard() {
      const big = $('ibBig');
      const ibStop = $('ibStop');
      if (ibStop) ibStop.hidden = !(currentDraft && currentDraft.status === 'generating');
      if (currentDraft) {
        const st = STATUS_META[currentDraft.status] || STATUS_META.review;
        $('ibStatus').className = 'badge ' + st.cls;
        $('ibStatus').textContent = currentDraft.status === 'generating'
          ? ('生成中 ' + Math.round(Number(currentDraft.progress) || 0) + '%')
          : st.text;
      }
      const normalized = currentDraft ? MEDIA.normalizeImages(currentDraft.images) : [];
      if (currentDraft) currentDraft.images = normalized;
      const realImgs = normalized.length > 0 ? normalized : null;
      const count = realImgs ? realImgs.length : IMG_COUNT;
      if (imgIdx >= count) imgIdx = 0;
      big.className = 'ib-big ' + imgClass(imgIdx);
      $('ibCount').textContent = (imgIdx + 1) + ' / ' + count;
      const anchors = [1, 3, 6];
      $('ibTitle').textContent = '配图 ' + (imgIdx + 1) + ' · 放在稿子第 ' + anchors[imgIdx % 3] + ' 段旁边';
      clearSel();
      // 真图：大图区显示真实图片（占位图标藏起来）
      const oldImg = big.querySelector('.ib-img');
      if (oldImg) oldImg.remove();
      const phIcon = big.querySelector('.ti-photo');
      if (phIcon) phIcon.style.display = realImgs ? 'none' : '';
      if (realImgs && realImgs[imgIdx]) {
        const img = document.createElement('img');
        img.className = 'ib-img';
        img.src = realImgs[imgIdx].src;
        img.alt = realImgs[imgIdx].prompt || '';
        big.insertBefore(img, big.firstChild);
      }
      const thumbs = $('ibThumbs');
      thumbs.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const t = document.createElement('button');
        t.className = 'ib-thumb ' + imgClass(i) + (i === imgIdx ? ' on' : '');
        t.setAttribute('aria-label', '选择第 ' + (i + 1) + ' 张');
        t.innerHTML = realImgs && realImgs[i]
          ? ''
          : '<span class="ti ti-photo"></span>';
        if (realImgs && realImgs[i]) {
          const ti = document.createElement('img');
          ti.src = realImgs[i].src;
          ti.alt = '';
          t.appendChild(ti);
        }
        t.addEventListener('click', () => { imgIdx = i; renderImgBoard(); });
        thumbs.appendChild(t);
      }
      const add = document.createElement('button');
      add.className = 'ib-add';
      add.textContent = '＋';
      add.setAttribute('aria-label', '再出几张');
      add.addEventListener('click', async () => {
        if (!JCO_KERNEL || !currentDraft || !Array.isArray(currentDraft.images) || currentDraft.images.length === 0) {
          showToast('先生成一版图，这里就能继续加画。');
          return;
        }
        showToast('再画 3 张……');
        const d = currentDraft;
        const ratioWord = MEDIA.aspectWord(d.ratio);
        const imageResolution = d.res || '1K';
        const imageModel = configuredModel('image', '');
        const base = d.idea || '画面';
        const existing = MEDIA.normalizeImages(d.images);
        const more = [];
        for (let i = 0; i < 3; i++) {
          let r = null;
          try {
            r = await JCO_KERNEL.draw({
              prompt: ratioWord + '，' + base + '（第 ' + (existing.length + i + 1) + ' 个角度，与已有画面不重复）',
              size: imageResolution,
              sizePx: MEDIA.imageSizeFor(d.ratio, imageResolution),
              aspect: d.ratio,
              model: imageModel,
            });
          } catch (e) {
            r = { ok: false, error: String((e && e.message) || e) };
          }
          if (r && r.ok && (r.dataUrl || r.url)) {
            let src = r.dataUrl || r.url;
            let savedPath = '';
            try {
              const sys = window.jco && window.jco.sys;
              if (sys && sys.saveAsset) {
                const saved = await sys.saveAsset(r.dataUrl ? { kind: 'image', dataUrl: r.dataUrl } : { kind: 'image', url: r.url });
                if (saved && saved.ok && saved.path) {
                  savedPath = saved.path;
                  src = 'file:///' + String(saved.path).replace(/\\/g, '/');
                }
              }
            } catch (e) {}
            more.push({ src: src, path: savedPath, prompt: base });
          }
        }
        if (more.length === 0) { showToast('没画出来，再试一次。'); return; }
        d.images = existing.concat(more);
        jcoDraftsSave();
        renderDrafts();
        renderImgBoard();
        jcoLogAdd('material', 'AI 加图', more.length + ' 张');
        jcoNotifyDone('图好了', '又加了 ' + more.length + ' 张');
        showToast('加了 ' + more.length + ' 张，点缩略图看。');
      });
      thumbs.appendChild(add);
    }

    function ibStep(d) {
      const normalized = currentDraft ? MEDIA.normalizeImages(currentDraft.images) : [];
      const realImgs = normalized.length > 0 ? normalized : null;
      const count = realImgs ? realImgs.length : IMG_COUNT;
      imgIdx = (imgIdx + d + count) % count;
      renderImgBoard();
    }

    /* 在图上拖框 = 选中要修的地方 */
    (function bindSelDrag() {
      const big = $('ibBig');
      big.addEventListener('mousedown', (e) => {
        if (e.target.closest('.ib-nav')) return;
        e.preventDefault();
        dragOn = true;
        const r = big.getBoundingClientRect();
        dragSx = Math.min(Math.max(e.clientX - r.left, 0), r.width);
        dragSy = Math.min(Math.max(e.clientY - r.top, 0), r.height);
        const sel = $('ibSel');
        sel.className = 'ib-sel';
        sel.style.left = dragSx + 'px';
        sel.style.top = dragSy + 'px';
        sel.style.width = '0px';
        sel.style.height = '0px';
        sel.style.display = 'block';
      });
      window.addEventListener('mousemove', (e) => {
        if (!dragOn) return;
        const r = big.getBoundingClientRect();
        const cx = Math.min(Math.max(e.clientX - r.left, 0), r.width);
        const cy = Math.min(Math.max(e.clientY - r.top, 0), r.height);
        const x = Math.min(dragSx, cx);
        const y = Math.min(dragSy, cy);
        const w = Math.abs(cx - dragSx);
        const h = Math.abs(cy - dragSy);
        const sel = $('ibSel');
        sel.style.left = x + 'px';
        sel.style.top = y + 'px';
        sel.style.width = w + 'px';
        sel.style.height = h + 'px';
      });
      window.addEventListener('mouseup', () => {
        if (!dragOn) return;
        dragOn = false;
        const sel = $('ibSel');
        const w = parseFloat(sel.style.width);
        const h = parseFloat(sel.style.height);
        if (w < 12 || h < 12) { clearSel(); return; }
        sel.classList.add('show');
        selRect = { x: parseFloat(sel.style.left), y: parseFloat(sel.style.top), w, h };
        const tip = $('ibTip');
        tip.textContent = '已框住一块。说一句把它改成什么，点「修这里」，只改这块，其它地方不动';
        tip.classList.add('on');
      });
    })();

    async function ibFix() {
      if (!selRect) { showToast('先在图上拖住鼠标，框住要改的地方'); return; }
      const v = $('ibFixInp').value.trim();
      if (!v) { showToast('说一句把这块改成什么，比如：换成“新的项目名称”'); return; }
      $('ibFixInp').value = '';
      const sel = $('ibSel');
      if (!JCO_KERNEL || !currentDraft || !Array.isArray(currentDraft.images) || currentDraft.images.length === 0) {
        showToast('这版还没有真图可改：先在底部写要求生成一版图。');
        return;
      }
      currentDraft.images = MEDIA.normalizeImages(currentDraft.images);
      if (currentDraft.images.length === 0) {
        showToast('这版还没有可用图片：先生成一版图。');
        return;
      }
      sel.classList.add('working');
      const base = (currentDraft.images[imgIdx] && currentDraft.images[imgIdx].prompt) || currentDraft.idea || '画面';
      const ratioWord = MEDIA.aspectWord(currentDraft.ratio);
      let r = null;
      try {
        r = await JCO_KERNEL.draw({
          prompt: ratioWord + '，' + base + '；按这个要求调整：' + v + '（整图重绘）',
          size: currentDraft.res || '1K',
          sizePx: MEDIA.imageSizeFor(currentDraft.ratio, currentDraft.res),
          aspect: currentDraft.ratio,
          model: configuredModel('image', ''),
        });
      } catch (e) {
        r = { ok: false, error: String((e && e.message) || e) };
      }
      sel.classList.remove('working');
      sel.style.display = 'none';
      selRect = null;
      if (r && r.ok && (r.dataUrl || r.url)) {
        let src = r.dataUrl || r.url;

        openMenu = menu;
      }
      function render() {
        box.innerHTML = '';
        var add = document.createElement('button');
        add.className = 'convo new-btn';
        add.innerHTML = '<span class="ti ti-plus"></span>新会话';
        add.addEventListener('click', function (e) { e.stopPropagation(); go('new'); });
        // 「新会话」按钮位：顶部搜索框下方（M7 全站统一；找不到容器时回退列表内）
        var slot = document.getElementById('newChatSlot');
        if (slot) {
          slot.innerHTML = '';
          slot.appendChild(add);
        } else {
          box.appendChild(add);
        }
        data.chats.slice(0, 8).forEach(function (c) {
          var b = document.createElement('button');
          b.className = 'convo' + (c.id === data.activeId ? ' active' : '');
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = c.title || '新会话';
          b.appendChild(nm);
          var more = document.createElement('span');
          more.className = 'convo-more';
          more.setAttribute('role', 'button');
          more.setAttribute('tabindex', '0');
          more.setAttribute('aria-label', '更多操作');
          more.textContent = '⋯';
          more.addEventListener('click', function (e) { e.stopPropagation(); showMenu(more, c); });
          more.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); showMenu(more, c); } });
          b.appendChild(more);
          b.addEventListener('click', function (e) { e.stopPropagation(); go(c.id); });
          box.appendChild(b);
        });
      }
      render();
    })();
  
  </script>
  
</body>
</html>
